title = "Powerpacks gitleaks configuration"

[extend]
useDefault = true

[[allowlists]]
description = "Public Auth0 PKCE client ID in explicit Powerset-hosted env example"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = [
  '''packs/powerset/templates/env\.powerset\.example''',
]
regexes = [
  '''POWERPACKS_AUTH0_CLIENT_ID=U7p09NWeJ0jy9M4GiaWa4cz0YVCdDVBl''',
]

[[allowlists]]
description = "Historical public Auth0 PKCE client ID defaults removed from code"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = [
  '''packs/messages/primitives/powerset_auth/powerset_auth\.py''',
  '''packs/powerset/primitives/auth/auth\.py''',
]
regexes = [
  '''POWERPACKS_AUTH0_CLIENT_ID", "U7p09NWeJ0jy9M4GiaWa4cz0YVCdDVBl''',
]

[[allowlists]]
description = "Synthetic retired LinkedIn identifier pinned by deep-context migration tests"
targetRules = ["linkedin-client-secret"]
condition = "AND"
regexTarget = "line"
paths = [
  '''tests/test_deep_context_candidates\.py''',
]
regexes = [
  '''LEGACY\s*=\s*"message-linkedin:[a-f0-9]{16}"''',
]

# Obviously synthetic fixture: message-linkedin:0123456789abcdef.
# Fingerprints from the all-refs scan:
# 2bd2a425ca24a781cb4dc5a9b06adb8318bf6024:tests/test_review_db.py:linkedin-client-secret:46
# 2bd2a425ca24a781cb4dc5a9b06adb8318bf6024:tests/test_review_db.py:linkedin-client-secret:102
# 2bd2a425ca24a781cb4dc5a9b06adb8318bf6024:tests/test_review_db.py:linkedin-client-secret:103
# 2bd2a425ca24a781cb4dc5a9b06adb8318bf6024:tests/test_review_db.py:linkedin-client-secret:152
[[allowlists]]
description = "Synthetic review DB LinkedIn fixture on retired branches"
targetRules = ["linkedin-client-secret"]
condition = "AND"
commits = ["2bd2a425ca24a781cb4dc5a9b06adb8318bf6024"]
regexTarget = "line"
paths = [
  '''tests/test_review_db\.py''',
]
regexes = [
  '''message-linkedin:0123456789abcdef''',
]
