<!doctype html>
<html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'>
<meta name='color-scheme' content='dark'><title>Share · Powerpacks</title>
<link rel='stylesheet' href='/share/assets/results.css'><link rel='stylesheet' href='/share/assets/share.css'></head>
<body><div class='app-shell share-shell' data-share>
  <header class='topbar'><a class='brand' href='/share'>POWERPACKS</a><h1 class='topbar-title'>Share</h1>
    <nav class='topbar-nav' aria-label='Local UI'><a href='http://127.0.0.1:8766/'>Searches</a><a href='/share' aria-current='page'>Share</a><a href='/directory'>People</a></nav></header>
  <div class='share-layout'>
    <aside class='rail' data-rail aria-label='Filters'></aside>
    <main class='share-main'>
      <section class='share-head' data-head></section>
      <section class='quick' data-quick aria-label='Quick filters'></section>
      <section class='bar' data-bar>
        <input type='search' class='field bar-search' data-search placeholder='Search name, title, company, location' aria-label='Search people'>
        <span class='chip-row bar-chips' data-chips></span>
        <span class='bar-count num' data-count aria-live='polite'></span>
      </section>
      <section class='grid' data-grid>
        <div class='grid-head' role='row' data-grid-head></div>
        <div class='grid-viewport' data-viewport tabindex='0' role='table' aria-label='People'>
          <div class='grid-spacer' data-spacer><div class='grid-rows' data-rows></div></div>
        </div>
        <p class='grid-empty' data-empty hidden></p>
      </section>
    </main>
  </div>
  <aside class='drawer' data-drawer hidden aria-label='Person'></aside>
  <div class='bulkbar' data-bulkbar hidden role='toolbar' aria-label='Selection'></div>
  <div class='toast' role='status' aria-live='polite'></div>
</div><script src='/share/assets/share.js' defer></script></body></html>
