[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "powerpacks-results-viewer"
version = "1.8.2"
description = "The shared Powerpacks search-results renderer and snapshot contract."
requires-python = ">=3.10"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.wheel.force-include]
"../../packs/search/primitives/deep_search/results_web/__init__.py" = "packs/search/primitives/deep_search/results_web/__init__.py"
"../../packs/search/primitives/deep_search/results_web/model.py" = "packs/search/primitives/deep_search/results_web/model.py"
"../../packs/search/primitives/deep_search/results_web/rendering.py" = "packs/search/primitives/deep_search/results_web/rendering.py"
"../../packs/search/primitives/deep_search/results_web/snapshot.py" = "packs/search/primitives/deep_search/results_web/snapshot.py"
"../../packs/search/primitives/deep_search/results_web/feedback_payload.py" = "packs/search/primitives/deep_search/results_web/feedback_payload.py"
"../../packs/search/primitives/deep_search/results_web/results.html" = "packs/search/primitives/deep_search/results_web/results.html"
"../../packs/search/primitives/deep_search/results_web/results.css" = "packs/search/primitives/deep_search/results_web/results.css"
"../../packs/search/primitives/deep_search/results_web/results.js" = "packs/search/primitives/deep_search/results_web/results.js"
"../../packs/search/primitives/shared/human_ratings.py" = "packs/search/primitives/shared/human_ratings.py"
