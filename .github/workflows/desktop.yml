name: desktop

# Builds the macOS app and its .dmg (desktop/) with the bundled runtime, and keeps the .dmg.
on:
  push:
    paths: ["desktop/**", "web/dist/**", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["desktop/**", "web/dist/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: Build macOS dmg
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - run: pnpm install --frozen-lockfile
      - run: scripts/bundle-runtime.sh aarch64-apple-darwin
      - run: pnpm tauri build --bundles app,dmg
        env:
          # Test builds carry the debug menu (page jumps, skip setup).
          POWERPACKS_DEBUG_MENU: "1"
      - uses: actions/upload-artifact@v4
        with:
          name: Powerpacks-macos-arm64
          path: desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
