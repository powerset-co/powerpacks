name: desktop

# Built at release only (Release Please calls this workflow for the stable Apple Silicon build
# without the debug menu) or by hand: a macOS minute costs ten Linux ones, and the build took
# 15 minutes on every PR and every main merge. By hand: a test build with the debug menu
# ("release" off), downloaded from that run's artifacts. Apple Silicon only for now.
on:
  workflow_dispatch:
    inputs:
      release:
        description: Build without the debug menu.
        type: boolean
        default: false
      ref:
        description: Git ref to build.
        type: string
        required: true
  workflow_call:
    inputs:
      ref:
        description: Git ref to build.
        type: string
        required: true
      release:
        description: A build for people to download, without the test builds' debug menu.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build macOS dmg
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - run: pnpm install --frozen-lockfile
      - run: scripts/bundle-runtime.sh aarch64-apple-darwin
        shell: bash
      # With the Apple secrets set (desktop/README.md "Signing"), the macOS build is signed with
      # the Developer ID certificate and notarized, so it opens without a Gatekeeper warning.
      # Without them it is signed ad hoc (tauri.conf.json) and needs "Open Anyway" once: an unset
      # secret reads as an empty string, and Tauri tries to import any APPLE_* it finds.
      - run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                      APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_CONTENT; do
            [ -n "${!name}" ] || unset "$name"
          done
          # Test builds carry the debug menu (page jumps, skip setup); release builds do not.
          [ "$RELEASE" = "true" ] || export POWERPACKS_DEBUG_MENU=1
          config=()
          if [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            printf '%s' "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/AuthKey.p8"
            export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
            config=(--config "{\"bundle\":{\"macOS\":{\"signingIdentity\":\"$APPLE_SIGNING_IDENTITY\"}}}")
          fi
          pnpm tauri build --bundles app "${config[@]}"
        shell: bash
        env:
          RELEASE: ${{ inputs.release }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # Powerpacks' Google OAuth client for Gmail (a Desktop-app client in the same Google
          # Cloud project as search.powerset.dev), baked into the app; unset builds skip Gmail.
          POWERPACKS_GOOGLE_CLIENT_ID: ${{ secrets.POWERPACKS_GOOGLE_CLIENT_ID }}
          POWERPACKS_GOOGLE_CLIENT_SECRET: ${{ secrets.POWERPACKS_GOOGLE_CLIENT_SECRET }}
          # Developer ID signing (Tauri imports the certificate into a temporary keychain).
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # Notarization through an App Store Connect API key.
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
      # The dmg: dmgbuild writes the drag-to-Applications window itself (desktop/dmg/settings.py);
      # Tauri's dmg step needs Finder, which the runner cannot drive, and shipped a plain listing.
      # The runner's Python runs it (the bundled uv is the app's, Intel on the Intel leg). The
      # app inside is what Tauri signed and notarized; the disk image itself carries no
      # signature (Gatekeeper judges the app).
      - name: Package the dmg
        run: |
          out=$BUNDLE/dmg
          mkdir -p "$out"
          python3 -m venv "$RUNNER_TEMP/dmgbuild"
          "$RUNNER_TEMP/dmgbuild/bin/pip" install --quiet dmgbuild
          PP_APP=$BUNDLE/macos/Powerpacks.app \
          PP_BG=dmg/dmg-background.png \
          PP_ICON=src-tauri/icons/icon.icns \
            "$RUNNER_TEMP/dmgbuild/bin/dmgbuild" -s dmg/settings.py Powerpacks "$out/Powerpacks-macos-$ARCH.dmg"
        shell: bash
        env:
          BUNDLE: src-tauri/target/release/bundle
          ARCH: arm64
      - uses: actions/upload-artifact@v4
        with:
          name: Powerpacks-macos-arm64
          path: desktop/src-tauri/target/release/bundle/dmg/*.dmg
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Powerpacks-macos-arm64-updater
          path: |
            desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz
            desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
          retention-days: 7
          if-no-files-found: error

