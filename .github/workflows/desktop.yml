name: desktop

# Every main merge publishes the debug build to Edge. Release Please calls this workflow
# separately for stable builds without the debug menu.
on:
  push:
    branches: [main]
  pull_request:
    paths: ["desktop/**", "web/dist/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:
    inputs:
      release:
        description: Build without the debug menu.
        type: boolean
        default: false
      ref:
        description: Git ref to build.
        type: string
        required: true
  workflow_call:
    inputs:
      ref:
        description: Git ref to build.
        type: string
        required: true
      release:
        description: A build for people to download, without the test builds' debug menu.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build macOS dmg
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - run: pnpm install --frozen-lockfile
      - run: scripts/bundle-runtime.sh aarch64-apple-darwin
        shell: bash
      # With the Apple secrets set (desktop/README.md "Signing"), the macOS build is signed with
      # the Developer ID certificate and notarized, so it opens without a Gatekeeper warning.
      # Without them it is signed ad hoc (tauri.conf.json) and needs "Open Anyway" once: an unset
      # secret reads as an empty string, and Tauri tries to import any APPLE_* it finds.
      - run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                      APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_CONTENT; do
            [ -n "${!name}" ] || unset "$name"
          done
          # Test builds carry the debug menu (page jumps, skip setup); release builds do not.
          [ "$RELEASE" = "true" ] || export POWERPACKS_DEBUG_MENU=1
          config=()
          if [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            printf '%s' "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/AuthKey.p8"
            export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
            config=(--config "{\"bundle\":{\"macOS\":{\"signingIdentity\":\"$APPLE_SIGNING_IDENTITY\"}}}")
          fi
          pnpm tauri build --bundles app "${config[@]}"
        shell: bash
        env:
          RELEASE: ${{ inputs.release }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # Powerpacks' Google OAuth client for Gmail (a Desktop-app client in the same Google
          # Cloud project as search.powerset.dev), baked into the app; unset builds skip Gmail.
          POWERPACKS_GOOGLE_CLIENT_ID: ${{ secrets.POWERPACKS_GOOGLE_CLIENT_ID }}
          POWERPACKS_GOOGLE_CLIENT_SECRET: ${{ secrets.POWERPACKS_GOOGLE_CLIENT_SECRET }}
          # Developer ID signing (Tauri imports the certificate into a temporary keychain).
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # Notarization through an App Store Connect API key.
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
      # The dmg: dmgbuild writes the drag-to-Applications window itself (desktop/dmg/settings.py);
      # Tauri's dmg step needs Finder, which the runner cannot drive, and shipped a plain listing.
      # The bundled uv runs it with no install step. The app inside is what Tauri signed and
      # notarized; the disk image itself carries no signature (Gatekeeper judges the app).
      - name: Package the dmg
        run: |
          out=src-tauri/target/release/bundle/dmg
          mkdir -p "$out"
          PP_APP=src-tauri/target/release/bundle/macos/Powerpacks.app \
          PP_BG=dmg/dmg-background.png \
          PP_ICON=src-tauri/icons/icon.icns \
            src-tauri/binaries/uv-aarch64-apple-darwin run --no-project --with dmgbuild \
              dmgbuild -s dmg/settings.py Powerpacks "$out/Powerpacks-macos-arm64.dmg"
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: Powerpacks-macos-arm64
          path: desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Powerpacks-macos-arm64-updater
          path: |
            desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz
            desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error

  edge:
    needs: build
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && !inputs.ref }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Powerpacks-macos-arm64
          path: dmg
      - name: Publish Edge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Edge (${GITHUB_SHA:0:7})"
          printf 'Debug build from main at `%s`. Includes the debug menu.\n' "$GITHUB_SHA" > notes.md
          if gh release view edge --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh api "repos/$GITHUB_REPOSITORY/git/refs/tags/edge" --method PATCH \
              -f sha="$GITHUB_SHA" -F force=true
            gh release edit edge --repo "$GITHUB_REPOSITORY" --title "$title" \
              --notes-file notes.md --prerelease --latest=false
          else
            gh release create edge --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "$title" --notes-file notes.md --prerelease --latest=false
          fi
          gh release upload edge dmg/Powerpacks-macos-arm64.dmg --clobber --repo "$GITHUB_REPOSITORY"
