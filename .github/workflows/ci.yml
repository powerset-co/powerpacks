name: ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deep-context-v2:
    name: Deep context v2 unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Set up Python
        run: bin/setup-python
      - name: Fast offline v2 tests and coverage
        run: scripts/test-deep-context-v2

  python:
    name: Python lint and offline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python
        run: bin/setup-python
      - name: Lint baseline
        run: scripts/lint-powerpacks
      - name: Offline unit tests
        run: scripts/test-powerpacks

  web:
    name: Web app check, build and committed dist
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Gmail consent policy
        run: node --test ../tests/test_msgvault_consent.js
      - name: Typecheck, lint, format and unit tests
        run: pnpm check
      - name: Committed dist is the build of the source
        run: pnpm build && git diff --exit-code -- dist
