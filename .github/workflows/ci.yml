name: ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same PR cancels the run in progress; main's runs queue instead.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # What the change touches: a web-only diff skips the Python suite and vice versa. The two
  # Node tests under tests/ belong to both. A hand-run checks everything.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      python: ${{ steps.diff.outputs.python }}
      web: ${{ steps.diff.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
            echo "python=true" >> "$GITHUB_OUTPUT"; echo "web=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "$base" "${{ github.sha }}")
          web_only='^(web/|tests/test_msgvault_consent\.js|tests/test_browser_picker\.js)'
          python_only='^(packs/|bin/|scripts/|tests/|pyproject\.toml|uv\.lock|\.python-version)'
          if echo "$files" | grep -vE "$web_only" | grep -q .; then echo "python=true" >> "$GITHUB_OUTPUT"; else echo "python=false" >> "$GITHUB_OUTPUT"; fi
          if echo "$files" | grep -vE "$python_only" | grep -q . || echo "$files" | grep -qE '^tests/test_(msgvault_consent|browser_picker)\.js'; then echo "web=true" >> "$GITHUB_OUTPUT"; else echo "web=false" >> "$GITHUB_OUTPUT"; fi
          echo "files: $(echo "$files" | wc -l | tr -d ' ')"; cat "$GITHUB_OUTPUT"

  deep-context-v2:
    name: Deep context v2 unit tests
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Set up Python
        run: bin/setup-python
      - name: Fast offline v2 tests and coverage
        run: scripts/test-deep-context-v2

  python:
    name: Python lint and offline tests
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    # The suite takes about five minutes; a hang once held a runner for an hour.
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python
        run: bin/setup-python
      - name: Lint baseline
        run: scripts/lint-powerpacks
      - name: Offline unit tests
        run: scripts/test-powerpacks

  web:
    name: Web app check, build and committed dist
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Gmail consent policy
        run: node --test ../tests/test_msgvault_consent.js
      - name: Browser picker
        run: node --test ../tests/test_browser_picker.js
      - name: Typecheck, lint, format and unit tests
        run: pnpm check
      - name: Committed dist is the build of the source
        run: pnpm build && git diff --exit-code -- dist
