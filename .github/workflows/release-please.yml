name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
      # powerset.dev/powerpacks serves the install skill from `stable`, and the skill
      # runs `stable`'s bootstrap, so both always match the newest release.
      # Release candidates (tags with "-rc") leave it alone.
      - if: ${{ steps.release.outputs.release_created && !contains(steps.release.outputs.tag_name, '-rc') }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
      - if: ${{ steps.release.outputs.release_created && !contains(steps.release.outputs.tag_name, '-rc') }}
        run: git push --force origin "${{ steps.release.outputs.tag_name }}^{commit}:refs/heads/stable"

  # Each release carries the Mac app for both chips, built without the debug menu, under fixed
  # names so releases/latest/download/Powerpacks-macos-arm64.dmg (and -x64) is always the newest
  # (README.md). A release made with github.token fires no `release` event, so the build is
  # chained here.
  desktop:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    uses: ./.github/workflows/desktop.yml
    with:
      release: true
      ref: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit

  attach-desktop:
    needs: [release-please, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Powerpacks-macos-*
          path: built
      # One latest.json names both chips; the app asks for its own (darwin-aarch64, darwin-x86_64).
      - run: |
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          for arch in arm64 x64; do
            cp built/Powerpacks-macos-$arch/*.dmg Powerpacks-macos-$arch.dmg
            cp built/Powerpacks-macos-$arch-updater/*.app.tar.gz Powerpacks-macos-$arch.app.tar.gz
          done
          jq -n \
            --arg version "${TAG#powerpacks-v}" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --rawfile arm64 built/Powerpacks-macos-arm64-updater/*.app.tar.gz.sig \
            --rawfile x64 built/Powerpacks-macos-x64-updater/*.app.tar.gz.sig \
            --arg arm64_url "$base/Powerpacks-macos-arm64.app.tar.gz" \
            --arg x64_url "$base/Powerpacks-macos-x64.app.tar.gz" \
            '{version: $version, pub_date: $pub_date, platforms: {
               "darwin-aarch64": {signature: ($arm64 | rtrimstr("\n")), url: $arm64_url},
               "darwin-x86_64": {signature: ($x64 | rtrimstr("\n")), url: $x64_url}}}' \
            > latest.json
          gh release upload "$TAG" Powerpacks-macos-arm64.dmg Powerpacks-macos-arm64.app.tar.gz \
            Powerpacks-macos-x64.dmg Powerpacks-macos-x64.app.tar.gz latest.json \
            --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
