[project]
name = "powerpacks"
version = "3.21.1"
description = "Portable people-search skills, primitives, schemas, and contracts for agent runtimes."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.4.0",
    "httpx>=0.28,<1",
    "jsonschema>=4.21",
    "jinja2>=3.1.6",
    "markdown-it-py>=4.0",
    "modal>=1.5.0",
    "nameparser==2.3.0",
    "openai>=1.0.0",
    "parallel-web==1.1.0",
    "psycopg2-binary>=2.9.10",
    "pyarrow>=18.0.0",
    "pydantic>=2.11",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
    "snowballstemmer>=3.0.1",
    "tiktoken>=0.12.0",
    "turbopuffer>=1.12.1",
]

[dependency-groups]
dev = [
    "flake8>=7.1.0",
    "mypy>=2.4.0",
    "ruff>=0.9.7",
]

[tool.mypy]
python_version = "3.12"
files = [
    "packs/ingestion/primitives/deep_context_v2",
    "packs/ingestion/primitives/share",
    "packs/indexing/primitives/upload_powerset",
]
explicit_package_bases = true
namespace_packages = true
follow_imports = "silent"
ignore_missing_imports = true
warn_return_any = true
disallow_any_generics = true
no_implicit_optional = true

[tool.ruff]
extend-exclude = [
    ".git",
    ".powerpacks",
    "__pycache__",
    "adapters/nanoclaw/runtime/nanoclaw",
    "docs",
]
line-length = 120

[tool.ruff.lint]
ignore = ["E402", "E501"]

[tool.flake8]
exclude = [
    ".git",
    ".powerpacks",
    "__pycache__",
    "adapters/nanoclaw/runtime/nanoclaw",
    "docs",
]
extend-ignore = ["E203", "E402", "E501", "W503"]
max-line-length = 120
