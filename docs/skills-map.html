ults for real estate exposure\"), use the scoring primitive instead of\ngrepping manually. For search/refinement requests, run a new Sales Nav search:\n\n```bash\nuv run --project . python packs/sales-nav/primitives/score_sales_nav_leads/score_sales_nav_leads.py \\\n  --state .powerpacks/sales-nav/runs/<run>/state.json \\\n  --criteria \"real estate exposure\" \\\n  --threshold 0.7\n```\n\nIt fans out over `leads.jsonl`, includes joined mutual context, writes only\nmatching leads to `scores/<criteria>/matches.jsonl`, and writes the user-facing\n`matches.csv`. Non-matches are not written unless `--dump-debug` is passed.\n\n## Manual workflow / debugging reference\n\nThe normal workflow is the orchestrator loop above. The lower-level sequence\nbelow documents what the orchestrator is doing and is useful when a block fails\nor a power user wants to call primitives directly.\n\n### Step 0 \u2014 Confirm prereqs\n\n```bash\nuv run --project . python packs/powerset/primitives/mcp_install/mcp_install.py status --host all\n```\n\nIf `installed: false` for the host the user is on, route to\n`$powerset setup` first.\n\n### Step 0b \u2014 Resolve set scope\n\nIf the user provided a `set_id`, use it. Otherwise run:\n\n```bash\nuv run --project . python packs/search/primitives/resolve_set_operators/resolve_set_operators.py \\\n  --env-file .env\n```\n\nUse the returned `set_id` in Sales Nav MCP calls. The returned\n`operator_ids` are useful for parity with local TurboPuffer searches, but the\nSales Nav MCP is still scoped by `set_id`.\n\n### Step 1 \u2014 Decide whether to resolve filters\n\nIf the user gave you free-text companies or titles, call\n`sales_nav_resolve` first to convert them into stable IDs / canonical\nstrings. If there is a single obvious recommended company/title match, proceed\nwithout asking. Ask the user only when multiple plausible matches are genuinely\nambiguous (for example many unrelated \"Cisco\" entities and no exact/obvious\nmatch):\n\n```text\nTool: sales_nav_resolve\nArgs: {\n  \"set_id\": \"<the user's set>\",\n  \"companies\": [\"Stripe\", \"Ramp\"],\n  \"titles\": [\"staff engineer\", \"principal engineer\"]\n}\n```\n\nIf the user already gave you a `company_id` or `function_id`, skip this\nand go straight to step 2.\n\nResolution robustness:\n\n- LinkedIn company URLs should be passed directly to `sales_nav_resolve`; the\n  server can resolve vanity slugs such as `linkedin.com/company/genies-inc`.\n- Endowment / investment office / foundation phrases often name a team rather\n  than a LinkedIn company. Resolve the parent institution too. Example:\n  `\"Dartmouth endowment\"` should be tried with `\"Dartmouth\"` /\n  `\"Dartmouth College\"`, then the search plan should use the parent org ID plus\n  finance/investment keywords and a parent company-only fallback.\n- If the first resolve call returns no company matches, do not stop. Retry once\n  in the same turn with cleaned parent/name variants before telling the user it\n  cannot be resolved.\n- If a current-company search returns 0 for a resolved org, keep the same org\n  ID and run a past-company query next. Only use keyword fallback after the\n  structured current/past company paths are empty or unavailable.\n\nMode defaults:\n\n- \"who works at Brookfield\" / \"who's in my extended network at Cisco\" \u2192 company\n  search. Resolve company, search it, ingest full artifact content, enrich the\n  visible page, export.\n- \"who works at Brookfield in the finance department\" \u2192 same company search plus\n  finance intent. Use reliable Sales Nav filters if known (`function_ids`), and\n  also pass targeted `keywords`/`title` when helpful. If the first query is too\n  sparse, retry once or twice by relaxing the weakest text filter while keeping\n  the company/set fixed.\n- \"show me people with real estate exposure\" after a Sales Nav run \u2192 run a new\n  Sales Nav search with the updated criteria. Do not scan previous `leads.jsonl`\n  or local artifacts for refinement.\n\n### Step 2 \u2014 Run the search (always with persistence)\n\nInitialize the local file store before the MCP call if you have not already.\n\n```text\nTool: sales_nav_search\nArgs: {\n  \"set_id\":         \"<the user's set>\",\n  \"conversation_id\":\"<UUID \u2014 see conversation_id playbook>\",\n  \"persist_artifact\": true,\n  \"company_ids\":    [...],         // from sales_nav_resolve\n  \"company_names\":  {\"<org_id>\": \"<display name>\"},\n  \"past_company_ids\": [...],       // alumni / worked-at searches\n  \"past_company_names\": {\"<org_id>\": \"<display name>\"},\n  \"title\":          \"staff engineer\",\n  \"function_ids\":   [...],\n  \"seniority_ids\":  [...],\n  \"geography_ids\":  [...],\n  \"headcount_ids\":  [...],\n  \"keywords\":       \"distributed systems\",\n  \"count\":          25,            // max 25 per page\n  \"start_offset\":   0\n}\n```\n\nResponse shape (with persistence):\n\n```jsonc\n{\n  \"artifact_id\": \"...\",\n  \"artifact\": { /* metadata */ },\n  \"total_count\": 1342,\n  \"max_total_count\": 2500,\n  \"results_returned\": 25,\n  \"has_more\": true,\n  \"next_start_offset\": 25,\n  \"filters_used\": { /* what the server actually filtered on */ },\n  \"reconnect_required\": false,\n  \"leads\": [\n    {\n      \"name\": \"...\",\n      \"headline\": \"...\",\n      \"linkedin_url\": \"...\",\n      \"company\": \"...\",\n      \"location\": \"...\",\n      \"mutual_count\": 3,\n      \"mutual_member_ids\": [\"...\", \"...\"]\n    }\n  ]\n}\n```\n\n`reconnect_required: true` means the user's Unipile/LinkedIn session\nneeds upstream re-auth; tell the user and stop. Do not retry.\n\nSave the MCP response for audit, but ingest the full artifact content: call\n`get_artifact` with `include_content: true`, save that response, then run\n`sales_nav_artifacts ingest-page --prefer-content` on it. The primitive records\n`artifact_id`, lead rows, mutual edges, and source/operator metadata in local\nhandoff files.\n\nThen enrich the visible leads by default:\n\n```text\nTool: enrich_extended_profiles\nArgs: {\n  \"conversation_id\": \"<same conversation_id>\",\n  \"member_ids\": [<member_ids from this visible page>],\n  \"set_id\": \"<same set_id>\"\n}\n```\n\nAfter enrichment, call `get_artifact(include_content=true)` again and ingest\nwith `--prefer-content`. This is what puts full profile data (`summary`,\n`experiences`, `education`) into `leads.jsonl`.\n\nEvery follow-up retrieval (next page, mutual lookup, re-display) should use the\nlocal state path plus `get_artifact` / `sales_nav_resolve_member_ids` as needed.\n\n### Step 3 \u2014 Present the first page\n\n- Lead with `total_count`, `results_returned`, and any non-zero `mutual`\n  counts.\n- For each lead present `name`, `headline`, `company`, `location`,\n  `mutual_count`, and `linkedin_url`.\n- Mention `artifact_id` to the user (they may want to reference it across\n  turns / sessions).\n- If `has_more`, ask if they want page N+1 \u2014 do **not** auto-fetch.\n\n### Step 4 \u2014 Paginate via get_artifact\n\nSubsequent pages of the same result set should go through\n`get_artifact`, not a fresh `sales_nav_search`. Save each page response and\nappend it to the same local files with `sales_nav_artifacts ingest-page`:\n\n```text\nTool: get_artifact\nArgs: {\n  \"artifact_id\":     \"<from step 2>\",\n  \"offset\":          25,\n  \"limit\":           25,\n  \"include_content\": true    // prefer full accumulated lead shape for local files\n}\n```\n\nThis avoids re-running an expensive Sales Nav fetch and keeps the\nfilters/result-set stable across pages. For each retrieved page, prefer\n`include_content=true` + `ingest-page --prefer-content` so local files keep the\nfull accumulated lead shape. The local primitive dedupes by `member_id` and\nappends new lead\u2194mutual edges to `mutuals.jsonl`.\n\n### Step 5 \u2014 Refining filters\n\nRefining upstream Sales Nav filters is a **new search**, not pagination. Re-call\n`sales_nav_search` with the new args, the same `conversation_id`, and\n`persist_artifact: true`. You'll get back a new `artifact_id`. Tell the\nuser the artifact id changed.\n\nRefining over already-loaded people is a **new Sales Nav search**. For\nquestions like \"which of these have real estate exposure\", \"who is in NYC\", or\n\"show the Brookfield VPs with mutuals\", do not scan local state first. Re-call\n`sales_nav_search` with the updated filters and `persist_artifact: true`.\n\n| User says | What changes |\n| --- | --- |\n| \"next page\" | `get_artifact` with `offset += 25` |\n| \"narrow to NYC\" | new `sales_nav_search` with `geography_ids` |\n| \"only senior+ folks\" | new `sales_nav_search` with `seniority_ids` |\n| \"filter to mid-stage companies\" | new `sales_nav_search` with `headcount_ids` |\n| \"show me their mutual\" | use current-run `mutual_member_ids`; do not scan prior artifacts |\n\n### Step 6 \u2014 Resuming a previous search\n\nDo not resume previous searches. If the user references a prior `artifact_id`\nwhile asking for search results, run a new search instead. Only call\n`get_artifact` for an old artifact when the user explicitly asks to inspect that\nartifact rather than run a search.\n\n## What this skill does NOT do\n\n- It does not write leads to your local `contacts.csv`. Lead \u2192 contact\n  promotion is a separate (future) `import-sales-nav-leads` skill, likely\n  also under `packs/sales-nav`.\n- It does not promote leads into the Powerset main set. That UI affordance\n  is on the web app today.\n- It does not run a sequence of pages on its own. Pagination is always\n  user-confirmed and goes through `get_artifact`.\n", "mcp_count": 4, "mcp_refs": ["enrich_extended_profiles", "sales_nav_resolve", "sales_nav_resolve_member_ids", "sales_nav_search"], "name": "sales-nav-search", "pack": "sales-nav", "path": "packs/sales-nav/skills/sales-nav-search/SKILL.md", "primitive_count": 4, "primitive_refs": ["resolve_set_operators", "sales_nav_artifacts", "sales_nav_pipeline", "score_sales_nav_leads"]}, {"description": "Find and rank people in your network or search from a job description. Use for discovery, recruiting and shortlists. A named person's dossier, or a list of people by relationship, label or tag (\\\"show me my family\\\"), is Deep Context's. Supports local and Powerset networks; company, SQL, and contact browsing use their own surfaces. Formerly $search-network.", "display_name": "powerset:search", "heading": "Search", "markdown": "---\nname: search\ndescription: \"Find and rank people in your network or search from a job description. Use for discovery, recruiting and shortlists. A named person's dossier, or a list of people by relationship, label or tag (\\\"show me my family\\\"), is Deep Context's. Supports local and Powerset networks; company, SQL, and contact browsing use their own surfaces. Formerly $search-network.\"\n---\n\n# Search\n\nFind and rank people through local or Powerset network retrieval.\n\nUse this for discovery and recruiting requests:\n\n- `$search software engineers in sf`\n- `$search local: product managers in nyc`\n- `$search https://jobs.lever.co/company/abc123`   \u2190 deep JD \u2192 runs deep mode\n- `$search senior engineers at series a fintech companies`\n- `$search stanford engineers with 3-5 yoe in new york`\n- `$search people who work at OpenAI`\n\n> `$search` supersedes `$search-network` (the old name still works as an alias). The retrieval\n> primitive is still `search_network_pipeline.py` \u2014 only the skill/route was renamed.\n\nFor a named person's dossier, labels or relationships, or a list of people the user\nalready knows by relationship, label, tag or worth (\"show me my family\", \"who is tagged\ninvestor\", \"my close friends\"), follow `packs/ingestion/skills/deep-context/SKILL.md`\n(its lookup and people reads) and stop here. Those are reads of the People list, not searches.\nExplicit shared-network requests and recruiting stay on this skill. Requests\nfor people like someone continue through search below.\n\n## How to run this skill\n\nDeep JD searches send every hydrated candidate to the Jev capability screen; there\nis no separate cheap filter (`--capability-judge terra` restores the Luna filter and\nLuna rating screen). Candidates that pass receive parallel Terra qualification and Luna\nopportunity judgments. Terra independently rechecks Luna opportunity cap 2;\noverall is the lower of qualifications and the authoritative opportunity cap.\nThe viewer shows overall score and one explanation, sorted\nby overall then capability. Ratings 1\u20132 show \"Did not pass screen\". Saved human\nratings remain separate. Ordinary non-JD searches keep their existing reranker.\nDeep-mode results also get a private hosted snapshot when signed in to Powerset;\n`deep-mode.md` owns upload and refresh. Explicit offline/local-only requests stay local.\n\nThe pipeline generates pond queries, filters, and traits; review them for\ncorrectness, not extra specificity. Keep queries broad and positive and traits\nterse. Correct extraction or location errors against the user's request/JD,\npreserving intended breadth and OR alternatives. Do not add constraints, turn\npreferences into requirements, or pad queries with exclusions. Correct wording\nwhen needed; leave already-correct output alone. See `deep-mode.md` for review.\n\nBefore running, track these five steps in the harness's checklist:\n\n    1. Decide + record the search decision (decision.json)\n    2. Prepare the search (payload preview or deep query)\n    3. Review \u2014 confirm requirements with the user\n    4. Execute the search\n    5. Present results\n\nWork in order. A routed surface or deep mode owns steps 2\u20135 through its own skill.\n\n## Step 1 \u2014 Decide the route (you are the router)\n\nYou make this decision \u2014 there is no classifier to run. A one-liner, a pasted JD, and a\njob-posting URL all come through this same step and the same rules. Decide four things,\nrecord them, and only then act.\n\n<!-- decision-rules:start -->\nDecide `surface`, `backend`, `depth`, and `mode` for the query:\n\n1. **surface** \u2014 where the query belongs:\n   - `people` \u2014 any search for people, \"my contacts\" included. The default when unsure.\n   - `company` \u2014 the subject is companies (lookup / IDs / investors / funding / sector) and\n     no people are asked for. \"Engineers at companies backed by Sequoia\" is `people`.\n   - `sql` \u2014 the predicate needs cross-row or cross-person logic: per-person aggregates\n     (\"2+ startup stints\"), role ordering (\"engineers who became PMs\"), or a join against\n     another person (\"overlapped with Jane at Stripe\"). A person's name alone is NOT sql:\n     \"look up Jane Doe\" and \"who is Jane Doe\" are `people` lookups. Common words like\n     \"career\" or \"worked with <a technology>\" do not make a query sql.\n2. **backend** \u2014 which index runs the search. The user's explicit words always win:\n   - `powerset` \u2014 the user says \"powerset\", names a set, or says \"team/shared network\"\n     (even if they also say \"my network\": \"search my Powerset network\" is `powerset`).\n   - `local` \u2014 the user says \"local\", \"offline\", or \"my imported network/contacts\",\n     even if remote credentials exist.\n   - Unstated \u2192 environment default: if `POWERPACKS_LOCAL_SEARCH_DB` is set, or\n     `.powerpacks/search-index/local-search.duckdb` exists with no TurboPuffer credentials\n     configured, pick `local`; otherwise `powerset`. Both configured \u2192 `powerset`, and say\n     which you picked in one line so the user can flip it.\n   - Forced values: `sql` is always `local`; `company` is always `powerset`.\n3. **depth** \u2014 how hard to search (people surface only):\n   - `deep` \u2014 the input is a pasted JD or a job-posting URL, or the user asks for a\n     deep/thorough/judged run or names the deliverable (\"recruit ...\", \"build a shortlist\",\n     \"source candidates\"). Quality-superlative hiring intent also means deep when the request\n     supplies a role/domain to judge: \"best\", \"strongest\",\n     \"most exceptional\", \"top-tier\", or \"cracked\" candidates. A bare \"find me candidates\" with\n     no role context remains fast/clarify; do not fabricate a hiring profile.\n     A raw profile URL is not yet a supported deep-search intake: ask for the role/domain rather\n     than claiming the internal shortlist-anchor expansion can start from that URL.\n   - `fast` \u2014 everything else: one expansion \u2192 retrieval \u2192 rerank pass.\n   - Deep uses the result-driven loop: one broad query, ordinary\n     retrieval/filter/rerank, all retrieved results in the viewer,\n     then one plain continue-or-done question; the model\n     diagnoses and crafts each next query\n     itself. Auto mode caps at four ponds; an explicit interactive request for another round\n     is binding and can reopen a model-stopped run. Scores are display-only.\n4. **mode** \u2014 how deep ponds are reviewed:\n   - `interactive` \u2014 default. After each pond, open the results in the viewer and ask one\n     plain question: another round, or done? Diagnosis and the next query are the model's job.\n   - `auto` \u2014 only when the user explicitly says `auto` or `autonomous` in the request. Run the\n     existing autonomous loop and review the completed search at the end.\n   - Fast searches and non-people surfaces use `interactive`.\n5. Uncertain on any axis \u2192 `people` / the environment default / `fast` / `interactive`, and state the\n   uncertainty in `reason`. Never block on routing.\n<!-- decision-rules:end -->\n\nRecord the decision before anything runs (checklist item 1). Create the run dir with a short\nstable slug from the query (e.g. `swe-sf-stanford`) and write `decision.json` with this command\nand nothing else (no Python: the system interpreter has none of the project's packages):\n\n```bash\nmkdir -p .powerpacks/search/<slug> && cat > .powerpacks/search/<slug>/decision.json <<'EOF'\n{\"surface\": \"people\", \"backend\": \"powerset\", \"depth\": \"fast\", \"mode\": \"interactive\",\n \"reason\": \"<one sentence on why>\"}\nEOF\n```\n\nThe environment default for `backend` comes from one line that prints key names only, never\nvalues: `grep -o '^\\(POWERPACKS_LOCAL_SEARCH_DB\\|TURBOPUFFER_API_KEY\\)=' .env; ls .powerpacks/search-index/local-search.duckdb`.\n`local` when `POWERPACKS_LOCAL_SEARCH_DB` is listed, or the index file exists and\n`TURBOPUFFER_API_KEY` is not listed; otherwise `powerset`.\n\n- fast \u2192 `.powerpacks/search/<slug>/decision.json`, and pass the same dir as `--output-dir`\n  to `prepare` so the decision, payload, and outputs live together.\n- deep \u2192 `.powerpacks/deep-search/<jd-slug>/decision.json` (the engine's existing run dir).\n\nThen dispatch \u2014 this table is the whole routing contract:\n\n| decision | action |\n|---|---|\n| surface `company` | load `packs/search/skills/search-company/SKILL.md` (decision.json still written first) |\n| surface `sql` | load `packs/search/skills/search-sql/SKILL.md` (decision.json still written first) |\n| `people` + `fast` + `local` | **Local Happy Path** below (`search_network_pipeline.py prepare --backend local --db <db>`) |\n| `people` + `fast` + `powerset` | **TurboPuffer Happy Path** below (`search_network_pipeline.py prepare`) |\n| `people` + `deep` | load `packs/search/skills/search/deep-mode.md` (`--jd-file` / `--jd-url` as it documents; on backend `local` add `--backend local --db <db>` to `deep_search_loop.py`) |\n\nThe deep engine owns orchestration and delegates each reviewed pond to the\nordinary `search_network_pipeline.py prepare/run` path. Follow `deep-mode.md` so query,\ncompiled traits/filters, result deltas, diagnosis, and the one next move stay in the fixed\nsearch-harness artifact. There is no other deep engine.\n\nInput shapes normalize before `prepare`, never before the decision:\n\n- **backend directives are directives, not query text** \u2014 strip words like `local:`, \"offline\",\n  \"in powerset\", \"search powerset for\", or a set name from the text you pass as `--query`; they\n  bound the decision, and leaving them in pollutes query expansion.\n\n- **job-posting URL** \u2014 deep mode fetches it itself (`--jd-url`). Only when the user\n  explicitly forces `fast` on a URL, fetch first with\n  `uv run --project . python packs/search/primitives/deep_search/fetch_jd.py --url <url> --out <run>/jd.txt`\n  (a thin fetch under ~400 chars \u2192 ask for a paste; Ashby URLs resolve via the public\n  posting API automatically) and use the fetched text as the query.\n- **pasted JD forced to `fast`** \u2014 use the JD text directly as `--query`; expansion condenses it.\n- **one-liner** \u2014 the query as-is.\n\n**The spend gate (checklist item 3):** fast mode confirms the prepare preview once\n(`Search prepared. Execute or modify?`). Deep mode confirms its initial query and filters once \u2014 the only approval in\nthe flow. Interactive deep mode pauses after each pond only to ask continue-or-done at the\nviewer; auto deep mode runs all approved ponds without that pause.\n\n### Retrieval surface boundary\n\n`$search` people retrieval means the Powerpacks network surface: the `powerset` backend is\nset-scoped TurboPuffer/Postgres and the `local` backend is DuckDB. It is not Sales Navigator.\n\n- An explicit Powerset/network request stays on `$search` with `surface: people` and\n  `backend: powerset`, including retries, wider probes, adjacency, and sparse-result diagnosis.\n- Never treat Sales Nav or LinkedIn leads as an implicit fallback for a failed or weak `$search`\n  run. Ask before changing retrieval surfaces and keep artifacts/results separate unless the user\n  explicitly requests both.\n- If the user says only \"extended search\" and the conversation has not defined the surface, ask:\n  `Do you mean Sales Nav extended search, or regular Powerset network search?`\n\n---\n\n## Hiring seniority & hireability defaults\n\nThese apply to every hiring-intent search (a JD, a role brief, \"find\ncandidates\", \"people like X for this role\") in both local and TurboPuffer\nmodes, and they bind any fallback behavior too:\n\nThe order is **explicit user preferences > JD-supported inference > defaults**.\nApply these when reviewing the query and ordinary compiled payload. Defaults rank;\nthey do not silently become JD hard requirements. The user can override them at review.\n\n- **Derive the seniority target from level language, else use the general IC\n  range.** Map stated levels (\"senior\", \"staff+\", \"lead\", \"head of\") to\n  seniority bands. A candidate role with no explicit level uses\n  junior/mid/senior/staff. Never derive bands from years of\n  experience, team size, scope, or impact language \u2014 YOE is unreliable\n  (\"8+ years\" does not mean senior). Preserve extractor-inferred bands\n  unless they contradict the query.\n- **Explicit leadership language overrides the IC default.** Lead, head,\n  manager, director, VP, and C-suite searches use the corresponding bands;\n  never append negative title clauses to approximate seniority.\n- **\"People like <person>\"** anchors seniority to that person's current\n  role and band (same rule as the deep-search engine). If the anchor is still\n  ambiguous, ask exactly one question before executing: \"Hands-on IC\n  engineers only, or are technical leaders (VP/director/CTO) acceptable\n  if still hands-on?\"\n- **Preserve the user's stated constraints exactly; never add exclusions.** When the\n  user corrects a seniority interpretation, that correction binds every\n  subsequent search in the session \u2014 repeating a corrected mistake is the\n  worst outcome.\n- **On pipeline failure, do not improvise retrieval.** Report the failure\n  (the \"do not write new retrieval scripts\" rule still holds). If the\n  user explicitly asks for a manual fallback over the local index, the\n  fallback must apply these same seniority defaults \u2014 in particular,\n  never put founder/CEO/CTO into a technical-title pattern by default.\n\n---\n\n## Local Happy Path\n\nUses the local DuckDB search index - no TurboPuffer, Postgres, or set\nresolution. Retrieval stays local, but LLM filtering/reranking runs by default\nand sends the required candidate evidence to the configured OpenAI boundary.\nUse `--search-only` to skip those model stages entirely.\n\n1. Determine the DuckDB path:\n   - `$POWERPACKS_LOCAL_SEARCH_DB` if set\n   - Otherwise `.powerpacks/search-index/local-search.duckdb`\n\n2. If the DB file does not exist, tell the user to run\n   `$build-local-search-index` first and stop.\n\n3. Run:\n\n   ```bash\n   uv run --env-file .env --project . python packs/search/primitives/search_network_pipeline/search_network_pipeline.py prepare \\\n     --backend local \\\n     --query \"<user query>\" \\\n     --db \"<db-path>\" \\\n     --output-dir \".powerpacks/search/<slug>\"\n   ```\n\n   Use the same `<slug>` run dir where `decision.json` was recorded.\n\n4. Show the query without an agent-written targeting or filter summary.\n   Review the compiled filters for correctness: a role noun like \"product\n   managers\" must not silently become a `manager` seniority band.\n   If `runtime_notes` flags a broad search\n   (hard filters match more than ~60% of the index), surface that note and\n   recommend narrowing before executing \u2014 running LLM stages over most of\n   the index is usually a query problem, not a retrieval problem. If it\n   flags 0 matches or a suspiciously narrow pool, recommend `modify`. Then say exactly this\n   and nothing else (the chat shows the prepared search as a card):\n\n   `Search prepared. Execute or modify?`\n\n5. Apply the reply using **Execute or modify the preview** below.\n\n6. Follow **Execution progress** below while the command runs.\n\n### SQL assistance (local only)\n\nFor cross-row evidence, explicit SQL assistance, or zero matches in the preview\nor results, load [search-sql](../search-sql/SKILL.md#integration-with-a-parent-search)\nand follow its parent-search integration instructions. Ordinary row-level filters\ndo not need SQL assistance.\n\n### Local Constraints\n\n- LLM filter/rerank run by default and need `OPENAI_API_KEY`; if it is\n  missing, rerun with `--search-only` instead of failing the search\n- No set/operator resolution\n- No TurboPuffer or Postgres calls\n- Investors and set interactions have no local data: `prepare` drops those keys with a note.\n  Interactions with you (`operator_interaction_min/max`) are a local filter.\n\n---\n\n## TurboPuffer Happy Path\n\nDo not inspect repo docs, source, memory, prior transcripts, or prior result\nfiles on the happy path. Start a fresh run for every search request.\n\n1. Run:\n\n   ```bash\n   uv run --env-file .env --project . python packs/search/primitives/search_network_pipeline/search_network_pipeline.py prepare \\\n     --query \"<user query>\" \\\n     --output-dir \".powerpacks/search/<slug>\"\n   ```\n\n   Use the same `<slug>` run dir where `decision.json` was recorded. (Deep-engine delegated\n   profile searches pass their own output dir; follow the engine's instructions there.)\n\n2. If `prepare` returns a preview, say exactly this and nothing else (the chat shows the\n   prepared search as a card):\n\n   `Search prepared. Execute or modify?`\n\n3. Apply the reply using **Execute or modify the preview** below.\n   `execute_command` already includes `--execute-approved`; do not ask for another approval.\n   - If a **limit** was provided (e.g. by the deep-search engine for a\n     capped profile search), append `--limit <N>` to the execute_command (or\n     pass `--limit` to `prepare`, which threads it through). This caps\n     retrieval and the whole downstream pipeline. For standalone user\n     searches, do not add a limit unless the user asks for one.\n4. Follow **Execution progress** below until the command finishes or emits a\n   concrete `blocked_approval` / `blocked_user_action`.\n\n## Execute or modify the preview\n\nFor both local and Powerset previews:\n\n- `execute`: run the returned `execute_command` exactly in the background and read\n  its output as it arrives.\n- A reply starting `Modify, then execute:` is followed by one JSON object with any of\n  `query` (a string), `filters` (an object: `role_search_filters` keys with their JSON values as\n  the payload holds them, `null` to remove a key) and `traits` (the whole list of\n  `{value, temporal, meaning}`). The card sends only what the user changed against the preview\n  it showed: a key in `filters` is an edit, `traits` is present only when the traits changed,\n  and `query` only when the query changed. Save the object exactly as printed, never re-parsed,\n  to `<run>/card-edits.json`, where `<run>` is the preview's `--output-dir`:\n\n  ```bash\n  cat > <run>/card-edits.json <<'EOF'\n  <the JSON object as printed>\n  EOF\n  ```\n\n  The pipeline applies the edits and logs them in `<run>/user-edits.jsonl`: never edit the\n  payload file yourself and never log these edits yourself. Then:\n  - If `query` is present, or a trait's `value` changed, was added, or was removed against the\n    `traits` of the preview you showed (an empty `traits` list clears them): run a new `prepare`\n    with the same `--output-dir`, `--edits-json <run>/card-edits.json`, and `--query` set to the\n    sent `query` (restated around the sent traits when both came) or, when only the traits\n    changed, to the preview's query restated around the new traits. Keywords and filters never\n    go into the query: the filter edits ride along through `--edits-json`, and the traits come\n    from the restated query. Then show the new preview and ask the usual question, even though\n    the reply said `then execute`: a new prepare is a new search. Only `execute` on the new card\n    runs it; never run the old `execute_command` for a changed query or trait value.\n  - Otherwise run the returned `execute_command` with ` --edits-json <run>/card-edits.json`\n    appended, in the background, and read its output as it arrives. Filter and temporal-only\n    edits need no second `prepare` or approval.\n- A reply starting `Modify:` (no \"then execute\") comes from a blocked card: save the object the\n  same way and run a new `prepare` with the same `--output-dir`, `--edits-json`, and the query by\n  the rule above (the preview's own query when none was sent); then ask the usual question\n  again. Never run the search from this reply.\n- Any other reply is a modify in the user's words: write the same JSON object yourself and\n  follow the rules above.\n\n## Execution progress\n\nKeep execution quiet except for these milestones from `run`:\n\n- When it prints the screened count, say at once: `<N> screened, not ranked yet`; do not\n  present a ranked shortlist before ranking finishes.\n- When it prints the ranked count, say ranking has finished.\n\n## Final Summary\n\n- Say `<N> found`.\n- For local results, say `found (local)`.\n- In the Powerpacks desktop app (the developer instructions say you are its assistant), stop\n  there: the results pane beside the chat shows the ranked list.\n- Outside the app: say `Run artifacts: <artifact-dir>` and show the top 10 ranked rows from the\n  run's `csv` artifact as a Markdown table (rank, name, title/company, location, LinkedIn URL).\n\n## User edit & feedback capture\n\nQuery, filter and trait edits made through the card are logged by the pipeline (`--edits-json`\nand a re-prepare over the same `--output-dir`). Log pond edits and result notes yourself,\nimmediately:\n\n```bash\nuv run --env-file .env --project . python packs/search/primitives/search_feedback/search_feedback.py log \\\n  --run-dir <run> --kind <pond_edit|result_feedback> \\\n  --note \"<one line in the user's words>\" [--before \"<old value>\"] [--after \"<new value>\"]\n```\n\nUse identifiers only, never message content. At the end of a run with edits,\nsend once:\n\n```bash\nuv run --env-file .env --project . python packs/search/primitives/search_feedback/search_feedback.py send \\\n  --run-dir <run>\n```\n\n`needs_auth` is normal; keep the local log and do not request login. Concrete\nperson-data errors still use `$feedback`.\n\n## Execution Rules\n\n- Do not run the search before the user answers \"Search prepared. Execute or modify?\"; never\n  quote this rule or the checklist to the user.\n- Do not run doctor or setup checks before a normal search unless the primitive\n  fails with an unclear auth/env/setup error.\n- Do not use sub-agents for ordinary single-query searches except the local\n  SQL assistance described above.\n- Do not write new retrieval scripts during a search run.\n- For refinements after execution, create a new search with the updated query\n  or constraints. Before execution, edits go through `--edits-json` as described above.\n- Every Python command runs as `uv run --env-file .env --project . python \u2026`; the system\n  `python3` has none of the project's packages.\n- Do not mention skip-rerank, alternate execution modes, internal ledgers, or\n  internal artifact paths in the user-facing preview.\n\nThe packaged primitives own extraction, resolution, filtering, reranking, and\npersistence. Treat their output as authoritative and inspect internals only\nafter a failed or inconsistent run, or when the user asks to debug.\n", "mcp_count": 0, "mcp_refs": [], "name": "search", "pack": "search", "path": "packs/search/skills/search/SKILL.md", "primitive_count": 3, "primitive_refs": ["deep_search", "search_feedback", "search_network_pipeline"]}, {"description": "Resolve company names, company descriptions, investor/funding filters, or vertical queries into canonical TurboPuffer company IDs for downstream people search.", "display_name": "powerset:search-company", "heading": "Search Company", "markdown": "---\nname: search-company\ndescription: Resolve company names, company descriptions, investor/funding filters, or vertical queries into canonical TurboPuffer company IDs for downstream people search.\n---\n\n# Search Company\n\nUse this when the user asks for company search directly, or when they want the\ncompany set behind a people search inspected first.\n\nExamples:\n\n- `/search-company database companies`\n- `/search-company series b fintech startups in california`\n- `/search-company companies backed by sequoia`\n\n## Workflow\n\nFresh company resolution only: do not scan, discover, reuse, or resume prior\ncompany search artifacts, state files, CSVs, JSONL, or manifests. Resolve the\ncompany set from the user's current request every time.\n\n1. Decompose the request into the `role-search-filters` company fields only:\n   `company_names`, `company_semantic_queries`, `entity_types`, `sector_types`,\n   funding/headcount filters, company geography, `investor_names`, and\n   resolved `investors`. Preserve `set_id` when the user provides one.\n2. Resolve set scoping before company resolution. If the user did not provide a\n   `set_id`, run `resolve_set_operators` without `--set-id` so it inherits\n   `POWERPACKS_DEFAULT_SET_ID` / `POWERSET_DEFAULT_SET_ID`, or falls back to the\n   logged-in operator's active personal set. Copy the returned `operator_ids`\n   into the company resolver payload. Do not pass the raw set UUID as\n   `allowed_operator_ids`.\n3. If `investor_names` are present, run `resolve_investors` first and record or\n   copy the returned `investor_urns` into `investors`.\n4. Run `resolve_companies`.\n5. Present the returned company count, sample companies, set scope, and the company IDs\n   artifact/state path when available.\n6. If the user wants people at those companies, pass `company_ids` and\n   `operator_ids` into\n   `search`; for large company sets, use `apply_prefilters` so people\n   search batches company IDs instead of sending one giant `company_id In [...]`.\n\n## Query Guidance\n\nUse `company_semantic_queries` for vertical/domain intent, not just\n`sector_types`. Coarse sectors are useful, but the resolver needs an explicit\nsector strategy:\n\n- Use `company_sector_strategy: \"staged\"` by default for ambiguous domain\n  searches. This starts with sector-intersected semantic search and broadens if\n  the hard frontier is too small.\n- Use `company_sector_strategy: \"soft_union\"` when recall matters more than\n  precision or labels are known to be incomplete. This matches semantic results\n  OR sector-filter matches.\n- Use `company_sector_strategy: \"hard_filter\"` when the user explicitly wants\n  sector labels as a strict constraint.\n- Use `company_sector_strategy: \"semantic_only\"` when sector labels are too\n  noisy for the requested company domain.\n\nGood:\n\n```json\n{\n  \"company_semantic_queries\": [\n    \"Companies building database systems, hosted databases, data storage engines, database infrastructure, SQL or NoSQL databases, or developer platforms for managing application data.\"\n  ],\n  \"sector_types\": [\"data\"],\n  \"company_sector_strategy\": \"staged\",\n  \"company_sector_min_results\": 500\n}\n```\n\nBad:\n\n```json\n{ \"sector_types\": [\"data\"] }\n```\n\n## Commands\n\n```bash\nuv run --project . python packs/search/primitives/resolve_set_operators/resolve_set_operators.py \\\n  --payload-json '<json>' \\\n  --env-file .env\n```\n\n```bash\nuv run --project . python packs/search/primitives/resolve_investors/resolve_investors.py \\\n  --payload-json '<json>' \\\n  --env-file .env\n```\n\n```bash\nuv run --project . python packs/search/primitives/turbopuffer/turbopuffer_resolve_companies.py \\\n  --payload-json '<json>' \\\n  --env-file .env\n```\n", "mcp_count": 1, "mcp_refs": ["resolve_companies"], "name": "search-company", "pack": "search", "path": "packs/search/skills/search-company/SKILL.md", "primitive_count": 4, "primitive_refs": ["apply_prefilters", "resolve_investors", "resolve_set_operators", "turbopuffer"]}, {"description": "Read-only relational and aggregate people search over the local DuckDB: per-person aggregates, overlap joins, career ordering, and network analytics.", "display_name": "powerset:search-sql", "heading": "Search SQL (agentic SQL vertical)", "markdown": "---\nname: search-sql\ndescription: \"Read-only relational and aggregate people search over the local DuckDB: per-person aggregates, overlap joins, career ordering, and network analytics.\"\n---\n\n# Search SQL (agentic SQL vertical)\n\n> Created: 2026-06-11\n>\n> Change log:\n> - 2026-06-11: Initial version.\n\nRun read-only SQL against the local search DuckDB to answer people-search\nquestions that row-at-a-time filters and BM25/vector/regex retrieval cannot\nexpress. `$search` routes relational and aggregate questions here directly,\nor delegates a relational component or zero-result diagnostic to this skill.\n\n## When this vertical applies\n\n- **Per-person aggregates / career shape**: \"2+ stints at seed-stage\n  companies\", \"average tenure under 2 years\", \"was an engineer before\n  becoming a PM\", \"promoted internally at the same company\".\n- **Person-to-person joins**: \"people who overlapped with X at a company\",\n  \"schoolmates of X\", set algebra across two sub-populations.\n- **Diagnostics**: re-derive a population from raw columns when asked to debug\n  the main pipeline's extraction or filters.\n- **Network analytics**: aggregate questions about the network itself, not a\n  people list \u2014 \"which companies do I know the most people at\", \"how many of\n  my contacts changed jobs in the last 6 months\", \"what share of my network\n  is in SF\". Answer with the aggregate table, not candidates.\n- **Cohort/event queries**: \"everyone who left Acme Corp in 2023\"\n  (`end_date_epoch` windows per company), \"YC founders in my network\"\n  (`local_companies.yc_batches` joined to founder-titled positions).\n- **Intro pathfinding (experimental)**: \"who can intro me to John Doe\" \u2014\n  resolve John Doe's companies and date ranges, then overlap self-join to\n  find shared-tenure colleagues. Flag clearly that this is overlap-based\n  inference, not a verified relationship graph.\n\nPlain row-level searches (\"senior PMs in SF\") do NOT need this vertical \u2014\nthe main retrieval stages own those.\n\n## Integration with a parent search\n\nThese instructions are for the parent `$search` agent; the SQL sub-agent stays\nread-only and returns the JSON defined under Output. Direct SQL questions use\nthis skill's ordinary query-and-table flow instead.\n\nFor local people searches needing career ordering, counts, person overlap,\ncross-role skills, or interaction history, or explicitly requesting SQL\nassistance, delegate the SQL component alongside `prepare`. Give the sub-agent\nthe exact query and resolved IDs. Plain filters over one position do not need it.\n\nSave the returned JSON in the run directory and append\n`--extra-candidates-json <path>` to the approved execute command. SQL candidates\nreceive the same hydration, filtering, and reranking as other candidates.\nOn empty output or failure, continue without it and say it was skipped.\nIn the final summary, report `agentic_sql_tagged` from the execute-role-search\nsummary as the number of SQL-tagged candidates merged.\n\nIf the preview or completed pipeline returns zero people, delegate one SQL\ndiagnostic with the query and compiled filters. Probe actual column values,\nidentify the constraint causing zero matches, and show the diagnosis and any\nrecovered candidates. Offer a normal rerun with corrected filters; do not\nsilently substitute SQL results or relax the user's requirements.\n\n## The only tool\n\n```bash\nuv run --project . python packs/search/primitives/local_duckdb_query/local_duckdb_query.py schema\nuv run --project . python packs/search/primitives/local_duckdb_query/local_duckdb_query.py query --sql \"<one SELECT/WITH statement>\" [--max-rows N]\n```\n\n- DB path defaults to `$POWERPACKS_LOCAL_SEARCH_DB` or\n  `.powerpacks/search-index/local-search.duckdb`; override with `--db`.\n- Read-only connection; only a single SELECT/WITH statement is accepted.\n- Default row cap 200 (`truncated: true` signals more rows exist).\n- Do not write files, do not open the DuckDB any other way, and do not\n  `SELECT *` on tables with `vector` / `*_tokens` columns \u2014 project explicit\n  columns.\n\nRun `schema` first only if this cheat sheet seems stale (missing table or\ncolumn errors); otherwise trust the cheat sheet and go straight to queries.\n\n## Schema cheat sheet\n\nGrain note: `local_people_positions` is one row per **position** (a person\nrepeats across rows). `person_id` == `base_id` is the person key used\neverywhere; results must be deduped to person grain.\n\n- **local_people_positions** \u2014 position_id, person_id, base_id,\n  position_title, raw_title, role_track, role_type_category, seniority_band,\n  role_ids, description, city, state, country, macro_region, metro_areas,\n  is_current (boolean), start_date_epoch, end_date_epoch (unix seconds; `0`\n  or NULL = unknown/open-ended), tenure_years, total_years_experience,\n  inferred_birth_year, company_id, company_name, company_domain,\n  company_stage, company_headcount, company_funding_total,\n  company_sector_types, company_entity_types, investor_names.\n  (Avoid: vector, word_tokens, char_tokens, d2q_tokens, phrase_tokens,\n  dense_text.)\n- **local_person_profiles** \u2014 person_id, base_id, full_name, first_name,\n  last_name, headline, summary, current_title, current_company, city, state,\n  country, location_raw, linkedin_url, public_identifier, source_channels,\n  twitter_handle, linkedin_followers, linkedin_connections,\n  work_experiences (typed STRUCT array: company_name, title, description,\n  location, is_current_position, starts_at/ends_at as {day,month,year}\n  structs \u2014 UNNEST directly, no JSON parsing), education (same style).\n  Coverage may be partial (enriched subset of people).\n- **local_summaries** \u2014 person_id, base_id, summary, tech_skills.\n  (Avoid: vector, summary_tokens, word_tokens, phrase_tokens.)\n- **local_people_education** \u2014 person_id, base_id, school_name,\n  school_canonical_key, canonical_education_id, degree, degree_normalized,\n  field_of_study, start_year, end_year, graduation_year.\n- **local_education** \u2014 canonical_education_id, school_name, display_value,\n  person_count (school directory).\n- **local_companies** \u2014 id/company_urn, company_name, name_aliases_text,\n  website_domain, sector_types, entity_types, stage, funding_stage,\n  headcount, funding_total, founded_year, city, state, country,\n  investor_urns, yc_batches, description. (Avoid: vector.)\n- **local_person_source_summary** \u2014 optional; per person \u00d7 source channel\n  message counts and interaction dates. Check `schema` before relying on it;\n  many indexes do not include it yet.\n\n## Worked patterns\n\nPer-person aggregate (\u22652 startup stints):\n\n```sql\nSELECT person_id, count(*) AS startup_stints,\n       list(DISTINCT company_name) AS companies\nFROM local_people_positions\nWHERE company_stage IN ('seed', 'series_a')   -- verify values with a DISTINCT probe first\nGROUP BY person_id\nHAVING count(*) >= 2\n```\n\nCoverage warning: company enrichment columns (`company_stage`,\n`company_funding_total`, `company_headcount`) can be entirely empty in a\ngiven index. Probe coverage first; if empty, approximate via\n`local_companies` (stage, funding_stage, headcount, yc_batches) joined on\n`local_people_positions.company_id = local_companies.id` (both UUID;\n`company_urn` is a separate VARCHAR urn), or via sector/headcount proxies,\nand say so in `notes`.\n\nOverlap self-join (worked with person Y at the same company at the same\ntime; `end_date_epoch = 0` means still there \u2014 treat as open interval):\n\n```sql\nWITH target AS (\n  SELECT company_id, start_date_epoch AS s,\n         CASE WHEN end_date_epoch = 0 THEN 32503680000 ELSE end_date_epoch END AS e\n  FROM local_people_positions\n  WHERE person_id = '<target-person-id>' AND company_id IS NOT NULL AND start_date_epoch > 0\n)\nSELECT DISTINCT p.person_id, p.company_name, p.position_title\nFROM local_people_positions p\nJOIN target t ON p.company_id = t.company_id\nWHERE p.person_id <> '<target-person-id>'\n  AND p.start_date_epoch > 0\n  AND p.start_date_epoch <= t.e\n  AND (CASE WHEN p.end_date_epoch = 0 THEN 32503680000 ELSE p.end_date_epoch END) >= t.s\n```\n\nOverlap caveat: company resolution in imported data is noisy \u2014 a shared or\nmis-mapped `company_id` can produce implausible overlaps (e.g. unrelated\ntitles under one small company). Include `company_name` and\n`position_title` in the output, drop rows that are obviously implausible,\nand keep the company name in each result so the user can judge it.\n\nCareer ordering (engineer before PM):\n\n```sql\nWITH ordered AS (\n  SELECT person_id, role_track, start_date_epoch,\n         min(CASE WHEN role_track ILIKE '%engineering%' THEN start_date_epoch END) OVER (PARTITION BY person_id) AS first_eng,\n         min(CASE WHEN role_track ILIKE '%product%' OR role_track = 'pm' THEN start_date_epoch END) OVER (PARTITION BY person_id) AS first_pm\n  FROM local_people_positions\n  WHERE start_date_epoch > 0\n)\nSELECT DISTINCT person_id FROM ordered\nWHERE first_eng IS NOT NULL AND first_pm IS NOT NULL AND first_eng < first_pm\n```\n\nValue-space probe before filtering on a categorical column (always do this\nbefore trusting literals \u2014 e.g. `role_track` is a long, messy tail of ~95\nvalues like `engineering`, `engineering_ic`, `technical_ic`,\n`product_management`, `pm`; exact-match filters silently miss):\n\n```sql\nSELECT company_stage, count(*) FROM local_people_positions GROUP BY 1 ORDER BY 2 DESC\n```\n\nResolve a person mentioned by name:\n\n```sql\nSELECT person_id, full_name, current_title, current_company\nFROM local_person_profiles\nWHERE full_name ILIKE '%<name>%'\n```\n\n(If not in profiles, fall back to a title/company probe on\n`local_people_positions` \u2014 profiles cover an enriched subset.)\n\n## Method\n\n1. Interpret the request; identify the relational/aggregate core.\n2. Probe value spaces for any categorical literal you intend to filter on.\n3. Build the query iteratively (max ~6 query calls); start narrow, inspect,\n   refine. Join `local_person_profiles` at the end to attach names/URLs.\n4. Dedupe to person grain.\n\n## Output\n\nPresent the answer as a compact table, capped at 100 people and ordered by\nstrength of evidence. Evidence must come from queried columns, never inference.\nInclude the final SQL and material coverage/truncation caveats. If the data\ncannot answer the question, say why; do not guess.\n\nWhen delegated by a parent search, return JSON instead:\n\n```json\n{\"vertical\":\"agentic_sql\",\"interpretation\":\"...\",\"sql\":\"...\",\"people\":[{\"person_id\":\"...\",\"base_id\":\"...\",\"full_name\":\"...\",\"evidence\":\"...\"}],\"notes\":\"...\"}\n```\n\nCap `people` at 100. Evidence must come from queried columns. Return an empty\nlist with an explanation if the data cannot answer it.\n\n## Hard rules\n\n- Do not add positive or negative title filters unless the user requested\n  them; evaluate only the relational or aggregate predicate asked for.\n- Read-only. Never modify the DuckDB, never write artifact files, never run\n  other primitives or network calls from this skill.\n- One statement per call; respect the guard errors instead of working around\n  them.\n", "mcp_count": 0, "mcp_refs": [], "name": "search-sql", "pack": "search", "path": "packs/search/skills/search-sql/SKILL.md", "primitive_count": 2, "primitive_refs": ["local", "local_duckdb_query"]}]}</script>
  <script>
    const data = JSON.parse(document.getElementById('data').textContent);
    const q = document.getElementById('q');
    const pack = document.getElementById('pack');
    const sort = document.getElementById('sort');
    const sections = document.getElementById('sections');
    const stats = document.getElementById('stats');
    const detail = document.getElementById('detail');
    let selected = data.skills[0]?.name;

    function esc(s) { return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
    function normalize(s) { return String(s ?? '').toLowerCase(); }
    function skillHaystack(s) { return normalize([s.name, s.display_name, s.pack, s.description, ...s.primitive_refs, ...s.mcp_refs].join(' ')); }

    function initFilters() {
      const packs = [...new Set(data.skills.map(s => s.pack))].sort();
      pack.innerHTML = '<option value="all">All packs</option>' + packs.map(p => `<option value="${esc(p)}">${esc(p)}</option>`).join('');
    }

    function filteredSkills() {
      const query = normalize(q.value.trim());
      let list = data.skills.filter(s => (pack.value === 'all' || s.pack === pack.value) && (!query || skillHaystack(s).includes(query)));
      if (sort.value === 'name') list.sort((a,b) => a.name.localeCompare(b.name));
      else if (sort.value === 'prims') list.sort((a,b) => (b.primitive_count + b.mcp_count) - (a.primitive_count + a.mcp_count));
      else list.sort((a,b) => a.pack.localeCompare(b.pack) || a.name.localeCompare(b.name));
      return list;
    }

    function renderStats(list) {
      const prims = new Set(list.flatMap(s => s.primitive_refs));
      const mcp = new Set(list.flatMap(s => s.mcp_refs));
      stats.innerHTML = `
        <div class="stat"><strong>${list.length}</strong> skills</div>
        <div class="stat"><strong>${Object.keys(data.packs).length}</strong> packs</div>
        <div class="stat"><strong>${data.primitives.length}</strong> primitives total</div>
        <div class="stat"><strong>${prims.size}</strong> primitives referenced</div>
        <div class="stat"><strong>${mcp.size}</strong> MCP/tool refs</div>
        <div class="stat">generated <strong>${esc(data.generated_at)}</strong></div>`;
    }

    function card(s) {
      const chips = [...s.primitive_refs.slice(0, 3).map(p => `<span class="chip">${esc(p)}</span>`), ...s.mcp_refs.slice(0, 2).map(t => `<span class="chip">mcp:${esc(t)}</span>`)].join('');
      return `<article class="card ${s.name === selected ? 'active' : ''}" tabindex="0" role="button" data-skill="${esc(s.name)}">
        <div class="kicker">${esc(s.pack)} · ${s.primitive_count} prim · ${s.mcp_count} tool</div>
        <div class="title">${esc(s.display_name)}</div>
        <div class="desc">${esc(s.description || s.heading)}</div>
        <div class="chips">${chips || '<span class="chip">no refs inferred</span>'}</div>
      </article>`;
    }

    function renderSections() {
      const list = filteredSkills();
      renderStats(list);
      if (!list.length) { sections.innerHTML = '<div class="empty">No skills match the current filters.</div>'; renderDetail(null); return; }
      const grouped = new Map();
      for (const s of list) { if (!grouped.has(s.pack)) grouped.set(s.pack, []); grouped.get(s.pack).push(s); }
      sections.innerHTML = [...grouped.entries()].map(([p, skills]) => `<div class="section"><h2>${esc(p)} - ${skills.length} skills</h2><div class="grid">${skills.map(card).join('')}</div></div>`).join('');
      if (!list.some(s => s.name === selected)) selected = list[0].name;
      renderDetail(data.skills.find(s => s.name === selected));
    }

    function renderDetail(s) {
      if (!s) { detail.innerHTML = '<div class="empty">Select a skill card.</div>'; return; }
      const primitiveRows = s.primitive_refs.map(name => {
        const p = data.primitive_by_name[name] || {name};
        return `<div class="row"><strong>${esc(name)}</strong><small>${esc(p.path || '')}${p.entrypoint ? '<br>' + esc(p.entrypoint) : ''}</small></div>`;
      }).join('') || '<div class="empty">No primitive references inferred from SKILL.md.</div>';
      const mcpRows = s.mcp_refs.map(name => `<div class="row"><strong>mcp:${esc(name)}</strong><small>Referenced by skill body</small></div>`).join('') || '<div class="empty">No MCP/tool references inferred.</div>';
      detail.innerHTML = `
        <div class="kicker">${esc(s.pack)} pack</div>
        <h3>${esc(s.display_name)}</h3>
        <p>${esc(s.description)}</p>
        <div class="label">Skill file</div>
        <div class="row"><strong>${esc(s.name)}</strong><small>${esc(s.path)}</small></div>
        <pre class="markdown">${esc(s.markdown || '')}</pre>
        <div class="label">Primitives used</div>
        <div class="list">${primitiveRows}</div>
        <div class="label">MCP / tool refs</div>
        <div class="list">${mcpRows}</div>`;
    }

    sections.addEventListener('click', e => {
      const card = e.target.closest('.card');
      if (!card) return;
      selected = card.dataset.skill;
      renderSections();
    });
    sections.addEventListener('keydown', e => {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      const card = e.target.closest('.card');
      if (!card) return;
      e.preventDefault();
      selected = card.dataset.skill;
      renderSections();
    });
    [q, pack, sort].forEach(el => el.addEventListener('input', renderSections));
    initFilters();
    renderSections();
  </script>
