Google OAuth app for msgvault.\n\n## Commands\n\nRun from the Powerpacks repo root:\n\n```bash\nuv run --project . python packs/ingestion/primitives/setup/msgvault_setup.py status\nuv run --project . python packs/ingestion/primitives/setup/msgvault_setup.py browser-setup --email <gmail>\nuv run --project . python packs/ingestion/primitives/setup/msgvault_setup.py setup --email <gmail>\nuv run --project . python packs/ingestion/primitives/setup/msgvault_setup.py setup --client-secret <client_secret.json> --email <gmail>\nuv run --project . python packs/ingestion/primitives/setup/msgvault_setup.py create-oauth-app --email <gmail>\nuv run --project . python packs/ingestion/primitives/setup/msgvault_setup.py add-test-users <gmail>\nuv run --project . python packs/ingestion/primitives/setup/msgvault_setup.py add-account --email <gmail>\n```\n\nRun these commands from the checkout identified by the installed skill.\n\n## Routing\n\n- `$msgvault`, status requests: run `status` and summarize readiness.\n- `$msgvault setup`, onboarding Gmail archive setup:\n  run `browser-setup`; include `--email` if the user supplied one. Then run\n  `add-account --email <gmail>` when the user is ready to authorize the Gmail\n  account.\n- `$msgvault create oauth app` or `$powerset create oauth app`: run\n  `browser-setup` if the user wants automation, otherwise `create-oauth-app`;\n  the Google OAuth Desktop client name should be `local-msg-vault`.\n- User provides a downloaded `client_secret*.json`: run `setup --client-secret\n  <path>` and add `--email` if known.\n- Workspace org needs its own app: add `--oauth-app <short-name>`.\n- Add OAuth test users: run `add-test-users <gmail>`; add `--project <id>`\n  or `--oauth-app <short-name>` when targeting a non-default app.\n- Headless machine: add `--headless` when authorizing the account.\n- Reruns: `browser-setup` skips Google Console automation when a valid local\n  client secret is already configured. Use `--force-browser-setup` only when\n  intentionally creating/replacing the OAuth client.\n- `add-account` reuses the saved Google browser session for the requested\n  mailbox and Gmail scopes. Chrome opens visibly only when Google needs login,\n  MFA, or an unrecognized screen; finish that step there and authorization\n  continues. If it times out, rerun the same command. `--force-auth` preserves\n  the previous token when replacement fails. A healthy account needs no browser.\n\n## User-facing wording\n\nKeep it direct:\n\n- `msgvault is installed.`\n- `Creating the Google OAuth app in Chrome.`\n- `Downloaded client secret configured.`\n- `OAuth app already configured.`\n- `msgvault account authorized.`\n\nDo not print client secret values or token paths beyond the configured JSON\nfile path. msgvault stores and searches Gmail message data locally; make that\nclear before starting a sync, but do not over-explain when the user only asked\nfor setup.\n", "mcp_count": 0, "mcp_refs": [], "name": "msgvault", "pack": "ingestion", "path": "packs/ingestion/skills/msgvault/SKILL.md", "primitive_count": 1, "primitive_refs": ["setup"]}, {"description": "File product feedback to Powerset from inside this session. The agent inspects the current session, composes one identifiers-only feedback row (query, commands, run artifacts, affected names/LinkedIn URLs \u2014 never message content), previews it with --dry-run, asks whether to include person identifiers, then posts it through the send_feedback primitive.", "display_name": "powerset:feedback", "heading": "Feedback", "markdown": "---\nname: feedback\ndescription: File product feedback to Powerset from inside this session. The agent inspects the current session, composes one identifiers-only feedback row (query, commands, run artifacts, affected names/LinkedIn URLs \u2014 never message content), previews it with --dry-run, asks whether to include person identifiers, then posts it through the send_feedback primitive.\n---\n\n# Feedback\n\nCreated 2026-07-31. Changelog: 2026-07-31 \u2014 initial version; 2026-07-31 \u2014\ninline artifact attachments (`--artifact`); 2026-07-31 \u2014 `$deep-context`\nsurface notes.\n\nUse for `$feedback`, \"report this\", \"file/send feedback\", \"flag this result\",\nor any \"that was wrong \u2014 report it\" moment, usually right after another skill\nproduced a bad result (wrong person, bad LinkedIn, bad ranking, a crash).\n\nOne row goes to the existing `POST /v2/feedback` endpoint (the `user_feedback`\ntable) using the stored `$powerset login` bearer, via the send_feedback\nprimitive. The primitive validates and ships; this skill's job is composition \u2014\nmine THIS session for everything that helps an engineer repro the issue and\nput it in `--comment` + `--metadata`.\n\n## Privacy contract \u2014 identifiers only\n\n- OK to include: the user's own words (their query, their typed complaint),\n  names, LinkedIn slugs/URLs, emails/phones the report is about, local\n  parent/dossier slugs, prod person UUIDs, run-dir paths, command lines, JSON\n  payload statuses/counts/confidences, error text from our own tooling, and\n  version/harness info.\n- NEVER include: message bodies, email subjects/snippets, dossier prose,\n  machine free-text reasons (`llm_worth_reason`, judge reasons), logbook text,\n  or anything synthesized from message content. Decisions and confidences\n  travel; their prose does not.\n- Person identifiers (names / LinkedIn URLs / emails / phones) ride only with\n  the user's explicit OK from the Step 3 preview question.\n\n## Step 1 \u2014 inspect the session\n\nWork from what already happened in this conversation; do not re-run failing\ncommands to harvest context. Collect whatever exists and skip what doesn't:\n\n- What the user asked for, verbatim, and which skill/surface was active\n  (`$search`, `$deep-context`, `$import-gmail`, ...).\n- The misbehaving step: its exact command line, the JSON payload `status` /\n  error it returned, its exit code.\n- Run artifacts this session already wrote: the search run dir and its\n  `decision.json` / task-state file, stage `manifest.json` paths, counts.\n  Reference paths plus small excerpts (statuses, counts) \u2014 never dump whole\n  artifacts into metadata.\n- Affected people, as identifiers only: name, LinkedIn slug/URL, local slug,\n  and the prod person UUID when a Powerset search result carried one.\n- Environment: powerpacks version (`git describe --tags --always` in the\n  repo, or the `.powerpacks-install.json` stamp next to installed skills),\n  harness (codex / claude-code / pi), and the active set id\n  (`POWERPACKS_DEFAULT_SET_ID`).\n\n## Step 2 \u2014 compose the row\n\n- `--comment`: 1\u20133 sentences \u2014 what was wrong and what was expected, leading\n  with the user's own framing.\n- `--feedback-type`: keep the default `data_inconsistency` when in doubt (the\n  admin queue and LLM triage batch only pick up that type). Use `bad_search` /\n  `bad_rerank` only when the complaint is clearly retrieval/ranking quality.\n- `--category`: the field family (`linkedin`, `name`, `title`, `company`,\n  `search`, ...). `--field-value`: the wrong value currently shown.\n- `--person-id`: PROD person UUID only, and only if one is actually in hand;\n  local slugs and ids go in `--metadata` instead.\n- `--set-id`: `POWERPACKS_DEFAULT_SET_ID` when it is a real UUID; else omit.\n- `--metadata`: one JSON object carrying the Step-1 haul. Skeleton \u2014 drop\n  empty keys rather than sending blanks:\n\n```json\n{\n  \"source\": \"powerpacks-agent\",\n  \"harness\": \"claude-code\",\n  \"skill\": \"search\",\n  \"user_query\": \"vp eng at fintech startups\",\n  \"run_dir\": \".powerpacks/search-runs/<run>/\",\n  \"decision\": {\"surface\": \"people\", \"backend\": \"local\", \"depth\": \"fast\"},\n  \"failing_command\": \"uv run --project . python packs/search/primitives/search_network_pipeline.py prepare ...\",\n  \"error\": {\"status\": \"failed\", \"detail\": \"last ~500 chars of the error\"},\n  \"counts\": {\"candidates\": 120, \"returned\": 0},\n  \"people\": [{\"name\": \"Jordan Bravo\", \"linkedin_url\": \"https://linkedin.com/in/jordan-bravo\", \"parent_slug\": \"jordan-bravo\"}],\n  \"powerpacks_version\": \"powerpacks-v1.6.0\"\n}\n```\n\n- `--artifact <path>` (repeatable): attach small run artifacts inline \u2014 each\n  file is gzip+base64 packed under `metadata.artifacts` by the primitive.\n  Attach only files that are identifiers/decisions by construction:\n  `decision.json`, the task-state JSON and its `.events.jsonl`, stage\n  `manifest.json` files. Never attach dossier files, logbook files, retrieval\n  profile dumps, or anything carrying message-derived or profile prose \u2014 the\n  same privacy contract applies to attachments.\n\nKeep the whole body small (target under ~50 KB; the primitive refuses at\n900 KB and the server rejects 1 MB). JSON artifacts compress ~5-10x, so a few\nMB of raw artifact still fit \u2014 the primitive errors with per-artifact packed\nsizes if the total goes over.\n\n### `$deep-context` sessions\n\nThe review UI already files pane-level worth/retarget feedback automatically\n(`review/feedback.py`); use `$feedback` for session-level issues the panes\ncannot express (a bad merge run, a stuck stage, systematic wrong-LinkedIn\npatterns). Deep-context specifics:\n\n- Identifiers: parent slug + `person_ids`, candidate LinkedIn slugs/URLs with\n  their confidences, machine/human worth DECISIONS and confidences.\n- Artifacts: canonical SQLite identifiers and the stage `manifest.json` files\n  (facts / parents / reconcile) \u2014 counts, statuses, and slugs by construction.\n- Still never: dossier markdown, facts text, `llm_worth_reason` / judge reason\n  prose \u2014 all synthesized from message bodies.\n\n## Step 3 \u2014 preview and one consent question\n\nAlways dry-run first and show the user the exact body that would be sent:\n\n```bash\nuv run --project . python packs/powerset/primitives/send_feedback/send_feedback.py \\\n  --comment \"...\" --category linkedin --field-value \"...\" \\\n  --metadata '{\"source\":\"powerpacks-agent\", ...}' \\\n  --artifact .powerpacks/search-runs/<run>/decision.json --dry-run\n```\n\nWhen artifacts are attached, name them and their raw sizes in the preview\n(the packed `data` blobs are noise \u2014 summarize, don't paste them).\n\nThen ask exactly one question: **send with person identifiers (names /\nLinkedIn URLs) to help repro, send redacted, or don't send?** The question\ncovers attachments too. On \"redacted\", drop the `people` array, drop\n`--field-value`/`--person-id` when they identify a person, strip names from\nthe comment, drop any artifact whose contents name people, and send the rest.\n\n## Step 4 \u2014 send\n\nRe-run the same command without `--dry-run` and report the payload in one line:\n\n- `submitted` \u2192 report the returned `feedback_id`. Done.\n- `needs_auth` (exit 3) \u2192 the stored Powerset login is missing or expired;\n  route to `$powerset setup`, then retry once.\n- `failed` \u2192 surface `http_status` + error text; do not loop retries.\n", "mcp_count": 0, "mcp_refs": [], "name": "feedback", "pack": "powerset", "path": "packs/powerset/skills/feedback/SKILL.md", "primitive_count": 2, "primitive_refs": ["search_network_pipeline", "send_feedback"]}, {"description": "Diagnose and repair local Powerpacks install/state path problems. Use for $fix-powerpacks, canonical repo enforcement, moving newer .powerpacks state out of .codex, validating linked msgvault/messages/WhatsApp/LinkedIn paths, and cleaning stale duplicate state roots after approval.", "display_name": "powerset:fix-powerpacks", "heading": "fix-powerpacks", "markdown": "---\nname: fix-powerpacks\ndescription: Diagnose and repair local Powerpacks install/state path problems. Use for $fix-powerpacks, canonical repo enforcement, moving newer .powerpacks state out of .codex, validating linked msgvault/messages/WhatsApp/LinkedIn paths, and cleaning stale duplicate state roots after approval.\n---\n\n# fix-powerpacks\n\nUse this skill for `$fix-powerpacks` and for requests like:\n\n- \u201cPowerpacks is running from the wrong install path\u201d;\n- \u201cCodex used `.codex/powerpacks` and now setup is brittle\u201d;\n- \u201cmove/copy the right local data into the real Powerpacks install\u201d;\n- \u201ccheck if Gmail/msgvault, WhatsApp/wacli, Messages review CSV, and network\n  artifacts are wired correctly\u201d;\n- \u201ccheck whether discovery/import manifests exist for each vertical\u201d;\n- \u201creport stale run-id / temp artifact directories under `.powerpacks` so they\n  can be triaged or cleaned up deliberately\u201d;\n- \u201cclean up stale duplicate state directories so future sessions stop using\n  them.\u201d\n\nThis is a repair workflow. Its default command applies safe local repairs:\ncopy/adopt newer canonical state and copy `.env` only if canonical `.env` is\nmissing, adopt an authenticated wacli store, and move aside a bad unauthenticated\nwacli placeholder so the user can reauth cleanly. It must not run imports,\nmsgvault sync, WhatsApp sync, enrichment, processing, uploads, provider-spend\noperations, or destructive cleanup unless the user separately and explicitly\nrequests that.\n\n## Principles\n\n1. Product commands run from the installed Powerpacks repo.\n2. Powerpacks-owned local state lives under that repo\u2019s `.powerpacks/`.\n3. `~/.msgvault/msgvault.db` is external local app state; Powerpacks should\n   point to it, not move it into `.powerpacks`.\n4. `.codex/powerpacks/.powerpacks` is a legacy/accidental state source, not the\n   runtime root.\n5. Copy/adopt only files that are missing or newer than the canonical target.\n6. Rename/quarantine stale bad directories instead of deleting them.\n7. Ledgers are logs/checkpoints; current artifacts and live read-only checks are\n   more authoritative than stale ledger statuses.\n8. When expected files are missing, report the exact missing path and observed\n   counts. Do not invent substitute files or silently treat an old artifact as\n   equivalent.\n9. Stale run-id/temp directories are cleanup candidates, not source of truth.\n   Report them by path and size/count first; quarantine/remove them only after a\n   separate explicit cleanup request.\n\n## State path contract\n\nThe tracked path contract is:\n\n```text\nconfig/powerpacks-state-paths.json\n```\n\nThe fixer script reads that contract and knows the managed paths needed for\nsetup/import/enrichment to work, including:\n\n- `.env` local runtime config/credentials, copied only if canonical `.env` is missing and never printed\n- `.powerpacks/messages/contacts.csv`\n- `.powerpacks/messages/wacli/`\n- `.powerpacks/messages/wacli.contacts.csv`\n- `.powerpacks/network-import/directory.csv`\n- `.powerpacks/network-import/discover/`\n- `.powerpacks/network-import/import/`\n- `.powerpacks/network-import/profile_cache_v2/`\n- `.powerpacks/network-import/merged/people.csv`\n\nReport-only paths include dirty ledgers, rebuildable DuckDB files, and stale\nrun-id/temp artifact directories. The canonical current paths are stable and\nshould not include arbitrary run IDs:\n\n```text\n.powerpacks/network-import/discover/<vertical>/manifest.json\n.powerpacks/network-import/import/<vertical>/manifest.json\n.powerpacks/network-import/final/\n.powerpacks/network-import/merged/\n.powerpacks/network-import/directory.csv\n.powerpacks/network-import/profile_cache_v2/\n```\n\nKnown stale/legacy cleanup candidates include paths like:\n\n```text\n.powerpacks/network-import/network-runs/<run-id>/\n.powerpacks/network-import/import-network-run*.json\n.powerpacks/network-import/<timestamp-or-run-id>/\n```\n\nDo not delete or quarantine these during the normal fixer run. Report them so\nthe user can decide whether to clean them up.\n\n## Standard flow\n\nResolve and enter canonical repo:\n\n```bash\nresolve_powerpacks_root() {\n  for candidate in \"${POWERPACKS_REPO_ROOT:-}\" \"$PWD\" \"$HOME/powerpacks\" \"$HOME/workspace/powerpacks\"; do\n    [[ -n \"$candidate\" ]] || continue\n    [[ \"$candidate\" != */.codex/powerpacks && \"$candidate\" != */skills/*/powerpacks ]] || continue\n    if [[ -d \"$candidate/packs\" && -f \"$candidate/pyproject.toml\" ]]; then\n      printf '%s\\n' \"$candidate\"\n      return 0\n    fi\n  done\n  return 1\n}\nrepo=\"$(resolve_powerpacks_root)\" || {\n  echo \"No installed Powerpacks repo found. Install/copy Powerpacks to ~/powerpacks first.\" >&2\n  exit 1\n}\ncd \"$repo\"\n```\n\nBefore running repair, verify the canonical checkout actually contains the fixer.\nIf this file is missing, the installed skill is newer than the repo that Codex is\nusing; stop and run `$update-powerpacks` from a checkout/branch that contains the\nfixer, or update/merge the canonical repo first.\n\n```bash\ntest -f scripts/fix-powerpacks-state.py || {\n  echo \"Missing scripts/fix-powerpacks-state.py in $repo; update the canonical checkout first.\" >&2\n  exit 1\n}\n```\n\nRun the default fixer. This applies safe repairs and scrubs a bad canonical\nwacli placeholder if no authenticated store is available:\n\n```bash\nuv run --project . python scripts/fix-powerpacks-state.py --json\n```\n\nSummarize:\n\n- canonical repo path;\n- current working directory;\n- legacy `.powerpacks` roots found;\n- managed paths copied/adopted, including whether `.env` was copied or kept without showing contents;\n- per-source discovery/import manifest health:\n  `.powerpacks/network-import/discover/<vertical>/manifest.json` and\n  `.powerpacks/network-import/import/<vertical>/manifest.json`;\n- stale run-id/temp artifact directories under `.powerpacks/network-import/`,\n  with path, approximate size, and why they are not part of the current stable\n  contract;\n- whether WhatsApp/wacli was authenticated, copied from a better store, or\n  scrubbed for reauth;\n- root cause for anything still failing.\n\nFor debugging only, inspect without changing files:\n\n```bash\nuv run --project . python scripts/fix-powerpacks-state.py --dry-run --json\n```\n\nIf the user explicitly asks to clean up stale `.codex` state after adoption,\nquarantine it instead of deleting:\n\n```bash\nuv run --project . python scripts/fix-powerpacks-state.py \\\n  --quarantine-legacy-state \\\n  --json\n```\n\n## What \u201cfix\u201d is allowed to do\n\nAllowed by default:\n\n- copy newer/missing managed files from legacy installs into the canonical repo,\n  including managed `.powerpacks` state;\n- copy legacy `.env` only when canonical `.env` is missing; never overwrite an\n  existing canonical `.env`;\n- update only Powerpacks-owned local state under canonical `.powerpacks`;\n- read-only test WhatsApp/wacli auth using the canonical store;\n- report discovery/import manifest status for Gmail, LinkedIn, and Messages;\n- report stale run-id/temp artifact directories so the harness can propose a\n  cleanup plan;\n- compare legacy wacli stores and copy a better authenticated store into the\n  canonical repo when the canonical store is missing or unauthenticated;\n- move aside a bad unauthenticated canonical wacli placeholder when no better\n  authenticated store exists, so the user can reauth cleanly;\n- run read-only sqlite/status checks against msgvault and wacli stores.\n\nRequires explicit approval:\n\n- overwrite canonical files with older/equal legacy files;\n- quarantine/rename legacy `.powerpacks` directories;\n- quarantine/remove stale run-id/temp artifact directories;\n- move aside dirty ledgers;\n- delete anything;\n- run browser auth, WhatsApp QR linking, msgvault sync, imports, enrichment,\n  processing, or uploads.\n\nNever do:\n\n- run product commands from `~/.codex/powerpacks`;\n- keep `.codex/powerpacks/.powerpacks` as the long-term runtime state root;\n- move `~/.msgvault/msgvault.db` into `.powerpacks`;\n- delete ledgers or stores without a backup and explicit user approval.\n\n## Response format\n\nEnd with a concise summary:\n\n```text\nCanonical repo: ...\nCopied/adopted: N files / M directories\nKept target because newer: ...\nWhatsApp/wacli auth: authenticated / present-unauthenticated / missing\nSource stages: Gmail discovery/import ok, LinkedIn discovery/import ok, Messages discovery/import missing/stale\nStale run dirs: ...\nQuarantined legacy state: yes/no\nNext: open /setup from canonical repo\n```\n", "mcp_count": 0, "mcp_refs": [], "name": "fix-powerpacks", "pack": "powerset", "path": "packs/powerset/skills/fix-powerpacks/SKILL.md", "primitive_count": 1, "primitive_refs": ["discover"]}, {"description": "Set up Powerpacks from one pasted URL through a resumable account, import, processing, and search-index workflow with live progress and automatic cost checks. Use for \"Download and install the Powerpacks skill from https://powerset.dev/powerpacks\", \"install Powerpacks\", or first-time Powerpacks setup; installing it means running the setup now, not only saving the file.", "display_name": "powerset:install-powerpacks", "heading": "Set up Powerpacks", "markdown": "---\nname: install-powerpacks\ndescription: Set up Powerpacks from one pasted URL through a resumable account, import, processing, and search-index workflow with live progress and automatic cost checks. Use for \"Download and install the Powerpacks skill from https://powerset.dev/powerpacks\", \"install Powerpacks\", or first-time Powerpacks setup; installing it means running the setup now, not only saving the file.\nlicense: MIT\nallowed-tools: Bash(curl -fsSL https://raw.githubusercontent.com/powerset-co/powerpacks/stable/bin/bootstrap *)\nmetadata:\n  slug: install-powerpacks\n  display-name: Powerpacks Installer\n  version: 1.7.1\n  summary: Install and build your searchable network from one sentence\n  download-url: https://powerset.dev/powerpacks\n  tags:\n    - powerpacks\n    - install\n    - network-search\n---\n\n# Set up Powerpacks\n\n<!--\nChangelog:\n- 2026-10-07: nothing asks for spend: every paid step runs after its estimate (in the\n  install log); `--approve-spend` is gone. A rerun builds the index again unless\n  people.csv is unchanged.\n- 2026-10-07: processing runs deep-context v2; the review is the page at `/` and\n  `bin/deep-context-v2 finish` rebuilds search after it.\n- 2026-10-05: Codex uses a persistent tmux worker; the advisor relays chat choices\n  and reads its output while the coordinator remains the owner of progress.\n- 2026-10-05: Page lines name no reasons; a stopped or deferred step's reason is in its\n  action's details (the ready step's `left_to_fix`).\n- 2026-10-05: A worker runs setup to the end; the main chat stays free. A QR scan,\n  login or permission no longer ends the agent's turn. The review offer reads the\n  review queue's own count.\n- 2026-10-05: One up-front message, asked synchronously: approve sending contact\n  data to Parallel and OpenAI (else LinkedIn only), Gmail defaults to the Powerset\n  login, full access is a note. The upload question is gone.\n- 2026-10-05: A stopped Gmail Google Cloud setup is the agent's to fix, not the user's.\n- 2026-10-05: The LinkedIn review no longer holds setup: search is built first, then\n  the agent offers the review; Finish shows `$search` starters for what is enabled.\n- 2026-10-05: Finish reports a LinkedIn read that stalled and the data export setup requested instead.\n- 2026-10-05: Finish lists what setup deferred (research, profile lookups) and the fix.\n- 2026-10-05: The bootstrap comes from the `stable` branch, which every release\n  moves to its tag, so the launcher always matches the release it installs.\n- 2026-10-05: Restored from 3.13.0 what the onboarding rewrite dropped: where\n  this can run (and what to tell chat or cloud users), where to save the skill\n  per harness, the full-access ask, and allowed-tools for the bootstrap command.\n-->\n\nInstalling this skill means running it. Save this file to the harness's skills\nfolder (Claude Code: `~/.claude/skills/install-powerpacks/SKILL.md`; Codex:\n`~/.agents/skills/install-powerpacks/SKILL.md`; Pi: its personal skills folder),\nthen start the setup below in the same turn. Do not stop after saving it.\n\nThe pasted installation instruction starts this whole workflow:\n\nInstall \u2192 Connect Powerset \u2192 Sync LinkedIn \u2192 Sync Gmail \u2192 Sync iMessage \u2192\nSync WhatsApp \u2192 Discover \u2192 Enrich \u2192 Build Index \u2192 Verify \u2192 Review (optional,\nwhenever the user has time).\n\nOwn the result. Run commands yourself; involve the user only for browser logins,\nQR scans, OS permissions, and the one approval below (the data-sharing consent;\npaid steps never ask). Reviewing LinkedIn matches is\noffered after search is ready, never in the way of it.\nOwn repairs through a verified rerun; use the recovery and feedback instructions below.\nOpen with: \"I\u2019ll set this up here. Feel free to ask questions or tell me what you\nwant as it runs.\"\n\n## Where this can run\n\nSetup runs shell commands on the user's Mac, so it works only in a local coding\nagent there: Claude Code (the CLI, or the desktop app's Code tab in a Local\nsession), Codex (CLI or app), or Pi. It does not work in ChatGPT chat, claude.ai\nchat, the desktop app's Chat tab, or a cloud session (Claude Code on the web,\nCloud in the desktop app, Codex cloud tasks): nothing would land on the Mac.\n\nBootstrap checks this and prints `STOP:` when it is not on the user's Mac. If the\nagent has no shell at all, do not run anything; tell the user which tool to use:\n\n- ChatGPT chat: \"This needs a coding agent on your Mac. Please use Codex instead:\n  open Terminal, run `curl -fsSL https://chatgpt.com/codex/install.sh | sh`, then\n  `cd ~`, run `codex`, and paste the same sentence.\" (Or the Codex app, in a\n  local folder.)\n- claude.ai chat or a cloud session: \"This needs a coding agent on your Mac.\n  Please use Claude Code there: the desktop app's Code tab in a Local session on\n  your home folder, or open Terminal, run `curl -fsSL https://claude.ai/install.sh | bash`,\n  then `cd ~` and run `claude`. Then paste the same sentence.\"\n\nNever claim a cloud session changed the user's computer.\n\n## Start and supervise\n\nBefore running anything, send the user this one message, then stop and wait for\ntheir reply. Ask it as a plain chat message and end your turn there: do not use a\nquestion pop-up or any asynchronous prompt (those close when you finish talking),\nand do not run any command until the user has answered.\n\n> Before I start:\n> - **One approval:** to research and enrich your contacts I'll send their names,\n>   emails, phone numbers and a short summary of how you know them to Parallel and\n>   OpenAI, and run paid processing using your configured accounts. Costs depend\n>   on your data; setup logs estimates before each paid stage. Reply **approve**\n>   to authorize both data sharing and these processing charges, or **LinkedIn\n>   only** to authorize paid processing of just your LinkedIn connections.\n> - **Gmail:** I'll add the Google account you sign in to Powerset with. To add\n>   others, list them in your reply.\n> - **Fewer prompts:** setup runs many local commands; turn on full access so I\n>   don't stop to ask each time (steps below). No reply needed for this one.\n\nPut the steps for their harness under the last line:\n- Claude Code CLI: restart with `claude --dangerously-skip-permissions` (a running\n  session cannot switch into it), or allow the commands in `/permissions`.\n- Claude Code desktop app: Settings > Claude Code > \"Allow bypass permissions\n  mode\", then pick Bypass permissions in the mode selector by the send button.\n- Codex CLI: restart with `codex --yolo`, or pick a profile in `/permissions`.\n- Codex app: the permissions control under the composer > Full access.\n\nThe agent cannot read or change the permission mode; only the user can. If they\nrestart, they paste the same sentence again. If a command is later denied, or the\nuser has had to approve more than one prompt, repeat the full-access steps.\n\nThat approval covers both data sharing and paid processing for this setup. Pass\nboth approvals to the worker; do not ask for a second cost approval or promise a\nseparate gate. Honor any limit the user states. Reuse approval already given in\nthis chat rather than asking again on a retry.\n\nFrom the one reply: on **approve**, have the worker run the command below; for\n**LinkedIn only**, add `--source linkedin`. If paid processing is declined, perform\ninstall-only setup without `--powerset`; do not start processing. Pass every extra Gmail address they listed as `--gmail-email`\n(the Powerset login is added on its own). Everything after that is logins the user\ndoes back to back near the start (Powerset, LinkedIn, Google, each Gmail approval,\nFull Disk Access, WhatsApp QR); then setup runs on its own.\n\n```bash\ncurl -fsSL https://raw.githubusercontent.com/powerset-co/powerpacks/stable/bin/bootstrap | bash -s -- --powerset\n```\n\nBootstrap installs the runtime and starts the installed coordinator `bin/onboard`.\nThat coordinator connects Powerset and verifies hosted search first, then owns\nimports, processing, review, indexing, and verification. Once hosted search is\nverified, tell the user they can search while local setup continues. Do not make\nlocal import or processing completion a prerequisite for cloud search, and do not\nassemble a second sequence of skill commands yourself.\nExplicit install-only or no-login requests omit `--powerset` and stop earlier.\n\nNo project directory or manual clone is needed. Use the printed `powerpacks: repo:`\ncheckout for subsequent commands and read its `AGENTS.md`. Skills folders are not\nworkflow data roots. Fresh installs follow the published release; a PR test uses\nthat checkout's bootstrap and verifies its commit, not the public launcher.\n\n### Advisor and background worker\n\nRead [tmux-worker.md](tmux-worker.md) before starting; include it in the worker's\nbrief. If you downloaded only this SKILL.md, first save\n`https://raw.githubusercontent.com/powerset-co/powerpacks/stable/packs/shared/skills/tmux-worker.md`\nas `tmux-worker.md` beside it. A PR test uses that checkout's copy. It owns supervision, recovery, stopping and feedback (`category: install`).\nOnly the worker starts/resumes the coordinator; the advisor relays chat choices.\n\nBefore starting, the advisor creates this chat's visible checklist with the host's\nnative task/plan tool (Codex's plan tool or Claude's task tools):\n\n1. Install Powerpacks\n2. Connect Powerset\n3. Sync LinkedIn\n4. Sync Gmail\n5. Sync iMessage\n6. Sync WhatsApp\n7. Discover contacts\n8. Enrich contacts\n9. Build search index\n10. Verify search\n\nKeep it current yourself from the worker's output and\n`.powerpacks/install/manifest.json`, even when the browser page is open. The\nworker reports stage results to the advisor; it never creates or updates a\nsecond task list. Group each source's preparation, login and import under its\nsync task. Follow the coordinator's actual order; logins can happen before sync.\nFor install-only requests, show only the requested setup tasks.\n\nMark verified cached/no-op work complete. Label user-skipped sources as skipped\n(use the host's skipped state when available, otherwise complete with \u201cSkipped\u201d\nin the task label). Leave failed or waiting tasks unfinished and name the wait,\nsuch as \u201cSync Gmail \u2014 waiting for sign-in\u201d. Add a review task only when review is\nneeded. Starting a background index build does not complete it; complete Verify\nsearch only when index validation succeeds. Reuse this checklist after a retry.\nIf the host has no task tool, keep a compact checklist in chat instead.\n\nOn Codex with a local CLI and tmux, use `bin/onboard-worker`. It is standalone and\nneeds only Python 3, tmux and Codex, so a fresh install can download it before a\ncheckout exists:\n\n```bash\ncurl -fsSL https://raw.githubusercontent.com/powerset-co/powerpacks/stable/bin/onboard-worker -o /tmp/powerpacks-onboard-worker.py\n```\n\nFor a PR test, use that checkout's helper and bootstrap instead. Do not download\nstable over a PR test. If tmux or a suitable Codex CLI is unavailable, use the\nhost's native background agent; do not install a second agent harness silently.\nOther hosts use one native worker operating the bootstrap/coordinator in a tmux\nsession named `powerpacks-onboarding`, as Deep Context does. Before sending any\ncommand, inspect its pane and the live coordinator; reuse active work instead of\nstarting another copy. Without a background agent, supervise here.\n\nWrite a private task file containing the saved skill's absolute path, the exact\nbootstrap command above (including requested options), account/history/source\nchoices, existing consent and budget, and the requested outcome. The worker must\nread that skill, execute the command and supervise it, not repeat the advisor's\nup-front question or launch another worker. Keep the coordinator responsible for\nprocessing too: do not hand off to standalone Deep Context stages that leave the\ninstall page frozen. If a required restriction cannot be expressed by the\ncoordinator, tell the advisor before changing the execution path; never present\nits old completed manifest as current progress. On an interrupted install, include\nthe known checkout and tell it to inspect the live process and saved continuation.\nNever put tokens, passwords or message content in the task or steering messages.\n\nRun the helper from the advisor's current shell. Supply the user's actual sandbox\nand approval policy explicitly; don't infer full access from the install request.\nFor an already authorized Full access session, for example:\n\n```bash\npython3 /tmp/powerpacks-onboard-worker.py start --prompt-file /tmp/powerpacks-worker-task.txt --sandbox danger-full-access --approval never\npython3 /tmp/powerpacks-onboard-worker.py read\npython3 /tmp/powerpacks-onboard-worker.py send 'The user says: skip Gmail for now. Keep the other choices and continue.'\n```\n\n`start` reuses a live worker; after an exit it starts a replacement with the supplied\ntask. If a reused worker has finished its previous task, send the new authorized\nrequest; `start` deliberately does not submit it again. Use the same helper/socket\nthroughout. The child uses `--no-daemon` to avoid\nan unrelated shared Codex server; the launcher passes the originating Mac app for\npermission guidance. This grants no Full Disk Access. The tmux process can outlive\nthe advisor's tool call; `running` means that process is alive, not setup complete.\nInspect startup output before steering: a CLI login or trust prompt needs handling\nfirst; process creation alone does not mean the Codex composer is ready.\n\n**Communication:** `send` steers the worker's active turn; `read` returns its recent\nterminal output. This is the shared channel\u2014no new queue or pipeline state file.\nRead the existing manifest as well as the worker output: it owns the exact action,\nprogress and retry command. Open each printed `STATUS PAGE:` URL beside chat;\nlet the login commands manage their Chrome windows; open review separately. A `NEEDS USER:` or `BLOCKED:` reply\nneeds advisor attention; relay the user's answer through `send`. Verify changes\nfrom the manifest before claiming a source was skipped or search is ready.\n\nKeep observing login, QR and permission completion; no \"done\" reply is needed.\nKeep the status/review server available when the worker finishes.\n\n## Keep the status page beside chat\n\nOpen the exact printed `STATUS PAGE:` URL immediately. Use the host's browser-pane\ntool when available; reuse the tab on retries. On Codex, use `open_in_codex` when\navailable. Other hosts may use their supported pane or system browser.\n\nKeep this tab on `/install`. Login commands reuse Powerpacks-managed Chrome\nsessions and close their windows when finished. Open review separately; never\nnavigate the status tab to login or callback URLs. The page reads saved progress and the real\nModal status files; it does not own the pipeline process. Closing or restarting\nits server must not stop the coordinator.\n\nUse the page for progress, with short chat only for input or needed action. The\nanimation signals activity, not invented percentages. Preserve a disconnected\npage and reconnect to the same server; never turn a connection loss into a source\nfailure. Check `/healthz`, `/api/install`, and `.powerpacks/install/server.log`.\n\n## Choices and waiting\n\nRerun the same install instruction to resume. Keep the existing checkout, accounts,\nprojects, imports and processing caches. Check access again, but do not force a\nlogin or recreate a working project. Saved source/account/history choices survive\nthe bootstrap; explicit new choices override them. `--refresh` requests a resync\nfor that invocation only. Unchanged prepared contacts keep their current index;\nmissing outputs or changed inputs are repaired or processed by the normal flow.\n\nDefault to LinkedIn, Gmail's past year, iMessage, and WhatsApp. Inform the user\nonce and keep going. Apply already-given account/history choices. Gmail defaults to\nthe Powerset login's address. Only without a Powerset account does the coordinator\nask which Gmail accounts to add: ask the user in chat (a plain message, then wait\nfor the reply), append one `--gmail-email` per address to the saved\n`retry_command`, first address first, and run it. Every address gets\nits own browser approval; the coordinator allows them all beforehand. Powerset, LinkedIn and Google login flows reuse\nheadless Chrome (or Brave); a window opens only when a login is needed, closes\nonce the user is signed in, and the sessions are kept for later runs. LinkedIn\nreads up to ~3,000 connections per run, then processing starts; the rest sync on\nlater runs. Never ask for LinkedIn's emailed export, the user's LinkedIn URL, or\ntheir email: the coordinator reads them from those sessions.\n\nExisting `--source`, `--gmail-email`, `--sync-after`, `--wacli-store`, and `--refresh`\noptions pass through bootstrap. Saved source/account/history/store choices survive\nresume. Use `--refresh` only for a requested resync. Never choose an arbitrary Gmail\naccount from several or switch to a shared Powerset network merely because it works.\nUnprovisioned or unindexed hosted search does not block local source setup.\n\nWhen the Gmail step says \"Gmail setup stopped in Google Cloud\", read its\n`action.details` (the page Google showed, `stuck_at`, the project) and fix it\nhere; never hand the user Google Cloud steps or open the console for them in a\nbrowser tab. If it needs a project the user owns, rerun the saved\n`retry_command`; setup creates their own.\n\nRead the manifest's `action` when waiting. The coordinator owns the sequence;\nthe agent handles an action that needs setup repair or approval.\nDo not hand its commands to the user. For Messages permissions, the existing\n`/api/install/permissions` action opens Full Disk Access and highlights the detected\napp. Tell the user which app was identified; only the user grants OS access.\n\n\"Skip Gmail for now\" also applies to iMessage, WhatsApp, and LinkedIn. Stop only\nthat pipeline's owned work, wait for it to exit, append `--skip-source gmail`\n(or the requested source) to the saved `retry_command`, and run it yourself.\nKeep all other choices. To resume that source, remove its skip option. Existing\nimports, stores, and accounts survive; never log out or clear data for a retry.\n\n## Approval and repair\n\nPaid steps (synthesis, duplicate processing, enrichment, indexing) run without\nasking; each estimate is written to the install log first. Modal checks its\nshared cache before spending.\n\nAn existing index is reused and verified locally when people.csv is unchanged;\notherwise the rerun builds it again.\n\nRead command output, saved progress, and `.powerpacks/install/install.log`:\n\n| Result | Action |\n| --- | --- |\n| `DONE:` | Verify the saved result; only index validation proves local search readiness. |\n| `NEEDS YOU:` | Handle the saved action or follow the existing live wait; retain ownership. |\n| `FAILED:` | Inspect the exact failure, repair within scope, rerun the saved coordinator. |\n| `STOP:` | Explain the environment required; do not continue on another computer. |\n\nUse the manifest's canonical `retry_command` to resume, following the shared\n[repair and feedback instructions](tmux-worker.md#repair-and-finish). Never delete\n`.powerpacks`, replace configuration or reset reviews to recover. If the index\nbuild failed, rerun that continuation against Modal's cache.\n\n## Finish\n\nAfter index validation succeeds, say: **Indexed <N> people.** Use the\nverified index's people count, including on reruns that reuse an existing index.\nThen add: Try `$search software engineers in New York in my network`.\nDo not append cloud network counts, source recaps, or optional review prompts.\nKeep those details on the status page or explain them when asked.\n\nIf the requested workflow could not finish, briefly state what remains blocked\nand any action only the user can take. For install-only requests, say Powerpacks\nis installed; do not claim an index was built. If the user also asked for a\nsearch, run the installed search skill once its backend is ready.\n", "mcp_count": 0, "mcp_refs": [], "name": "install-powerpacks", "pack": "powerset", "path": "packs/powerset/skills/install-powerpacks/SKILL.md", "primitive_count": 2, "primitive_refs": ["install", "shared"]}, {"description": "Diagnose Powerpacks installation, Python, login, credentials, and agent connection problems. Use for a requested health check or when a Powerpacks workflow fails with an unclear setup error. Repair within the user's requested scope; not for routine preflight or product development.", "display_name": "powerset:powerpacks-doctor", "heading": "Powerpacks Doctor", "markdown": "---\nname: powerpacks-doctor\ndescription: Diagnose Powerpacks installation, Python, login, credentials, and agent connection problems. Use for a requested health check or when a Powerpacks workflow fails with an unclear setup error. Repair within the user's requested scope; not for routine preflight or product development.\n---\n\n# Powerpacks Doctor\n\nUse the installed checkout identified by this skill's context. For an uninstalled\nsource skill, use `POWERPACKS_REPO_ROOT` when supplied, otherwise `~/powerpacks`.\nRun commands there. For data stored under the wrong installation, use\n`fix-powerpacks` instead.\n\nStart with the failing command's error. If the cause and repair are already\nclear, make that repair; don't run a broad check merely to confirm it.\nOtherwise run the read-only report:\n\n```bash\nbin/doctor run --profile search-core --env-file .env\n```\n\nRead `checks`: each entry provides `status`, `message`, `fix_kind`, and, when\navailable, `fix_command`. An audit-only request ends with the findings.\nDuring requested setup or repair, execute relevant free, reversible fixes\ndirectly and retry the failing command. Do not give the user a command you can\nrun or ask again for an already-authorized repair.\n\n- Python or dependency problems: run `bin/setup-python`.\n- Login or credential refresh: use `powerset`; its managed Chrome login\n  window closes afterward while the in-app progress pane stays on its status page.\n- Other local fixes: run the relevant reported command from this shell. Do not\n  run blanket `doctor fix` or hide browser/TTY interaction in a nested command.\n- Human action or account provisioning: explain the one action needed. An agent\n  cannot grant the account service access; report that limitation accurately.\n\nAsk before new spend, destructive changes, or expanding access. Preserve local\ndata and paid artifacts; don't start imports, enrichment, or uploads as repair.\nNever print credential values. Stop if the same failure returns after a\ntargeted repair and explain the remaining action.\n\nVerify the original command works before reporting recovery. Keep the result\nshort and distinguish installation, sign-in, and working search.\n", "mcp_count": 0, "mcp_refs": [], "name": "powerpacks-doctor", "pack": "powerset", "path": "packs/powerset/skills/powerpacks-doctor/SKILL.md", "primitive_count": 0, "primitive_refs": []}, {"description": "Unified Powerset command surface. Use for `$powerset setup`, `$powerset login`, `$powerset status`, `$powerset whoami`, `$powerset sets list`, `$powerset sets use [id-or-name]`, `$powerset env pull`, `$powerset create oauth app`, and `$powerset help`.", "display_name": "powerset:powerset", "heading": "Powerset", "markdown": "---\nname: powerset\ndescription: Unified Powerset command surface. Use for `$powerset setup`, `$powerset login`, `$powerset status`, `$powerset whoami`, `$powerset sets list`, `$powerset sets use [id-or-name]`, `$powerset env pull`, `$powerset create oauth app`, and `$powerset help`.\n---\n\n# Powerset\n\nUse this skill when the user asks for `$powerset ...` or wants Powerset setup,\nstatus, identity, runtime key pull, or default set selection.\nFirst-run setup has one path, the install skill\n(`packs/powerset/skills/install-powerpacks/SKILL.md`); `$powerset setup` runs it.\n\n## Command routing\n\n| User command | Do this |\n| --- | --- |\n| `$powerset`, `$powerset help` | Print the supported subcommands below. |\n| `$powerset setup` | Load and follow `packs/powerset/skills/install-powerpacks/SKILL.md`. |\n| `$powerset login` | Run the login workflow below. |\n| `$powerset status` | Run the setup check quietly and summarize only blockers. |\n| `$powerset whoami` | Run the Auth0 `whoami` primitive. |\n| `$powerset sets`, `$powerset sets list` | Follow `packs/powerset/skills/powerset-set/SKILL.md` to list sets via HTTP `/v2/sets`. |\n| `$powerset sets use <id|name>` | Follow `packs/powerset/skills/powerset-set/SKILL.md` to resolve a set via HTTP `/v2/sets` and write `POWERPACKS_DEFAULT_SET_ID` to local `.env`. |\n| `$powerset env pull` | Pull your Modal token + OpenAI key + Parallel key + Powerset API key from the Powerset API (using your Auth0 login) into `.env`. The explicit command is consent to write `.env`. |\n| `$powerset create oauth app` | Route to the msgvault setup primitive for Gmail OAuth Desktop app guidance. |\n\nAliases remain valid for backcompat: `$powerset-login` means `$powerset login`;\n`$powerset-set` means `$powerset sets` / `$powerset sets use`. If the user asks\nfor Powerset setup without naming a subcommand, or for `$setup`, follow the\ninstall skill.\n\n## Help text\n\nWhen asked for help, respond with:\n\n```text\n$powerset setup                 set up Powerpacks (runs the install skill)\n$powerset login                 refresh Auth0 credentials and runtime keys\n$powerset status                check local setup\n$powerset whoami                show current Powerset/Auth0 identity\n$powerset sets list             list visible Powerset sets\n$powerset sets use <id|name>    set local default set in .env\n$powerset env pull              pull Modal/OpenAI/Parallel/Powerset API keys into .env\n$powerset create oauth app      guide Gmail OAuth app setup for msgvault\n$powerset help                  show this help\n```\n\n## Canonical repo setup\n\nFor mutating commands (`$powerset login`, `$powerset env\npull`, `$powerset sets use`, and `$powerset create\noauth app`), first resolve and enter the installed Powerpacks repo.\nThis ensures `.env` and any local Powerpacks state are written under the\ninstalled checkout such as `~/powerpacks`, not under an agent skill bundle like\n`~/.codex/powerpacks`.\n\nPrefer, in order:\n\n1. `$POWERPACKS_REPO_ROOT` if it points to a Powerpacks repo;\n2. current working directory if it is a Powerpacks repo and not a legacy skill bundle;\n3. `~/powerpacks`;\n4. `~/workspace/powerpacks`.\n\n```bash\nresolve_powerpacks_root() {\n  for candidate in \"${POWERPACKS_REPO_ROOT:-}\" \"$PWD\" \"$HOME/powerpacks\" \"$HOME/workspace/powerpacks\"; do\n    [[ -n \"$candidate\" ]] || continue\n    [[ \"$candidate\" != */.codex/powerpacks && \"$candidate\" != */skills/*/powerpacks ]] || continue\n    if [[ -d \"$candidate/packs\" && -f \"$candidate/pyproject.toml\" ]]; then\n      printf '%s\\n' \"$candidate\"\n      return 0\n    fi\n  done\n  return 1\n}\nrepo=\"$(resolve_powerpacks_root)\" || {\n  echo \"No installed Powerpacks repo found. Install/copy Powerpacks to ~/powerpacks first.\" >&2\n  exit 1\n}\ncd \"$repo\"\n```\n\nFor read-only commands (`$powerset status`, `$powerset whoami`, `$powerset sets\nlist`), still prefer the canonical repo when available. If no canonical repo is\navailable, stop instead of writing or syncing from `~/.codex/powerpacks`.\n\nRun primitives from the canonical repo with `uv run --env-file .env --project . python\npacks/...`. Prefer `python3` only when invoking a local helper outside `uv`.\n\n## `$powerset setup`\n\nLoad `packs/powerset/skills/install-powerpacks/SKILL.md` from the installed\ncheckout and follow it. Its coordinator signs in, pulls runtime keys,\nand then imports and indexes the user's network, so there is no\nseparate Powerset-only setup.\n\n## `$powerset login`\n\nUser-facing output must be terse:\n\n- Start with exactly: `Updating your credentials...`\n- Do not narrate setup checks, missing check names, token formats, or successful substeps.\n- If a browser/code login is needed, show only the auth URL/code prompt.\n- On success, say exactly:\n  `Credentials updated.`\n- If everything was already valid, say:\n  `Credentials are already up to date.`\n- For unresolved human-action blockers, give one short sentence with the action\n  required. Do not paste raw reports.\n\nRun one internal setup check:\n\n```bash\nuv run --env-file .env --project . python packs/powerset/primitives/doctor/doctor.py run \\\n  --profile search-core \\\n  --env-file .env\n```\n\nIf `overall == \"ok\"`, use the already-valid success sentence above and stop.\nOtherwise handle `fix_kind` values internally:\n\n- `auto`: run the primitive directly from this shell.\n- `interactive`: run the CLI directly from this shell. For browser/code flows,\n  keep prompts visible to the user.\n- `shell_install`: ask before running any OS-level install command.\n- `human_action`: tell the user what maintainer/Slack action is required.\n\nCommon direct fixes:\n\n```bash\nuv run --env-file .env --project . python packs/powerset/primitives/auth/auth.py login\nuv run --env-file .env --project . python packs/powerset/primitives/pull_runtime_keys/pull_runtime_keys.py pull --env-file .env\n```\n\nDo not run nested fix commands in the normal login flow; they can hide\ninteractive work inside a subprocess. Run the direct primitives above instead.\nNever print secret values.\n\nRe-run the setup check at the end and use one of the terse final messages above.\nIf `runtime_keys` is still missing after the env pull, the API returned\n`not_provisioned` \u2014 tell the user an admin must provision their Modal token /\nOpenAI key / Parallel key / Powerset API key for their Powerset user (the endpoints never mint).\n\n## `$powerset status`\n\nRun the setup check read-only with the requested or default profile:\n\n```bash\nuv run --env-file .env --project . python packs/powerset/primitives/doctor/doctor.py run \\\n  --profile search-core \\\n  --env-file .env\n```\n\nSummarize only `Ready` or the concise blocker/action. Do not mention the checker,\nraw counts or individual passed checks unless the user explicitly asks for\ndebugging detail.\n\n## `$powerset whoami`\n\n```bash\nuv run --env-file .env --project . python packs/powerset/primitives/auth/auth.py whoami\n```\n\nReport the email and authorization/role. Do not print raw tokens.\n\n## `$powerset env pull`\n\nPulls the keys the local machine needs into `.env` from the Powerset API using\nyour Auth0 login. The laptop needs a Modal token (to dispatch), an OpenAI key\n(local search LLM steps), a Parallel key (local Parallel-backed flows), a\nTypeSafe key (Jev capability scoring), and a Powerset gateway key (local\nLinkedIn profile hydration).\nThe explicit `$powerset env pull` request is consent to write `.env`; do not ask\nfor separate confirmation. Run it even when `.env` already exists so existing\nkeys are refreshed and newly provisioned keys are added:\n\n```bash\nuv run --env-file .env --project . python packs/powerset/primitives/pull_runtime_keys/pull_runtime_keys.py pull \\\n  --env-file .env\n```\n\nThis fetches `MODAL_TOKEN_ID` / `MODAL_TOKEN_SECRET`, `OPENAI_API_KEY`,\n`PARALLEL_API_KEY`, `TYPESAFE_API_KEY`, and `POWERSET_API_KEY`. If the pull reports\n`not_provisioned` for a key, an admin\nmust provision it for your Powerset user out of band (the endpoints never mint)\n\u2014 relay that one-line action and continue. Requires a valid Auth0 login\n(`$powerset login`).\n\n## `$powerset create oauth app`\n\nThis alias is for msgvault/Gmail OAuth setup. Prefer browser automation:\n\n```bash\nuv run --env-file .env --project . python packs/ingestion/primitives/setup/msgvault_setup.py browser-setup\n```\n\nIf the user only wants instructions, run:\n\n```bash\nuv run --env-file .env --project . python packs/ingestion/primitives/setup/msgvault_setup.py create-oauth-app\n```\n\nIf the user provided an email, add `--email <gmail>`. If they provided a Google\nCloud project, add `--project <project>`. Report the browser action and the\ncontinuation command with `--client-secret`.\n\n## `$powerset sets list` / `$powerset sets use <id|name>`\n\nFollow `packs/powerset/skills/powerset-set/SKILL.md`. It reuses the existing\nHTTP `/v2/sets` request and stores only the default choice in local `.env`.\n", "mcp_count": 0, "mcp_refs": [], "name": "powerset", "pack": "powerset", "path": "packs/powerset/skills/powerset/SKILL.md", "primitive_count": 4, "primitive_refs": ["auth", "doctor", "pull_runtime_keys", "setup"]}, {"description": "One-command Powerset login flow. Quietly refreshes Auth0 credentials, pulls provisioned runtime keys from the Powerset API, and only stops for OS installs, visible auth codes, or human actions.", "display_name": "powerset:powerset-login", "heading": "Powerset Login", "markdown": "---\nname: powerset-login\ndescription: One-command Powerset login flow. Quietly refreshes Auth0 credentials, pulls provisioned runtime keys from the Powerset API, and only stops for OS installs, visible auth codes, or human actions.\n---\n\n# Powerset Login\n\nUse this skill when the user asks for `$powerset login`, `$powerset-login`,\nor \"log me in to Powerset\". For first-run Powerset setup, runtime setup, or\nAPI key setup, prefer the unified `$powerset setup` command in\n`packs/powerset/skills/powerset/SKILL.md`; it intentionally runs login plus\nruntime key pull. This alias remains the right skill when\nan unrelated Powerpacks command failed because of a missing key or expired\nsession.\n\n**This skill is built to be fast and quiet.** The user said \"log me in\" - do\nthat. Don't ask permission for every step. Use setup-check classifications to\ndecide what needs asking, but run fixes yourself from the current\ninvocation/shell so prompts, URLs, and failures are visible.\n\nUser-facing output must be terse:\n\n- Start with exactly: `Updating your credentials...`\n- Do not narrate setup checks, missing check names, token formats, or successful substeps.\n- If a browser/code login is needed, show only the auth URL/code prompt.\n- On success, say exactly:\n  `Credentials updated.`\n- If everything was already valid, say:\n  `Credentials are already up to date.`\n- For unresolved human-action blockers, give one short sentence with the action\n  required. Do not paste raw reports.\n\n## Core Rule\n\nUse the read-only setup checker for diagnosis. In the normal skill flow, do not\nrun nested fix commands; they can hide interactive work inside a subprocess and\nswallow browser/code prompts. Let the skill self-heal by running the relevant\nprimitive or CLI command directly.\n\nOnly use install commands when something is actually missing. Do not reinstall\nPowerpacks adapters or credentials when the setup check says the\ncheck is already `ok`.\n\n## Canonical Repo Setup\n\nResolve and enter the installed Powerpacks repo before running any\nPowerset login/setup command. This ensures `.env` and local Powerpacks state are\nwritten under the installed checkout such as `~/powerpacks`, not under an agent\nskill bundle like `~/.codex/powerpacks`.\n\n```bash\nresolve_powerpacks_root() {\n  for candidate in \"${POWERPACKS_REPO_ROOT:-}\" \"$PWD\" \"$HOME/powerpacks\" \"$HOME/workspace/powerpacks\"; do\n    [[ -n \"$candidate\" ]] || continue\n    [[ \"$candidate\" != */.codex/powerpacks && \"$candidate\" != */skills/*/powerpacks ]] || continue\n    if [[ -d \"$candidate/packs\" && -f \"$candidate/pyproject.toml\" ]]; then\n      printf '%s\\n' \"$candidate\"\n      return 0\n    fi\n  done\n  return 1\n}\nrepo=\"$(resolve_powerpacks_root)\" || {\n  echo \"No installed Powerpacks repo found. Install/copy Powerpacks to ~/powerpacks first.\" >&2\n  exit 1\n}\ncd \"$repo\"\n```\n\nRun primitives from the canonical repo with `uv run --env-file .env --project . python packs/...`.\n\n## Happy Path\n\nRun one internal read-only setup check:\n\n```bash\nuv run --env-file .env --project . python packs/powerset/primitives/doctor/doctor.py run \\\n  --profile search-core \\\n  --env-file .env\n```\n\nIf `overall == \"ok\"`, use the already-valid success sentence above and stop.\n\n## How To Handle The Setup Report\n\nThe setup check returns one JSON object. The fields you care about are `checks`,\n`by_fix_kind`, and `next_actions`. Each missing/fail check has a `fix_kind`:\n\n| `fix_kind` | What to do | Ask the user? |\n| --- | --- | --- |\n| `auto` | Run the specific primitive directly from this shell. | no |\n| `interactive` | Run the CLI directly from this shell. For browser/code flows, keep prompts visible. | no, except asking for an auth code if the CLI requires one |\n| `shell_install` | OS-level install (`brew install`, etc.). | yes, with the exact command shown |\n| `human_action` | Cannot be fixed by the skill. | tell the user, don't loop |\n\n## Workflow\n\n### Step 1 - Install only when missing\n\nIf the Powerpacks skill bundle or host adapter is missing and you are in the\nPowerpacks repo, run the repo installer for the current host instead of trying\nto repair it through a nested fix command:\n\n```bash\n./install.sh codex\n./install.sh claude-code\n```\n\nPick the host the user is currently using. If both hosts need repair, run both.\n\n### Step 2 - Login directly from this shell\n\nIf `auth0_login` is missing or expired, run:\n\n```bash\nuv run --env-file .env --project . python packs/powerset/primitives/auth/auth.py login\n```\n\nLet this command manage sign-in in Powerpacks' saved Chrome profile. It reuses\nthe session, shows a window when human input is needed, and closes it afterward.\nKeep the in-app progress pane on its status page; do not open another login\nwindow or navigate it to a callback. Use `--no-browser` only for an explicitly\nrequested manual or headless login.\n\n### Step 3 - Pull runtime keys directly\n\nIf `runtime_keys` is missing, run:\n\n```bash\nuv run --env-file .env --project . python packs/powerset/primitives/pull_runtime_keys/pull_runtime_keys.py pull \\\n  --env-file .env\n```\n\nThis pulls `MODAL_TOKEN_ID`, `MODAL_TOKEN_SECRET`, `OPENAI_API_KEY`,\n`PARALLEL_API_KEY`, `TYPESAFE_API_KEY`, and `POWERSET_API_KEY` from the\nauthenticated Powerset API when the user has been provisioned. Modal handles\nhosted processing for Powerset users.\nThe Google Cloud CLI remains relevant\nonly to the separate msgvault/Gmail OAuth app setup flow.\n\n### Step 4 - Human-action blockers\n\n`human_action` entries:\n\n- `auth0_role` warn: \"You're logged in but haven't been granted a Powerpacks\n  role. Ask a Powerset admin to add your account to the Powerpacks Auth0 role.\"\n- `runtime_keys` `not_provisioned`: \"You're logged in, but your\n  Modal/OpenAI/Parallel/TypeSafe/Powerset API runtime keys have not been\n  provisioned yet. Ask a Powerset admin to provision them, then rerun `$powerset login`.\"\n\nThese are not blockers for unrelated workflows unless that workflow needs the\nmissing runtime key.\n\n### Step 5 - Final state\n\nRe-run the setup check and report a terse final message:\n\n- `overall: ok` -> \"Credentials updated.\"\n- `overall: warn` -> same, but mention the remaining warning in one short phrase.\n- `overall: needs_setup` -> list the still-blocked items and what the user\n  needs to do.\n\n## Hard Rules\n\n- Never print secret values. Every primitive redacts.\n- Never run an OS install command without explicit user approval.\n- Never write `.env` unless the user explicitly requested `$powerset setup`,\n  `$powerset login`, or `$powerset env pull`.\n- Runtime-key authorization is enforced by the Powerset API using the cached\n  Auth0 bearer token; do not add a separate email-domain gate.\n", "mcp_count": 0, "mcp_refs": [], "name": "powerset-login", "pack": "powerset", "path": "packs/powerset/skills/powerset-login/SKILL.md", "primitive_count": 3, "primitive_refs": ["auth", "doctor", "pull_runtime_keys"]}, {"description": "List accessible Powerset sets, show the active default set, or set POWERPACKS_DEFAULT_SET_ID so local Powerpacks search primitives inherit the desired set scope.", "display_name": "powerset:powerset-set", "heading": "Powerset Set", "markdown": "---\nname: powerset-set\ndescription: List accessible Powerset sets, show the active default set, or set POWERPACKS_DEFAULT_SET_ID so local Powerpacks search primitives inherit the desired set scope.\n---\n\n# Powerset Set\n\nUse this skill when the user wants to choose, inspect, retrieve, list, switch,\nor set the active Powerset set for local Powerpacks search.\n\nThe skill uses HTTP `/v2/sets` for set retrieval and name resolution.\nIt only manages local set scope:\n\n- lists sets accessible to the logged-in Powerset user\n- shows the resolved default set and operator IDs\n- writes `POWERPACKS_DEFAULT_SET_ID` into the local ignored `.env`\n- does not upload contacts, run searches, or mutate server-side set membership\n\n## Canonical repo setup\n\nFor `$powerset sets use <id|name>`, resolve and enter the installed\nPowerpacks repo before writing `.env`:\n\n```bash\nresolve_powerpacks_root() {\n  for candidate in \"${POWERPACKS_REPO_ROOT:-}\" \"$PWD\" \"$HOME/powerpacks\" \"$HOME/workspace/powerpacks\"; do\n    [[ -n \"$candidate\" ]] || continue\n    [[ \"$candidate\" != */.codex/powerpacks && \"$candidate\" != */skills/*/powerpacks ]] || continue\n    if [[ -d \"$candidate/packs\" && -f \"$candidate/pyproject.toml\" ]]; then\n      printf '%s\\n' \"$candidate\"\n      return 0\n    fi\n  done\n  return 1\n}\nrepo=\"$(resolve_powerpacks_root)\" || {\n  echo \"No installed Powerpacks repo found. Install/copy Powerpacks to ~/powerpacks first.\" >&2\n  exit 1\n}\ncd \"$repo\"\n```\n\nFor read-only set listing, still prefer the canonical repo when available.\n\n## Workflow\n\n1. From the installed checkout, refresh the accessible sets using the existing\n   bootstrap request to HTTP `/v2/sets`:\n\n```bash\nbin/agent-bootstrap --json\n```\n\n2. Require `sets_refreshed: true`. If refresh fails, report the error; for\n   missing credentials, follow `$powerset login`, then retry. Read the fresh\n   `sets` array in `.powerpacks/memory/set_ids.json` and show concise rows with\n   name, ID, role, and counts.\n3. Show the current default by reading `POWERPACKS_DEFAULT_SET_ID` from local\n   `.env` and matching that ID against the returned sets. If unset, check\n   legacy `POWERSET_DEFAULT_SET_ID`.\n4. For `sets use <id|name>`, resolve the requested value against returned set\n   IDs or names. If multiple names match, ask which set; never guess. Upsert\n   only `POWERPACKS_DEFAULT_SET_ID` in local `.env` using the existing writer:\n\n```python\nfrom pathlib import Path\nfrom packs.powerset.primitives.pull_runtime_keys.pull_runtime_keys import write_env\nwrite_env(Path(\".env\"), {\"POWERPACKS_DEFAULT_SET_ID\": \"<selected set id>\"})\n```\n\n5. Read `.env` back and report the selected set name, `set_id`, `person_count`,\n   `member_count`, and `sales_nav_account_count` when available. Only run\n   `resolve_set_operators` if the user specifically asks to validate local\n   TurboPuffer operator scoping.\n\n## Notes\n\n- `set_id` is a Powerset set UUID.\n- Local search primitives resolve it to `operator_ids` before applying\n  TurboPuffer `allowed_operator_ids`.\n- `POWERPACKS_DEFAULT_SET_ID` is preferred. `POWERSET_DEFAULT_SET_ID` is still\n  accepted as a legacy alias by search primitives.\n- The API owns set listing. The local repo owns only the default choice in `.env`.\n", "mcp_count": 0, "mcp_refs": [], "name": "powerset-set", "pack": "powerset", "path": "packs/powerset/skills/powerset-set/SKILL.md", "primitive_count": 2, "primitive_refs": ["pull_runtime_keys", "resolve_set_operators"]}, {"description": "Force-update the canonical Powerpacks checkout to the newest published release and reinstall skills while preserving .powerpacks. Use for $update-powerpacks.", "display_name": "powerset:update-powerpacks", "heading": "update-powerpacks", "markdown": "---\nname: update-powerpacks\ndescription: Force-update the canonical Powerpacks checkout to the newest published release and reinstall skills while preserving .powerpacks. Use for $update-powerpacks.\n---\n\n# update-powerpacks\n\nRun exactly one command for the current harness:\n\n**Codex**\n\n```bash\n\"$HOME/.agents/skills/update-powerpacks/update-powerpacks\" codex\n```\n\n**Claude Code**\n\n```bash\n\"${CLAUDE_CONFIG_DIR:-$HOME/.claude}/skills/update-powerpacks/update-powerpacks\" claude-code\n```\n\n**Pi**\n\n```bash\n\"${PI_HOME:-$HOME/.pi/agent}/skills/update-powerpacks/update-powerpacks\" pi\n```\n\nDo not inspect Git state first. Do not run any other Git command. Do not pop or\nrepair the stash. Do not run setup, doctor, imports, or state repair afterward.\nReport the script's final key/value lines.\n\nThe updater refreshes `POWERSET_API_KEY` and fills a missing or empty\n`TYPESAFE_API_KEY`. It preserves nonempty TypeSafe keys. Failed pulls leave\nsettings intact and never print keys. No inference runs.\n\n## Channels\n\nThe update lands on the newest **published release**, so an unreleased change\ncannot reach an installed user. Prefix the command only when the user asks for a\ndifferent channel; the choice then sticks for every later update.\n\n| Want | Prefix |\n| --- | --- |\n| Newest stable release (default) | nothing |\n| Newest release candidate | `POWERPACKS_CHANNEL=rc` |\n| Unreleased tip of the default branch | `POWERPACKS_CHANNEL=edge` |\n| One exact version | `POWERPACKS_REF=powerpacks-v0.18.0` |\n", "mcp_count": 0, "mcp_refs": [], "name": "update-powerpacks", "pack": "powerset", "path": "packs/powerset/skills/update-powerpacks/SKILL.md", "primitive_count": 0, "primitive_refs": []}, {"description": "Run a Sales Navigator search through the Powerset Search MCP. Resolves company / title filters to LinkedIn IDs, runs a paginated lead search with server-side artifact persistence on by default, and offers paginated retrieval via get_artifact.", "display_name": "powerset:sales-nav-search", "heading": "Sales Nav Search", "markdown": "---\nname: sales-nav-search\ndescription: Run a Sales Navigator search through the Powerset Search MCP. Resolves company / title filters to LinkedIn IDs, runs a paginated lead search with server-side artifact persistence on by default, and offers paginated retrieval via get_artifact.\n---\n\n# Sales Nav Search\n\nUse this skill when the user asks for `/sales-nav-search <query>`,\n\"find LinkedIn leads at <company>\", \"show me sales nav results for <title>\",\nor any other Sales Navigator search request scoped to the user's set.\n\nThe skill is in its own pack (`packs/sales-nav`) but **depends on\n`packs/powerset`** for Auth0 login and MCP install. If those aren't ready,\nroute the user to `$powerset setup` first.\n\nIt calls these MCP tools served by the remote `powerset-search` MCP configured in\n`POWERPACKS_MCP_URL`:\n\n- `sales_nav_resolve` \u2014 turn company names + titles into LinkedIn\n  `company_ids` / canonical title strings\n- `sales_nav_search` \u2014 paginated lead search scoped to the user's set;\n  with `conversation_id` + `persist_artifact: true` the server writes a\n  Supabase artifact row and returns an `artifact_id`\n- `get_artifact` \u2014 paginated retrieval of a persisted artifact\n- `enrich_extended_profiles` \u2014 enrich selected lead member IDs with profile\n  fields, then persist them back to the latest Sales Nav artifact\n- `sales_nav_resolve_member_ids` \u2014 resolve mutual member IDs to LinkedIn URLs\n  through cache/free layers by default\n\nThe skill itself does not call HTTP \u2014 Claude Code / Codex invoke the MCP\ntools directly once `mcp_install` (in `packs/powerset`) has registered the\nserver.\n\n## Hard rules\n\n- This skill **requires** the `powerset-search` MCP. If it is not\n  registered, route the user through `$powerset setup` \u2192\n  `mcp_install install --host all`.\n- Every Sales Nav call is **scoped to a `set_id`**. The MCP server enforces\n  the set context. Pass the one the user specifies. If the user does not\n  specify one, resolve the default with\n  `packs/search/primitives/resolve_set_operators/resolve_set_operators.py`\n  so it can inherit `POWERPACKS_DEFAULT_SET_ID` / `POWERSET_DEFAULT_SET_ID`, or\n  fall back to the logged-in operator's active personal set. Do not invent or\n  guess `set_id`s.\n- **Default to `persist_artifact: true` on every `sales_nav_search` call.**\n  Persistence is cheap and lets the user (or the agent in a later turn) page\n  large result sets via `get_artifact`. Only pass `persist_artifact: false`\n  when the user explicitly asks for an ephemeral search.\n- Persistence requires a `conversation_id`. See the conversation_id playbook\n  below \u2014 without one, persistence is silently skipped server-side and you\n  only get the inline `leads` list back.\n- Lead profiles can include LinkedIn URLs and contact metadata. Treat them\n  as sensitive: keep them in local `.powerpacks/` handoff files and present only\n  compact summaries in chat unless the user asks for details.\n- Do not pass accumulated lead/mutual payloads through chat or command args.\n  Save each MCP page response to a small JSON file, then run\n  `sales_nav_artifacts ingest-page --response <path>` so later steps pass only\n  paths/state.\n- **Default to the orchestrator.** For normal runs, do not hand-compose a long\n  MCP/tool sequence in chat. Create a search args/plan JSON, run\n  `sales_nav_pipeline`, execute only the `blocked_tool_call` it emits, save the\n  response to the requested path, then continue until completed or blocked.\n  Use primitives directly only for narrow debugging or power-user requested\n  edits.\n- For clear, unambiguous searches, do not ask approval/clarifying questions.\n  Resolve filters, build a one-or-more-query search plan, let the orchestrator\n  search, ingest full artifact content, enrich the visible leads, resolve mutual\n  URLs locally, export CSVs, and present a compact summary. Ask only when a\n  filter is genuinely ambiguous (for example multiple plausible \"Cisco\"\n  companies) or when the user asks to page/enrich far beyond the visible result\n  set.\n- Start a fresh Sales Nav search for each search request. Do not scan, discover,\n  reuse, resume, or refine from previous `.powerpacks/sales-nav`, artifact,\n  `artifact_id`, CSV, JSONL, manifest, or state files. You may use artifacts\n  created by the current run for ingestion, enrichment, pagination, and export.\n- Do not auto-page endlessly. It is OK for the orchestrator search plan to\n  include deliberate same-turn fallback queries/pages for robustness (for\n  example strict role + company-only fallback), but otherwise surface\n  `has_more` / `next_start_offset` and ask before loading more.\n- Keep fallback searches structured before falling back to free text. If an\n  exact current-company query returns 0, retry with the same org ID in\n  `past_company_ids` before using `keywords`. Keywords are the last fallback.\n\n## Prereqs\n\nRun every command below from the Powerpacks checkout, like the other skills:\n\n```bash\nresolve_powerpacks_root() {\n  for candidate in \"${POWERPACKS_REPO_ROOT:-}\" \"$PWD\" \"$HOME/powerpacks\" \"$HOME/workspace/powerpacks\"; do\n    [[ -n \"$candidate\" && -x \"$candidate/install.sh\" && -d \"$candidate/packs\" ]] || continue\n    echo \"$candidate\"; return 0\n  done\n  return 1\n}\nREPO=\"$(resolve_powerpacks_root)\" || { echo \"Install Powerpacks to ~/powerpacks first.\" >&2; exit 1; }\ncd \"$REPO\"\n```\n\nRun this once. It starts Auth0 login if credentials are missing or expired,\nthen installs the MCP into the chosen host:\n\n```bash\n./install-powerset-mcp.sh --host all\n```\n\nIf on Codex, rerun MCP install when the Auth0 token needs to be refreshed.\nThe installer writes a fresh `Authorization` header into `~/.codex/config.toml`:\n\n```bash\n./install-powerset-mcp.sh --host codex\n```\n\n## conversation_id playbook\n\n`conversation_id` is a Supabase `conversations.id`. The MCP server uses it\nto scope artifact reads/writes to a specific conversation. Three ways to\nget one:\n\n1. **From search.powerset.dev** \u2014 copy the conversation id from the URL\n   when the user has an open chat.\n2. **REST API** \u2014 `POST /v2/conversations` with the user's bearer token\n   returns `{ \"id\": \"...\" }`.\n3. **Per-skill ephemeral session** \u2014 generate a UUID4 the first time you\n   need one in the current skill invocation and reuse it for follow-ups\n   in the same turn. The artifact rows still persist in Supabase keyed by\n   that id; they just won't be linked to a webapp conversation.\n\nAlways pass the same `conversation_id` to subsequent `sales_nav_search`\ncalls and the matching `get_artifact` call.\n\n## Fast path runner\n\nPrefer the resumable Sales Nav orchestrator for normal runs:\n\n```bash\nuv run --project . python packs/sales-nav/primitives/sales_nav_pipeline/sales_nav_pipeline.py run \\\n  --query \"<user query>\" \\\n  --set-id \"<set_id>\" \\\n  --search-plan-json .powerpacks/sales-nav/<run>/search_plan.json\n```\n\nFor a single simple pass, `--search-args-json` is still accepted. Prefer\n`--search-plan-json` because robust Sales Nav recall often needs multiple\nqueries.\n\nThe runner owns local state for the current invocation and exits with\n`status: blocked_tool_call` whenever the harness should call a `powerset-search`\nMCP tool. The block includes the `tool_name`, `tool_args`, `save_response_to`,\nand `continue_command`. The harness/agent should call the MCP tool natively,\nwrite the JSON response to the specified path, then run the continue command.\nLocal ingest, lead enrichment, mutual URL resolution, export, scoring approvals,\nand the ledger are handled by the runner.\n\nFor follow-up qualitative search criteria, run a new Sales Nav search. Only pass\n`--criteria` when the user explicitly asks to score or analyze the current run's\nloaded leads rather than search again.\n\nSearch plan shape:\n\n```json\n{\n  \"score_criteria\": \"investment/endowment team\",\n  \"queries\": [\n    {\"id\": \"finance\", \"label\": \"parent company + finance\", \"args\": {\"company_ids\": [163348], \"function_ids\": [\"10\"]}},\n    {\"id\": \"company_only\", \"label\": \"parent company only\", \"args\": {\"company_ids\": [163348]}}\n  ]\n}\n```\n\nThe MCP `sales_nav_search` schema accepts current-company IDs via\n`company_ids`, past-company IDs via `past_company_ids`, optional display-name\nmaps for both, and text filters. Keep unrelated agent-only annotations in plan\nmetadata; the orchestrator strips unsupported fields from tool args.\n\n## Local file handoff\n\nNormally `sales_nav_pipeline` performs these local handoffs. Use the primitives\nbelow directly only when debugging a failed block in the current run or honoring\na power-user request to operate at the primitive level.\n\nUse `packs/sales-nav/primitives/sales_nav_artifacts/sales_nav_artifacts.py` as\nthe durable local store for each skill invocation. It normalizes MCP page output\ninto these files:\n\n- `leads.jsonl` \u2014 internal handoff, one row per lead with `member_id`,\n  `profile_id`, `source_account_ids`, `operators`, `mutual_member_ids`,\n  `total_interactions` when present, `linkedin_url`, title/company/location,\n  enriched profile fields (`summary`, `experiences`, `education`, `enriched`)\n  when available, artifact/source metadata, and seen counts.\n- `mutuals.jsonl` \u2014 internal handoff, one row per lead\u2194mutual edge with\n  `lead_member_id`, `mutual_member_id`, mutual LinkedIn URL if resolved,\n  `total_interactions` when present, operator/source metadata, and\n  artifact/source metadata.\n- `member_urls.json` \u2014 `member_id -> LinkedIn URL` results from\n  `sales_nav_resolve_member_ids`.\n- `manifest.json` / `state.json` \u2014 paths, counts, artifact ids, pages.\n- `exports/leads.csv` and `exports/mutuals.csv` \u2014 final user-facing CSVs written\n  only when you run `export`.\n\nInitialize once per search:\n\n```bash\nuv run --project . python packs/sales-nav/primitives/sales_nav_artifacts/sales_nav_artifacts.py init \\\n  --query \"<user query>\" \\\n  --set-id \"<set_id>\" \\\n  --conversation-id \"<conversation_id>\"\n```\n\nDo not ingest compact MCP preview rows when full artifact content is available.\nAfter each MCP `sales_nav_search`, save the response for audit, then immediately\ncall `get_artifact(include_content=true)` for the returned `artifact_id`, save\nthat full artifact response, and ingest with `--prefer-content`:\n\n```bash\nuv run --project . python packs/sales-nav/primitives/sales_nav_artifacts/sales_nav_artifacts.py ingest-page \\\n  --state .powerpacks/sales-nav/runs/<run>/state.json \\\n  --response .powerpacks/sales-nav/runs/<run>/pages/artifact-full-000.json \\\n  --prefer-content\n```\n\nWhen the user asks for mutual LinkedIn URLs, first get pending IDs from the\nlocal file store:\n\n```bash\nuv run --project . python packs/sales-nav/primitives/sales_nav_artifacts/sales_nav_artifacts.py pending-mutual-ids \\\n  --state .powerpacks/sales-nav/runs/<run>/state.json --limit 100\n```\n\nPass those IDs to MCP `sales_nav_resolve_member_ids`, save the MCP response,\nthen merge it:\n\n```bash\nuv run --project . python packs/sales-nav/primitives/sales_nav_artifacts/sales_nav_artifacts.py ingest-member-urls \\\n  --state .powerpacks/sales-nav/runs/<run>/state.json \\\n  --response .powerpacks/sales-nav/runs/<run>/member_urls.response.json\n```\n\nAfter `enrich_extended_profiles`, call `get_artifact(include_content=true)` again\nand ingest with `--prefer-content` so `leads.jsonl` contains the full enriched\nprofile fields (`summary`, `experiences`, `education`).\n\nFor final files:\n\n```bash\nuv run --project . python packs/sales-nav/primitives/sales_nav_artifacts/sales_nav_artifacts.py export \\\n  --state .powerpacks/sales-nav/runs/<run>/state.json\n```\n\nDo not use local lookup to answer search/refinement requests. The lookup\nprimitive is only for explicit inspection of the current run's local files, not\nfor deciding whether to avoid a new Sales Nav search:\n\n```bash\nuv run --project . python packs/sales-nav/primitives/sales_nav_artifacts/sales_nav_artifacts.py lookup \\\n  --state .powerpacks/sales-nav/runs/<run>/state.json --query \"<name/company/title>\"\n```\n\nFor explicit current-run analysis requests (for example \"score these current\nres
