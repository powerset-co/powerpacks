tors", "pack": "search", "path": "packs/search/primitives/resolve_set_operators"}, {"entrypoint": "packs/search/primitives/search_feedback/search_feedback.py", "file_count": 1, "has_readme": false, "name": "search_feedback", "pack": "search", "path": "packs/search/primitives/search_feedback"}, {"entrypoint": "packs/search/primitives/search_network_pipeline/search_network_pipeline.py", "file_count": 2, "has_readme": true, "name": "search_network_pipeline", "pack": "search", "path": "packs/search/primitives/search_network_pipeline"}, {"entrypoint": null, "file_count": 9, "has_readme": false, "name": "shared", "pack": "search", "path": "packs/search/primitives/shared"}, {"entrypoint": "packs/search/primitives/task_state/task_state.py", "file_count": 2, "has_readme": true, "name": "task_state", "pack": "search", "path": "packs/search/primitives/task_state"}, {"entrypoint": null, "file_count": 5, "has_readme": false, "name": "turbopuffer", "pack": "search", "path": "packs/search/primitives/turbopuffer"}, {"entrypoint": "packs/search/primitives/upload_search_results/upload_search_results.py", "file_count": 1, "has_readme": false, "name": "upload_search_results", "pack": "search", "path": "packs/search/primitives/upload_search_results"}, {"entrypoint": "packs/search/primitives/validate_artifact/validate_artifact.py", "file_count": 1, "has_readme": false, "name": "validate_artifact", "pack": "search", "path": "packs/search/primitives/validate_artifact"}], "skills": [{"description": "Script-backed Apollo outbound workflow. Use for `$build-outbound setup`, `$build-outbound status`, `$build-outbound prepare-leads`, previewing copy from Sales Nav leads, creating inactive Apollo sequences, and activation after exact campaign confirmation.", "display_name": "powerset:build-outbound", "heading": "Build Outbound", "markdown": "---\nname: build-outbound\ndescription: Script-backed Apollo outbound workflow. Use for `$build-outbound setup`, `$build-outbound status`, `$build-outbound prepare-leads`, previewing copy from Sales Nav leads, creating inactive Apollo sequences, and activation after exact campaign confirmation.\n---\n\n# Build Outbound\n\nUse this skill when the user asks to turn `$sales-nav-search` leads into an Apollo outbound sequence, or asks for Apollo setup/status. The sequence build is backed by `packs/apollo/primitives/build_outbound/build_outbound.py`; setup/status stay on `packs/apollo/primitives/apollo_mcp/apollo_mcp.py`.\n\n## Prerequisites\n\n- `APOLLO_API_KEY` in `.env` or the shell. Use a Master API key for sequence/email-account endpoints.\n- A connected Apollo sending mailbox and an Apollo emailer schedule.\n- A Sales Nav run under `.powerpacks/sales-nav/runs/` or an explicit Sales Nav `manifest.json` / `state.json`.\n- Never paste API keys, full lead lists, raw Apollo responses, or unmasked emails into chat.\n\n## Setup and status routes\n\n```bash\nuv run --project . python packs/apollo/primitives/apollo_mcp/apollo_mcp.py status --host codex\nuv run --project . python packs/apollo/primitives/apollo_mcp/apollo_mcp.py install --host codex\n# add --host claude or --host all when requested\n```\n\n- `$build-outbound status`: run status and report only whether key, Node/npx, and MCP registration are present. Never print the key.\n- `$build-outbound setup`: if `APOLLO_API_KEY` exists, run install for the requested host; otherwise tell the user how to add it locally.\n- `$build-outbound prepare-leads`: legacy/manual handoff route; run `apollo_mcp.py prepare-leads --input <export.csv>` and report counts/paths.\n\n## Normal `$build-outbound <instructions>` route\n\n1. Resolve the Sales Nav input:\n\n   ```bash\n   uv run --project . python packs/apollo/primitives/build_outbound/build_outbound.py resolve-sales-nav \\\n     --query-hint \"<user instructions>\"\n   # or include --sales-nav-manifest <path> / --state <path> when the user points to one\n   ```\n\n2. Print the selected search query, state/manifest path, lead count, and exactly: \u201cIf this is the wrong search, point me to the right manifest/state.\u201d\n\n3. Draft or use reviewed copy, then create a local preview:\n\n   ```bash\n   uv run --project . python packs/apollo/primitives/build_outbound/build_outbound.py preview \\\n     --instructions \"<user instructions>\" \\\n     --query-hint \"<user instructions>\"\n   ```\n\n   This writes `sequence_input.json` and `sequence_preview.md`. Print the exact subject/body preview for every step.\n\n4. Preview checkpoint: because enrichment spends Apollo credits and build mutates Apollo (sequence/contact creation and enrollment), ask for \u201cproceed with build\u201d confirmation unless the original request unambiguously asked to build/create/enrich now.\n\n5. Build the inactive Apollo campaign from the reviewed copy:\n\n   ```bash\n   uv run --project . python packs/apollo/primitives/build_outbound/build_outbound.py build \\\n     --instructions \"<user instructions>\" \\\n     --query-hint \"<user instructions>\" \\\n     --sequence-json <reviewed sequence_input.json>\n   ```\n\n   Use `--sales-nav-manifest <path>` or `--state <path>` instead of `--query-hint` when applicable. The build discovers default sender/schedule unless explicit IDs are supplied. Report campaign id, counts, masked email counts, and local artifact paths under `.powerpacks/apollo/build-outbound/<run>/`.\n\n6. Activation is separate. Do not run activation until the user explicitly confirms activation for the exact returned `campaign_id`.\n\n## Activation command\n\nOnly after exact campaign confirmation, run:\n\n```bash\nuv run --project . python packs/apollo/primitives/build_outbound/build_outbound.py activate \\\n  --manifest .powerpacks/apollo/build-outbound/<run>/manifest.json \\\n  --confirm-activation <campaign_id>\n```\n\nThe command requires the confirmation id to match the manifest campaign id, activates through Apollo, polls message status, and writes `activation_status.json`.\n\n## Safety rules\n\n- Do not run live Apollo mutations without explicit user approval: enrichment, contact create/dedupe, sequence/campaign creation, contact enrollment, and activation are spend-bearing or mutating.\n- Preview and resolve commands are safe local/read-only steps.\n- Non-dry-run build creates an inactive campaign only; it must not activate sending.\n- `activate` is the only route that can approve/activate the campaign, and it requires exact campaign id confirmation.\n- Use `--dry-run` for local smoke checks. Do not run live activation tests.\n- Console output must keep API keys redacted and emails masked; raw Apollo artifacts stay local under `.powerpacks/`.\n", "mcp_count": 0, "mcp_refs": [], "name": "build-outbound", "pack": "apollo", "path": "packs/apollo/skills/build-outbound/SKILL.md", "primitive_count": 2, "primitive_refs": ["apollo_mcp", "build_outbound"]}, {"description": "Build or inspect the local search index from the canonical merged people.csv without Modal, Postgres, Supabase, or TurboPuffer. Planning and dry-run are local-only; a full build reuses caches and may call configured classification/embedding providers for uncovered work after its estimate.", "display_name": "powerset:build-local-search-index", "heading": "Build Local Search Index", "markdown": "---\nname: build-local-search-index\ndescription: Build or inspect the local search index from the canonical merged people.csv without Modal, Postgres, Supabase, or TurboPuffer. Planning and dry-run are local-only; a full build reuses caches and may call configured classification/embedding providers for uncovered work after its estimate.\n---\n\n# Build Local Search Index\n\nBuild local indexing artifacts from canonical Powerpacks people data.\n\nFor the product-level distinction between the standard Modal setup path and\nthis local execution path, read\n[`packs/indexing/README.md`](../../README.md).\n\n## Canonical input\n\nPrefer the canonical merged people CSV written by the ingestion fan-in merge:\n\n```text\n.powerpacks/network-import/merged/people.csv\n```\n\nIf the aggregate merge output is missing or stale, run the contacts indexing\npipeline. It performs fan-in first, promotes the canonical\n`.powerpacks/network-import/merged/people.csv`, then indexes that file.\n\n## Run locally\n\nPlan inspection is local-only and safe:\n\n```bash\nuv run --project . python packs/indexing/primitives/index_contacts_pipeline/index_contacts_pipeline.py plan --operator-id <operator-id>\n```\n\nFirst inspect the processing estimate:\n\n```bash\nuv run --project . python packs/indexing/primitives/build_processing_pipeline/build_processing_pipeline.py run \\\n  --dry-run \\\n  --input .powerpacks/network-import/merged/people.csv \\\n  --output-dir .powerpacks/search-index \\\n  --default-operator-id <operator-id>\n```\n\nIf it reports paid provider calls or non-zero estimated cost, show it to the\nuser and obtain explicit approval. Then run the full local contacts indexing\npipeline:\n\n```bash\nuv run --project . python packs/indexing/primitives/index_contacts_pipeline/index_contacts_pipeline.py run --operator-id <operator-id>\n```\n\nThe run emits a dry-run cost estimate in the stage manifest before processing.\nWhen the user starts indexing from the app or this command, the same run proceeds\nwith the fixed-output pipeline and uses existing stage artifacts as caches.\n\nThe run is single-index and idempotent: a partial index resumes from\n`.powerpacks/search-index/ledger.json`; a completed index refreshes the same\ndirectory instead of creating a new one.\n\nThe stage manifest is written to:\n\n```text\n.powerpacks/network-import/index/contacts/manifest.json\n```\n\nUse the resulting local search DB:\n\n```bash\nexport POWERPACKS_LOCAL_SEARCH_DB=.powerpacks/search-index/local-search.duckdb\n```\n\nContinue a partial run:\n\n```bash\nuv run --project . python packs/indexing/primitives/build_processing_pipeline/build_processing_pipeline.py continue --ledger .powerpacks/search-index/ledger.json\n```\n\nStatus:\n\n```bash\nuv run --project . python packs/indexing/primitives/index_contacts_pipeline/index_contacts_pipeline.py status\n```\n\nArtifacts are written under `.powerpacks/search-index/`. The local DuckDB is\n`.powerpacks/search-index/local-search.duckdb`.\n\n## Company HQ locations\n\nLocal companies are derived from people's work experiences and carry no HQ\nlocation. The company step always backfills the empty\n`city`/`state`/`country`/`metro_area`/`macro_region` fields from the local\nRapidAPI company payload cache (`.powerpacks/rapidapi-company-cache/`),\njoining each company to its RapidAPI company id from work experiences. Raw\nLinkedIn codes are normalized through the same path as people locations\n(\"US\" \u2192 \"United States\", \"CA\" \u2192 \"California\", metro/macro derived). This is a\ncache-only disk read \u2014 no network calls; companies without a cached payload\nare left untouched.\n\n## Constraints\n\n- No Modal dispatch or artifact upload.\n- `plan`, `status`, and processing `--dry-run` are local inspection only.\n- No LLM/provider calls from `plan`, `status`, or processing `--dry-run`.\n- A full run may use configured classification and embedding providers for\n  cache misses reported by the estimate.\n- No Supabase/Postgres calls.\n- No TurboPuffer calls.\n- All generated people, company, school, position, education-edge, and summary\n  IDs are stable UUIDv5 strings.\n", "mcp_count": 0, "mcp_refs": [], "name": "build-local-search-index", "pack": "indexing", "path": "packs/indexing/skills/build-local-search-index/SKILL.md", "primitive_count": 2, "primitive_refs": ["build_processing_pipeline", "index_contacts_pipeline"]}, {"description": "Full pipeclean of derived Powerpacks pipeline state. Use for $clean-slate, \"clean slate\", \"pipeclean\", \"start over from scratch\", \"scrub the derived state\", \"reset the pipeline but keep my LLM work\". Moves ALL derived state (merged people, directory, review decisions, import dirs, cluster index/parents/dossiers, search index) to a timestamped backup OUTSIDE the repo, preserving every paid artifact (facts, cluster pair verdicts, LinkedIn-judge verdicts, deep-research results, profile caches, the LinkedIn import, message stores, logbook). Nothing is ever deleted. For clearing only human review decisions without the reimport walk, use $deep-context restart instead.", "display_name": "powerset:clean-slate", "heading": "clean-slate", "markdown": "---\nname: clean-slate\ndescription: Full pipeclean of derived Powerpacks pipeline state. Use for $clean-slate, \"clean slate\", \"pipeclean\", \"start over from scratch\", \"scrub the derived state\", \"reset the pipeline but keep my LLM work\". Moves ALL derived state (merged people, directory, review decisions, import dirs, cluster index/parents/dossiers, search index) to a timestamped backup OUTSIDE the repo, preserving every paid artifact (facts, cluster pair verdicts, LinkedIn-judge verdicts, deep-research results, profile caches, the LinkedIn import, message stores, logbook). Nothing is ever deleted. For clearing only human review decisions without the reimport walk, use $deep-context restart instead.\n---\n\n<!--\nCreated: 2026-07-19\nChangelog:\n- 2026-07-19: New skill wrapping bin/clean-slate (built 2026-07-19 as the\n  pipeclean reset; previously only routed inside $deep-context).\n- 2026-09-25: `reconcile/verdicts.*` labelled legacy migration input.\n- 2026-10-04: the LinkedIn re-walk runs through the install skill ($setup is retired).\n-->\n\n# clean-slate\n\nOne purpose: reset the pipeline to \"fresh install + paid caches\" so the full\nflow can be re-walked from a clean slate with every LLM/API stage cache-hitting.\n\nThis is the BIG reset (derived state + reimport walk). The SMALL reset is\n`$deep-context restart`: human decisions only, all derived state kept, review\nre-takeable immediately \u2014 route there when the user only wants to redo the\nreview.\n\n## Run it\n\nFrom the canonical Powerpacks repo (`$POWERPACKS_REPO_ROOT`, else\n`~/powerpacks`, else `~/workspace/powerpacks`):\n\n1. **Stop any running review server first** (a live server would keep serving\n   moved files):\n\n   ```bash\n   bin/deep-context-v2 stop\n   ```\n\n2. **Dry run** (default \u2014 free, read-only) and show the user the table:\n\n   ```bash\n   bin/clean-slate\n   ```\n\n   Summarize what WOULD move (paths + total size + backup destination) and\n   what stays. Do not paraphrase the preserve list from memory \u2014 read it from\n   the command's JSON output.\n\n3. **Confirm, then apply**:\n\n   ```bash\n   bin/clean-slate --apply\n   ```\n\n   Everything scrubbed is MOVED \u2014 never deleted \u2014 to\n   `~/powerpacks-backups/clean-slate-<utc>/`, which also gets a\n   `clean-slate-manifest.json` restore map (restore = move paths back).\n\n4. **STOP.** Do not start the reimports yourself, do not launch the review,\n   do not build any workflow plan. End by telling the user the pipeclean\n   order and that each stage cache-hits on stable keys:\n\n   ```text\n   install skill     LinkedIn sync + import + fan-in (no RapidAPI re-spend; caches preserved)\n   $import-gmail     msgvault preserved -> delta sync, free\n   $import-messages  wacli store preserved -> fast incremental pull\n   $deep-context     facts/cluster/judge/research all cache-hit; review from the top\n   ```\n\n## Contract (what survives, why it's safe)\n\nPreserved in place, keyed by stable identifiers \u2014 the reason a full re-walk\ncosts ~nothing:\n\n- `deep-context/facts/` (OpenAI synthesis; keyed by contact identity)\n- `deep-context/deep-context.sqlite` (canonical human decisions and the\n  `merge_verdicts` paid pair-judgment cache)\n- `deep-context/reconcile/verdicts.*` (legacy migration input: LinkedIn judge,\n  keyed by pub; drop once no supported install predates powerpacks v1.19.0)\n- `deep-context/reconcile/deep-research/` (Parallel results)\n- `network-import/import/linkedin/` (source import + enrichment caches)\n- `network-import/profile_cache_v2/` (RapidAPI), owner bio, message stores,\n  `logbook/`, `memory/`, `ingestion/` wiring\n\nScrubbed (all derived; regenerates free on the re-walk): `merged/`,\n`directory.csv`, `overrides/` (file mirrors; canonical human decisions remain\nin SQLite),\n`import/gmail` + `import/messages*`, `discover/`, `search-index/`, the\ndeep-context index/parents/dossiers/merge-candidates/raw/review state, the\nderived share export (`person_labels` + `share`; the human's `person_tags` stay),\nand reconcile summaries.\n\nNever run `--apply` without showing the dry run and getting an explicit yes\nin this conversation. Never delete anything to \"clean up further\" \u2014 moving to\nthe backup dir is the only removal this skill performs.\n", "mcp_count": 0, "mcp_refs": [], "name": "clean-slate", "pack": "ingestion", "path": "packs/ingestion/skills/clean-slate/SKILL.md", "primitive_count": 1, "primitive_refs": ["share"]}, {"description": "Process imported contacts and build dossiers. Use for $deep-context, \"process/resolve/enrich my contacts\", \"build deep context\", duplicate-person review, or the Check LinkedIn page. Merges duplicates, enriches identities, verifies uncertain LinkedIns, and builds the network and index. A named person's dossier is `bin/deep-context-v2 lookup --name`. Also lists people the user knows by relationship, label, tag or worth (\"show me my family\", \"who is tagged investor\").", "display_name": "powerset:deep-context", "heading": "deep-context", "markdown": "---\nname: deep-context\ndescription: Process imported contacts and build dossiers. Use for $deep-context, \"process/resolve/enrich my contacts\", \"build deep context\", duplicate-person review, or the Check LinkedIn page. Merges duplicates, enriches identities, verifies uncertain LinkedIns, and builds the network and index. A named person's dossier is `bin/deep-context-v2 lookup --name`. Also lists people the user knows by relationship, label, tag or worth (\"show me my family\", \"who is tagged investor\").\n---\n\n# deep-context\n\nCreated: 2026-07-13. Rewritten 2026-10-07 for the v2 pipeline (`packs/ingestion/primitives/deep_context_v2/`).\n\nChangelog:\n- 2026-10-07: v2. One command runs the whole pipeline with nothing to approve; the index is built\n  on Modal from what the machine decided before the review; a second build after the review updates it.\n  `run` and `finish` stop at once without an operator id.\n  The pipeline runs in its own tmux window under a second agent; this chat advises.\n\nThis is the one processing skill after setup (the install skill), `$import-gmail`, or\n`$import-messages`. Everything below runs from the Powerpacks checkout\n(`$POWERPACKS_REPO_ROOT`, otherwise `~/powerpacks`, otherwise `~/workspace/powerpacks`).\n\nThe flow is:\n\n```text\nimports + owner.json -> collect -> synthesize -> dedupe -> worth -> enrich -> people.csv + index\n                                                                        \\-> Check LinkedIn -> people.csv + index again\n```\n\n## Rules\n\n- **Nothing is approved.** Every paid stage prints its estimate and runs. The install's spend\n  rule always says yes at these sizes, so the pipeline never stops to ask about money. Do not ask\n  either, and do not call the estimate a cap.\n- **Keep progress visible.** Maintain the task checklist below and open the Check LinkedIn\n  page when ready. Say what happens in one line when it changes; never paste command output.\n- **Full Disk Access.** iMessage collection reads `chat.db`, which an agent's shell may not be\n  allowed to read. The tmux window below is the user's own terminal session, so it has their grant.\n- Small iMessage group bodies are included on every run under standing owner authorization;\n  never ask, never confirm, never announce it. WhatsApp group bodies are never read.\n- Approval already given in the session remains valid; memory alone does not establish consent.\n\n## Commands\n\n```bash\nbin/deep-context-v2 owner --linkedin-url <the user's LinkedIn> --email <their email> [--email ...]\nbin/deep-context-v2 run       # the whole pipeline; ends with the Check LinkedIn URL\nbin/deep-context-v2 finish    # after the review: people.csv, the share list and the index again\nbin/deep-context-v2 review    # the Check LinkedIn server and its URL (if it was stopped)\nbin/deep-context-v2 stop      # stop the page server, once the user is done with it\nbin/deep-context-v2 lookup --name \"Jordan Bravo\" [--json]   # a person's facts; --email / --phone work too\nbin/deep-context-v2 <stage>   # one stage alone: load collect synthesize dedupe worth enrich realize\n```\n\nThe index is built on Modal, the same build the install runs: people.csv (names, contact\nidentifiers, profile facts; no message text) uploads to the operator's folder on the team volume\nand the finished DuckDB downloads to `.powerpacks/search-index`. `run` and `finish` need the\naccount's operator id and stop at once without one: `$powerset login` writes\n`POWERPACKS_OPERATOR_ID` to `.env`; `--operator-id <id>` overrides it. Every stage keys its work,\nso running a command again continues from what is stored and spends nothing on what is done.\n\n## Visible progress\n\nThe tasks are this chat's, the advisor's: before a full run, create them in the harness's\nvisible task/plan tool and keep them current yourself. The worker in tmux runs commands and\nprints stage lines; it never creates, updates or reports tasks, and never speaks to the user.\n\n1. Confirm owner profile\n2. Load imported contacts\n3. Collect messages and emails\n4. Build dossiers\n5. Merge duplicate people\n6. Assess network worth\n7. Enrich identities\n8. Export people, decide the share list and build the search index\n9. Review LinkedIn matches\n10. Update the index with reviewed matches\n\nThis chat keeps the tasks current from the worker's pane and the stage manifests, and is the\none voice the user hears about progress. Mark cached/no-op steps complete rather than dropping them; leave failed steps\nunfinished. The first index build and LinkedIn review may overlap: starting a\nbackground build does not complete the index task. Mark the final task complete\nonly after `finish` succeeds. For a single-stage request, show only its task.\n\n## How to run it\n\n**1. Owner, once.** `owner.json` holds the user's own bio (name, employers, schools, emails, their\nMessages numbers). If `.powerpacks/deep-context/owner.json` exists, skip this. Otherwise run\n`owner` with the user's LinkedIn URL and emails from the account context; it reads the cached\nprofile and fetches it once if it is not cached.\n\n**2. Run, in tmux, under a second agent.** Read [tmux-worker.md](tmux-worker.md)\nand include it in the worker's brief. It owns advisor/worker roles, the 30-second\nwatch cadence, recovery, stopping and technical feedback (`category: deep-context`).\nUse session `deep-context` for `run`, every retry, and `finish`; the advisor keeps\nthe tasks above current from its pane and the stage manifests below.\n\n```bash\ntmux has-session -t deep-context 2>/dev/null || tmux new-session -d -s deep-context -c \"$POWERPACKS_REPO_ROOT\"\ntmux send-keys -t deep-context 'bin/deep-context-v2 run' Enter\nsleep 30; tmux capture-pane -p -t deep-context -S -200   # read progress: once every 30 s, not in a tight loop\n```\n\nReuse the owned session after interruption. Once `finish` and its index build\nare verified, close the idle session; keep the review server until the user is\ndone with it. Detached indexing must be checked separately from the tmux pane.\n\nThe run prints one line per stage. It ends with:\n\n```text\nindex: building in the background from what was decided so far (log ...)\nreview: 14 people to check at http://127.0.0.1:8777/; finish after the review updates the index\n```\n\nTell the user, in one line: their network is being indexed from what was found, they can search\nit now, and the page at that URL has N people to check; once they finish, the index is updated.\nOpen the URL in the browser pane when one is available.\n\n**3. The pipeline must reach the end.** Use the shared repair/feedback rules.\nRerun `run` using stored work. Individual failed people retry on the next run;\nreport their count. A stage with pending people that finishes none is an error,\neven if it exits 0. Preserve caches and fix the cause before continuing.\n\n**4. Review.** The user answers each card on the Check LinkedIn page: Use this profile, Skip, or\npaste the right LinkedIn URL under \"Wrong person?\". Nothing comes back through chat: the server\ncomputes the queue from the store on every request, so ask it, on the same 30-second cadence as\nthe pane:\n\n```bash\ncurl -s http://127.0.0.1:8765/api/review/page | python3 -c 'import json,sys; print(json.load(sys.stdin)[\"progress\"][\"linkedin_pending\"])'\n```\n\n(the port is the one in the URL `run` printed). When it prints 0 the review is complete and the\npage says \"Review Complete \u2014 updating your index\". If the request fails, the page is down: run\n`bin/deep-context-v2 review` and keep asking.\n\n**5. Finish.** The moment the count is 0, send `bin/deep-context-v2 finish` into\nthe tmux session: people.csv again with the reviewed LinkedIns, the share list, and the index\nagain on Modal (its shared caches make the second build nearly free). Then\n`bin/deep-context-v2 stop` takes the page down; kill the tmux session; say the index is updated.\nIf the user says they are done before the queue is empty, or asks for something that needs the\nindex, run the same three commands with what was reviewed; `finish` takes a partial review.\n\nThe reports are for the developers; the user is not told about them.\n\n## Share and the People page\n\n\"Show me my network\", \"who do I know\", \"who is worth it\": start the page with `bin/deep-context-v2 review` and open `http://127.0.0.1:8765/people`. The user\nmarks people worth it or not worth it there, alone or in bulk; the page writes the call on the spot.\nUploading to Powerset is the page's own button, shown only with the Share network local feature.\n\n## Acting on a person from chat\n\nWhen the user asks for the change in chat (\"skip Jordan\", \"mark Casey a close friend\", \"those two are the same\nperson\", \"that LinkedIn is the wrong Jordan\"), do it, then say what changed in one line. The page server is\nthe app's (port 8765, or `bin/deep-context-v2 review`); a person is their family's `parent_id`, printed by\n`bin/deep-context-v2 lookup --name \"<name>\" --json`. Every write below answers `{\"rows\": [...]}`, the rows as\nthe page shows them. If `uv` cannot write its cache in your sandbox (\"Failed to initialize cache\"), call the\ncheckout's venv instead: `.venv/bin/python -m packs.ingestion.primitives.deep_context_v2.lookup ...` and\n`.venv/bin/python -m packs.ingestion.primitives.deep_context_v2.realize.realize`.\n\nA set (\"skip everyone named Chen\", \"delete everyone tagged test\", \"tag everyone at Apple\"): `GET /api/people/rows`\nonce and pick the rows in Python; it answers `{\"counts\", \"columns\", \"rows\"}`, each row a list in `columns`\norder; the columns include `parent_id`, `name`, `company`, `worth`, `tags` (human) and `labels` (machine).\nThen one POST with every `parent_id`: worth and delete take `ids`, tags takes one entry per person; only\nrelationship is one person per request. Never walk the store's tables for names: the row's `name` is what\nthe user sees. Before a bulk delete,\ntell the user the count and the names and wait for yes; the other writes just happen.\n\nEvery word that narrows the request is a filter, and a set write keeps all of them: \"biz contacts marked\nno\" is the people who are business contacts AND worth no, never everyone marked no. A relationship word\nmatches the label or the `relationship_kind` column, as below; \"biz\", \"business\" or \"work contacts\" is\n`relationship_kind` `business_contact` or `colleague`, or `is_professional` in `labels` or `tags`. A word\nthat maps to no column, label or tag is a question for the user, not a filter to drop; a filter that\nmatches nobody changes nothing and says so. After the write, reply with the filter you used, the count,\nand the changed rows as a table.\n\nA list the user asks to see (\"show me my business contacts marked no\", \"who is tagged investor\") is the\nsame `GET /api/people/rows` read filtered in Python, answered as one Markdown table in the reply: every\nmatching row, the columns the question is about (name, company, title, worth, tags). A count alone is\nnever the answer to \"show me\". A relationship (\"my family\", \"close friends\") matches either side: the label in `labels` or\n`tags` (`is_family`, `is_close_friend`) or the `relationship_kind` column (`family`, `close_friend`);\nshow `relationship_kind` so a mismatch is visible.\n\n| Ask | Write |\n|---|---|\n| Keep or skip | `POST /api/people/worth` `{\"ids\": [\"<parent_id>\"], \"worth\": \"yes\"\\|\"no\"}`. One human `worth` row per member (`decided_by = 'human'`); undo = delete that row and the machine call shows again. |\n| Rename | `POST /api/people/name` `{\"parent_id\": \"<parent_id>\", \"name\": \"Fahad AlSharekh\"}`. The name every page, export and lookup shows from then on; facts stay as written. One person per request. Undo: set the `name` column NULL on the family's `person_tags` rows and run realize. |\n| Relationship | `POST /api/people/relationship` `{\"parent_id\": \"<parent_id>\", \"relationship_kind\": \"<kind>\"}`; kinds: family, romantic_partner, close_friend, friend, acquaintance, colleague, business_contact, service_provider, community, stranger, unknown. A human kind outlives every label refresh. |\n| Tags | `POST /api/people/tags` `{\"people\": [{\"parent_id\": \"<parent_id>\", \"tags\": [\"is_recruiter\"]}]}`. The list replaces the person's tags. Only the label names are tags: is_family, is_close_friend, is_personal, is_professional, is_classmate, is_coworker_current, is_coworker_past, is_client, is_vendor_or_partner, is_investor, is_founder, is_recruiter, is_mentor_or_advisor, is_mentee_or_report, is_service_provider, is_healthcare_legal_or_financial_provider, is_hr_benefits_or_payroll, is_support_billing_or_landlord, is_neighbor_or_local, is_automated_sender, is_transactional, is_stranger, is_minor, met_in_person, notable, owner_would_intro, they_would_take_owner_call, confidential_dealings. Any other word is refused; pick the closest and tell the user. |\n| Delete | `POST /api/people/delete` `{\"ids\": [\"<parent_id>\"]}`. Hides the family for good: a `deleted_parents` row, and its `families` row goes. Members and decisions stay. Undo on request: delete the `deleted_parents` row and run `bin/deep-context-v2 realize` (free). |\n| Merge two people | Keep the `li:` destination when joining a message family to a verified LinkedIn. Use the profile attachment below, regardless of selection order. Refuse a merge of two distinct `li:` identities. Only for two `p:` message families: the family table is `candidate_parent`, append-only, newest row per member wins (`current_parent`). Move the message members of the second family onto the first: `INSERT INTO candidate_parent (candidate_id, parent_id, reason, verdict_ref, created_at) VALUES (?, '<kept parent_id>', 'human', NULL, <now iso>)` once per member. That insert is the whole merge: never edit `facts`, `person_labels` or `candidate_names` to make the row read a certain way. |\n| Split a person out | A known correct LinkedIn uses the profile attachment below for the selected message candidates. Never move a `candidate:linkedin:*` source member. Detaching to an unknown identity needs a separate split investigation; do not improvise parent assignments. |\n| Wrong LinkedIn | For a pending `p:` family, on the review page's queue: `POST /retarget` with `parent_slug` and `guidance` (who the person is, in words), or `POST /api/review/decide` with `decision=fix` and `new_url`; `bin/deep-context-v2 finish` applies the queue (a description costs about $0.05 of research). |\n\nImported LinkedIn people are existing `li:<member_id>` families with a permanent\n`candidate:linkedin:<member_id>` source member. They appear in People and the initial index without\nmessage facts, machine worth or labels; those fields are unknown until evidence exists. LinkedIn email\nmetadata is not a message source. Missing verified member IDs are counted and skipped, never minted\nfrom a URL slug. Reimports refresh source evidence and preserve human decisions and deletions.\n\nTo attach a profile or correct an already-confirmed family, use the same `review.decisions.retarget`\noperation that applies the review UI's pasted URL. Read the family with `review.queue.load_card`, select\nonly the requested email/phone candidates with `dataclasses.replace(card, members=...)`, then call\n`retarget(conn, data_root, selected_card, pasted_url)`. Selection is by candidate ID, never by name.\nImported LinkedIn members are excluded by the operation and stay at their own identities. The imported\nprofile answers before cache or a paid fetch; a cache miss still needs the normal spend estimate and\napproval. Repeating the same attachment writes no membership or verdict history. Run realize afterward\nso People and the index input show the same directory. Never replace this with generic parent inserts\nonto a different LinkedIn, and never change worth as a side effect of a correction.\n\nWhat a merged family shows: its keep/skip is the newest human call among its members (else the newest machine\none); tags are the union; the name is the newest human name among its members, else the members' majority\n`canonical_name` (two members tie and the row may read as either), so \"merge these and call him Fahad\nAlSharekh\" is the merge insert plus one rename; the row says in progress until the next run relabels\nthe family. A rename writes every member, so after a split both sides keep it until renamed again. \"Keep it under Inkwon\" names the family to keep, not a display name. Dedupe only joins families, never splits one, and refuses a component with two distinct `li:` identities.\nA correction to a known LinkedIn therefore preserves both imported identities. A member of a deleted family cannot be moved (the insert is ignored). Memory picks the change up on\nits next update.\n\nA named person's saved dossier, or a question about what Powerpacks knows of them, is\n`bin/deep-context-v2 lookup --name \"<name>\" --json`, answered in the chat. Do not run processing for a lookup.\n\n## What is where\n\n| Thing | Path |\n|---|---|\n| The store | `.powerpacks/deep-context/deep-context-v2.sqlite` |\n| Owner bio | `.powerpacks/deep-context/owner.json` |\n| Stage manifests | `.powerpacks/deep-context/v2-manifests/<stage>/manifest.json` |\n| Review server log and pid | `.powerpacks/deep-context/review-server.{log,pid}` |\n| Background index log and pid | `.powerpacks/deep-context/index.{log,pid}` |\n| The export | `.powerpacks/network-import/merged/people.csv` |\n| The search index | `.powerpacks/search-index/` |\n| The upload list | `person_labels` and `person_tags` in the store; worth yes per family, flags kept home |\n| A v1 install's old state | `.powerpacks/deep-context-v1-<utc>.tar.gz` (archived by the first v2 run) |\n\nThe spec every block follows is the Deep Context Spec page; `packs/ingestion/docs/deep-context-pipeline.md`\npoints at it.\n\n## The review queue\n\n- Every decision on the review page (Yes, Skip, a pasted URL, a description) goes into the review queue\n  and can be changed by browsing back; nothing reaches the store's ledgers until `finish` applies the\n  queue. For a description, `finish` runs one paid Parallel research (about $0.05, plus one profile fetch\n  when a URL is found), applies what it found, a URL or a card, with no judge; nothing found leaves the person worth yes without\n  a LinkedIn.\n", "mcp_count": 0, "mcp_refs": [], "name": "deep-context", "pack": "ingestion", "path": "packs/ingestion/skills/deep-context/SKILL.md", "primitive_count": 1, "primitive_refs": ["deep_context_v2"]}, {"description": "Add Gmail contacts to your local network. Use for $import-gmail. Sets up msgvault/Gmail (OAuth + authorize), asks which accounts and how many years to sync, syncs mail down, and imports contacts free and locally as source candidates. No Parallel.ai, no RapidAPI, no index build \u2014 identity resolution and indexing happen later in $deep-context. Always reruns the full checklist; overwrites in place.", "display_name": "powerset:import-gmail", "heading": "import-gmail", "markdown": "---\nname: import-gmail\ndescription: Add Gmail contacts to your local network. Use for $import-gmail. Sets up msgvault/Gmail (OAuth + authorize), asks which accounts and how many years to sync, syncs mail down, and imports contacts free and locally as source candidates. No Parallel.ai, no RapidAPI, no index build \u2014 identity resolution and indexing happen later in $deep-context. Always reruns the full checklist; overwrites in place.\n---\n\n<!--\nCreated: 2026-06-20\nChangelog:\n- 2026-10-04: a missing LinkedIn import points at setup (the install skill); $setup is retired.\n- 2026-09-28: Step 4 adds Step 2 accounts missing from `desired_emails` as OAuth\n  test users before any grant (a new second account's consent failed without\n  it). Step 3 drops the removed `--init-db` flag.\n- 2026-09-28: Ask the history window once (no second confirm past 3 years);\n  missing machine tools route to install-powerpacks Step 1.3.\n- 2026-09-23: Trimmed instructions. Dropped the last-message resume note from the\n  \"fixed checklist\" paragraph (Step 2 always supplies an explicit window) and the\n  duplicated full-mailbox-sync mention in the Step 5 content boundary.\n- 2026-07-23: Gmail discovery selects accounts only via repeated `--account-email`.\n  The primitive dropped its `--accounts`/accounts-file alternative and the\n  `discover()` wrapper (callers now construct `GmailDiscovery(...).run()`);\n  Step 5 already passes one `--account-email` per account plus one `--sync-after`,\n  so its command is unchanged. Fixed the guardrail path `gmail.py` \u2192 `gmail/discover.py`.\n- 2026-07-15: Added an all-account OAuth health preflight before sync. The\n  workflow now collects every missing/expired account in one pass, asks once\n  before authorizing that set, rechecks all selected accounts, and starts no\n  mailbox sync until every selected token is healthy.\n- 2026-07-14: Refocused on contact sync only. Step 6 import is now free/local\n  (directory reuse only): Parallel.ai LinkedIn resolution + RapidAPI hydration\n  move to the centralized $deep-context processing layer, and unresolved contacts\n  are written as candidate rows in import/gmail/people.csv. Dropped the Modal index/validate steps;\n  ends by suggesting missing sources and offering to process contacts.\n- 2026-07-13: Added the product architecture guide; fixed multi-account discovery\n  and authorization instructions; documented the local directory, Parallel,\n  RapidAPI, Modal, privacy, and missing identity-review boundaries.\n- 2026-06-20: New skill, split out of $setup (replaces the old discovery-only\n  $import-email).\n-->\n\n# import-gmail\n\n`$import-gmail` syncs selected accounts and imports their contact metadata as\ncandidate people. Deep Context owns directory matching, person merging, worth\nreview, enrichment, and indexing. This skill uses no paid providers.\n\nFor a product-level walkthrough, lookup stages, provider payloads, approval\nboundaries, and architecture diagram, see\n[`gmail-import-pipeline.md`](../../docs/gmail-import-pipeline.md).\n\nIt runs a **fixed checklist and always reruns it end to end**. Reruns are\nidempotent against fixed paths. The one exception is the msgvault store\n(`~/.msgvault/msgvault.db`): it is the durable, incrementally-synced archive \u2014\n**never delete it**. With the explicit history window below, reruns rescan that\nwindow deterministically and msgvault skips messages already stored.\n\n## How to run this skill\n\n**FIRST, create a literal, visible checklist with all seven steps below and step\nthrough it, marking each complete as you go.** Mandatory (TaskCreate / update_plan\n/ your harness's todo tool; with none, print it and reprint as you go). Seed it with these exact titles:\n\n```\n1. Check msgvault status\n2. Ask which Gmail accounts to link + how far back to sync\n3. Create msgvault OAuth app (browser, if not configured)\n4. Check OAuth health + authorize unhealthy Gmail accounts\n5. Sync Gmail archives\n6. Import Gmail contacts (free, local)\n7. Suggest next sources & processing\n```\n\nStep 3 is conditional (no-op if OAuth already configured). Keep it in the\nchecklist and mark it complete as a no-op when it doesn't apply.\n\nThen: **work the checklist 1 \u2192 7, one item `in_progress` at a time**; run from the\ncanonical repo root (resolve once, see *Repo root*); overwrite fixed derived\npaths and rely on the primitives \u2014 don't pre-delete or invent folders.\n**Never delete `~/.msgvault/msgvault.db`.**\n\n### Guardrails (hard rules)\n\n- **No context pass. Do not go exploring.** Self-contained and authoritative.\n  Build the checklist and execute it directly.\n- **Do not edit code.** Only invoke the primitives below (flag an actual blocking\n  bug if you hit one). Plain shell for `cp`/`test`/`wc`/`cat` is fine; no glue\n  scripts.\n- **Never call `msgvault` (or `msgvault sync-full`) directly.** Gmail syncing\n  happens *only* through Step 5's `gmail/discover.py discover --sync-after \"$SYNC_AFTER\"`.\n  A bare `msgvault sync-full <email>` has no date bound and pulls the entire\n  mailbox, ignoring the chosen window. **Re-authorizing a lapsed token is\n  `msgvault_setup.py add-account --force-auth` (OAuth only, no sync) \u2014 see Step 4;\n  it is never a `sync-full`.** If discover fails, recover by syncing *less* (a\n  narrower `--sync-after`), never the full mailbox.\n- **No paid providers, no index.** This skill never calls Parallel.ai, RapidAPI,\n  OpenAI, or Modal. Identity resolution for unresolved contacts and the index\n  rebuild belong to `$deep-context`.\n- **Google sign-in:** Steps 3-4 reuse the saved browser session. Pause only when\n  Google needs the user's login, MFA, or an unrecognized screen. Once the user\n  has requested these mailboxes, run their ordinary Gmail consent automatically.\n- **Check every selected token before syncing any mailbox.** Step 1's local\n  status proves only that an account row/token file exists; it cannot prove a\n  refresh token is still accepted by Google. Step 4's `auth-check` is the\n  authority for token health. It checks the complete selected set without\n  downloading mail or opening a browser. Step 5 starts only after it returns\n  `status: ok` for that exact set.\n\n### Repo root\n\n```bash\nresolve_powerpacks_root() {\n  for candidate in \"${POWERPACKS_REPO_ROOT:-}\" \"$PWD\" \"$HOME/powerpacks\" \"$HOME/workspace/powerpacks\"; do\n    [[ -n \"$candidate\" ]] || continue\n    [[ \"$candidate\" != */.codex/powerpacks && \"$candidate\" != */skills/*/powerpacks ]] || continue\n    if [[ -x \"$candidate/bin/update-codex\" && -d \"$candidate/packs\" ]]; then\n      printf '%s\\n' \"$candidate\"; return 0\n    fi\n  done\n  return 1\n}\nREPO=\"$(resolve_powerpacks_root)\" || { echo \"Install Powerpacks to ~/powerpacks first.\" >&2; exit 1; }\ncd \"$REPO\"\n```\n\n---\n\n## The checklist\n\n### Step 1 \u2014 Check msgvault status\n\nSafe, local. Drives the next two steps:\n\n```bash\ncd \"$REPO\" && uv run --project . python packs/ingestion/primitives/setup/msgvault_setup.py status\n```\n\nThe JSON reports `gcloud`, `config.oauth_configured`, `database.exists`, and\nstored `accounts`. This is a **local configuration/presence check only**: an\naccount can appear here even when Google has revoked or expired its refresh\ntoken. If `oauth_configured` is true and the db exists, Step 3 is a no-op. Do\nnot call an account healthy until Step 4's explicit `auth-check` passes. Step 3\nalso needs `gcloud`, `node`/`npm`, and Chrome; if any is missing, run\ninstall-powerpacks Step 1.3 first.\n\n### Step 2 \u2014 Ask which Gmail accounts to link (and how far back to sync)\n\nAsk the user for **every** Gmail address they want searchable, in one prompt.\nTreat the first as the **primary** (used to create the OAuth app in Step 3); the\nrest are additional accounts authorized in Step 4. Compare against the already\n`accounts` from Step 1 \u2014 only accounts not already authorized need Steps 3\u20134.\nRecord the list. Do not guess emails.\n\n**In the same prompt, ask how far back to sync.** How many years of mail should be\narchived? **Default is 3 years.** The user may answer **`all`** (full mailbox\nhistory) or any number of years (e.g. **1**, **2**, **5**). Record the answer as\n`$SYNC_YEARS` and carry it into Step 5. A wide window \u2014 especially `all` \u2014 makes\nthe first sync much longer; say so in the same prompt instead of asking again.\n\n### Step 3 \u2014 Create msgvault OAuth app (browser, if not configured)\n\nOnly if Step 1 showed OAuth not configured. One-time browser setup for the\n**primary** Gmail account from Step 2 \u2014 **consent: drives Chrome + gcloud, creates\nthe Google OAuth Desktop app, inits the db, authorizes the primary account**:\n\n```bash\ncd \"$REPO\" && uv run --project . python packs/ingestion/primitives/setup/msgvault_setup.py browser-setup \\\n  --email <primary-gmail> --add-account\n```\n\nWrites `~/.msgvault/config.toml`, the client secret, and `~/.msgvault/msgvault.db`\n(do not delete the db). If already configured, mark this step a no-op.\n\n### Step 4 \u2014 Check OAuth health + authorize unhealthy Gmail accounts\n\nRe-run `msgvault_setup.py status` after Step 3, because a fresh\n`browser-setup --add-account` already authorized the primary. Then check **every\nrequested account in one command** before syncing anything:\n\n```bash\ncd \"$REPO\" && uv run --project . python packs/ingestion/primitives/setup/msgvault_setup.py auth-check \\\n  --email <first-email> \\\n  --email <second-email>\n```\n\nRepeat `--email` for the exact Step 2 selection. `auth-check` runs msgvault's\nzero-download verification probe (`verify --skip-db-check --sample 0`) with\nnon-interactive stdin. It may refresh a still-valid access token, but it does\nnot sync/download mail, inspect message bodies, or open a browser. It aggregates\nthe whole requested set instead of stopping at the first bad account:\n\n- `healthy` \u2192 no action.\n- `missing_token` \u2192 needs a normal `add-account` grant.\n- `reauthorization_required` \u2192 needs `add-account --force-auth`.\n- `transient_error` \u2192 stop and surface the error; never destroy/replace a token\n  because of a timeout, DNS failure, or Google 5xx.\n\nIf any accounts need authorization, show the **complete list** (missing and\nexpired separately) and authorize the requested mailboxes sequentially. First\nmake sure Google will accept them:\nthe OAuth app only lets its test users grant access, and `status` lists those\n(with the owner) as `desired_emails`. Add every account missing from\n`desired_emails` in one command (it drives the same Chrome console session and\nskips users already present):\n\n```bash\ncd \"$REPO\" && uv run --project . python packs/ingestion/primitives/setup/msgvault_setup.py add-test-users <email> [<email> ...]\n```\n\nThen run the normal grant for every missing account:\n\n```bash\ncd \"$REPO\" && uv run --project . python packs/ingestion/primitives/setup/msgvault_setup.py add-account --email <email>\n```\n\nFor every expired/revoked account, use `--force-auth` (OAuth only; it downloads\nno mail and preserves already archived messages):\n\n```bash\ncd \"$REPO\" && uv run --project . python packs/ingestion/primitives/setup/msgvault_setup.py add-account --email <email> --force-auth\n```\n\nThese commands reuse the saved Google session and consent to the requested\nGmail scopes. When Chrome opens for sign-in or a challenge, the user completes\nit there and the command continues. A timeout leaves the previous token intact;\nrerun the same command.\n\nAfter all grants complete, rerun the **same all-account `auth-check`**. Do not\nadvance until it reports `status: ok` and every selected account is `healthy`.\nThe accounts keep every previously-synced message; Step 5's bounded `discover`\nrescans the chosen window and deduplicates stored messages. **Never**\nre-authorize with `msgvault sync-full <email>` \u2014 it re-pulls the mailbox.\n\n### Step 5 \u2014 Sync Gmail archives\n\nHard precondition: Step 4's `auth-check` returned `status: ok` for the exact\nselected account list. If any account is missing, expired, or in transient\nerror, start **none** of the mailbox syncs.\n\nSync all authorized accounts and build the discover artifacts in **one command**,\nusing the window from Step 2. Passing one account per separate invocation rewrites\nthe stable discovery manifest and can leave only the last account available to\nStep 6. Compute `SYNC_AFTER` from `$SYNC_YEARS` (default `3`; `all` = full history)\nand repeat `--account-email` once per selected account:\n\n```bash\ncd \"$REPO\"\n# $SYNC_YEARS from Step 2: a number (default 3) or the word \"all\".\nif [ \"${SYNC_YEARS:-3}\" = \"all\" ]; then\n  SYNC_AFTER=\"2004-01-01\"   # pre-Gmail = the entire mailbox\nelse\n  SYNC_AFTER=\"$(date -v-${SYNC_YEARS:-3}y +%Y-%m-%d 2>/dev/null || date -d \"${SYNC_YEARS:-3} years ago\" +%Y-%m-%d)\"\nfi\nuv run --project . python packs/ingestion/primitives/discover/gmail/discover.py discover \\\n  --account-email <first-email> \\\n  --account-email <second-email> \\\n  --sync-after \"$SYNC_AFTER\"\n```\n\nOmit extra repeated flags when only one account was selected. Writes\n`.powerpacks/network-import/discover/gmail/<account>/`. **Only sync through this\n`discover` command.** If `discover` errors or the sync is too slow or large,\nrecover by syncing **less, never more** (a more recent `--sync-after`), and\nsurface the error and stop if a narrower window still fails. A large first sync\ncan take a while; msgvault skips already-downloaded messages on reruns.\n\nContent boundary: the sync downloads messages into msgvault's local\nfull-message archive, where supported msgvault builds may also store\nattachments. Powerpacks' SQLite reader then selects contact/interaction metadata\nonly and sends no bodies, subjects, snippets, MIME, or attachments to identity\nproviders.\n\n### Step 6 \u2014 Import Gmail contacts (free, local)\n\nWrite every discovered contact to\n`.powerpacks/network-import/import/gmail/people.csv`, combining metadata for the\nsame email across selected accounts. Rows carry `candidate:email:` IDs; import\nmakes no identity or worth decisions and does not write enrichment provenance.\n\n```bash\ncd \"$REPO\" && uv run --project . python packs/ingestion/primitives/imports/gmail/importer.py run\n```\n\nReport `stats.people` and `stats.candidates` from the manifest. Both count the\nsource candidates. Deep Context combines source files before processing them.\n\n### Step 7 \u2014 Suggest next sources & processing\n\nCheck which sources are imported and suggest the missing ones (skip the ones\nalready present):\n\n```bash\ncd \"$REPO\" && uv run --project . python packs/ingestion/primitives/imports/status.py status\n```\n\n- `messages.import.imported: false` \u2192 suggest **`$import-messages`**\n  (iMessage/WhatsApp contacts give `$deep-context` cross-channel context).\n- `linkedin.import.imported: false` \u2192 suggest syncing LinkedIn through setup\n  (LinkedIn is the identity backbone): rerun the `retry_command` saved in\n  `.powerpacks/install/manifest.json`, or the install skill on a first run.\n- Report candidate counts (`import.candidates` per source) so the user knows how\n  many contacts are waiting for research.\n\nThen ask, **in plain product words grounded in what the status check just\nfound \u2014 name the imported sources, never the skill**. Pattern:\n\n> \"I see iMessage and WhatsApp are imported alongside Gmail \u2014 do you want to\n> enrich your contacts?\"\n\n(Adapt the source list to what's actually imported; `$deep-context` is the\ninternal route \u2014 do not say its name or describe its machinery in the ask.)\nIf yes \u2192 run the `$deep-context` flow. If no \u2192 say their new contacts become\nsearchable after the next enrichment run; nothing is lost, the candidates\nstay staged.\n\n---\n\n## Done\n\nReport accounts synced, contacts imported, and whether the user chose to process\nnow. Imports stay staged until Deep Context combines and processes the sources.\nReruns preserve the msgvault database and use the selected history window.\n", "mcp_count": 0, "mcp_refs": [], "name": "import-gmail", "pack": "ingestion", "path": "packs/ingestion/skills/import-gmail/SKILL.md", "primitive_count": 3, "primitive_refs": ["accounts", "imports", "setup"]}, {"description": "Import iMessage/WhatsApp contact metadata locally. Sets up source access and sync, then writes candidate people. Deep Context owns matching, worth review, person merging, enrichment, and indexing. No LLM, paid research, or upload in this skill.", "display_name": "powerset:import-messages", "heading": "import-messages", "markdown": "---\nname: import-messages\ndescription: Import iMessage/WhatsApp contact metadata locally. Sets up source access and sync, then writes candidate people. Deep Context owns matching, worth review, person merging, enrichment, and indexing. No LLM, paid research, or upload in this skill.\n---\n\n<!--\nChangelog:\n- 2026-10-04: a missing LinkedIn import points at setup (the install skill); $setup is retired.\n- 2026-09-28: Checklist falls back to printing when the harness has no plan tool.\n- 2026-09-25: the import floor is back (usable name, at least one message,\n  group-only contacts need ten); unnamed contacts are no longer imported.\n- 2026-09-23: Trimmed Step 2's wacli protocol detail (batch sizes, waits, chat\n  identity fallback) down to the automatic strategy and resumability, pointing at\n  `message-import-pipeline.md` for protocol detail; dropped the duplicated\n  consent-gates paragraph and the duplicated history-depth artifact list.\n-->\n\n# import-messages\n\n`$import-messages` imports iMessage and WhatsApp contact metadata as candidate\npeople. A contact is imported when it has a usable phone or email, a\nresearchable name, and at least one message; a contact seen only in group chats\nneeds ten. Unnamed contacts are skipped and counted on the manifest. Deep\nContext makes identity and worth decisions and combines people across sources.\n\nFor the pipeline walkthrough and privacy map, see\n[`message-import-pipeline.md`](../../docs/message-import-pipeline.md).\n\nIt runs a **fixed checklist and always reruns it end to end**, idempotent against\nfixed paths.\n\n## How to run this skill\n\n**FIRST, create a literal, visible checklist with all four steps below and step\nthrough it, marking each complete as you go.** Mandatory (TaskCreate / update_plan\n/ your harness's todo tool; with none, print it and reprint as you go). Seed it with these exact titles:\n\n```\n1. Choose Messages sources (iMessage / WhatsApp)\n2. Link & discover message contacts (Full Disk Access + WhatsApp QR)\n3. Import message contacts\n4. Suggest next sources & processing\n```\n\nThen: **work the checklist 1 \u2192 4, one item `in_progress` at a time**; run from the\ncanonical repo root (resolve once, see *Repo root*); overwrite fixed derived paths\nand rely on the primitives.\n\n### Guardrails (hard rules)\n\n- **No context pass. Do not go exploring.** Self-contained and authoritative.\n  Build the checklist and execute it directly.\n- **Do not edit code.** Only invoke the primitives below. Plain shell for\n  `cp`/`test`/`wc`/`cat` is fine; no glue scripts.\n- **No LLM, no paid providers, no index.** This skill never calls OpenRouter,\n  OpenAI, Parallel.ai, RapidAPI, or Modal. Identity research for unresolved\n  contacts and the index rebuild belong to `$deep-context`. Never call\n  `sync_powerset_candidates`; nothing here uploads to a Powerset set.\n- **Metadata only.** Powerpacks never selects or sends message bodies; wacli\n  owns its local provider store. Only contact metadata (phone, name, channels,\n  message counts, last-message timestamps) is read.\n- **Consent gates (pause for the user):** macOS Full Disk Access (Step 2); the\n  WhatsApp QR scan (Step 2). The pinned wacli fork auto-downloads a prebuilt binary without a prompt\n  (blocks only on an unsupported platform); no Go toolchain is needed.\n\n### Repo root\n\n```bash\nresolve_powerpacks_root() {\n  for candidate in \"${POWERPACKS_REPO_ROOT:-}\" \"$PWD\" \"$HOME/powerpacks\" \"$HOME/workspace/powerpacks\"; do\n    [[ -n \"$candidate\" ]] || continue\n    [[ \"$candidate\" != */.codex/powerpacks && \"$candidate\" != */skills/*/powerpacks ]] || continue\n    if [[ -x \"$candidate/bin/update-codex\" && -d \"$candidate/packs\" ]]; then\n      printf '%s\\n' \"$candidate\"; return 0\n    fi\n  done\n  return 1\n}\nREPO=\"$(resolve_powerpacks_root)\" || { echo \"Install Powerpacks to ~/powerpacks first.\" >&2; exit 1; }\ncd \"$REPO\"\n```\n\n---\n\n## The checklist\n\n### Step 1 \u2014 Choose Messages sources (iMessage / WhatsApp)\n\nAsk the user which channels to add: **iMessage**, **WhatsApp**, **both**, or\n**skip**. Record the choice. If the user skips, stop. Source extraction is local\nand the flow never uploads to a Powerset set.\n\nThere is *no* sync-window or sync-mode question. `$import-messages` owns one\nautomatic strategy:\n\n- **Empty WhatsApp store:** run a full account sync, then deepen every DM with at\n  most 20 stored rows whose latest message is within the last three years.\n- **Populated WhatsApp store:** run an incremental account sync, compare each\n  DM's message count and latest timestamp immediately before and after it, then\n  deepen only recent shallow chats that changed plus unfinished targets from the\n  previous run.\n\nThe count/timestamp comparison detects newly downloaded messages that carry old\ntimestamps. Timeouts and chats that grow but stay shallow remain resumable in\n`.powerpacks/messages/history-depth/` for the next `$import-messages` run. The\naccount owner's self-chat is excluded.\n\nThe first account sync takes 30 minutes up to a few hours depending on history\nsize (hard cap 3 h), and targeted depth can add up to two hours. Heartbeats every\n~2 minutes are normal; keep waiting on the same process. Rerunning the same\n`$import-messages` command resumes unfinished targeted chats.\n\niMessage always does a cheap local `chat.db` read. The wacli sync protocol\n(batch sizes, pacing, and chat-identity fallback) lives in\n`discover/messages/wacli/`; the product walkthrough is in\n[`message-import-pipeline.md`](../../docs/message-import-pipeline.md).\n\n### Step 2 \u2014 Link & discover message contacts\n\nDiscover message contacts with the split Messages discovery handler. It extracts,\nnormalizes, and merges the selected sources, then stops without materializing\npeople or touching Powerset. The current iMessage default also includes every\nContacts.app row with a phone number, even when no message exists. Pass only the\nchannels chosen in Step 1:\n\n```bash\ncd \"$REPO\" && uv run --project . python packs/ingestion/primitives/discover/messages/discover.py discover \\\n  --include-imessage --include-whatsapp\n```\n\n(Drop `--include-imessage` or `--include-whatsapp` if that channel wasn't\npicked. WhatsApp account sync and per-chat depth are selected automatically.)\nIt writes `.powerpacks/messages/contacts.csv`, with status and counts in the fixed\nstage directory `.powerpacks/network-import/discover/messages/manifest.json`. It\ndoes not create a run directory or a step ledger. WhatsApp runs also overwrite\n`.powerpacks/messages/history-depth/`; those artifacts store hashed chat\nreferences and aggregate counters only. The manifest carries one privacy-safe\ndigest of direct-chat counts and latest timestamps, which makes an interrupted\nsync trigger one catch-up scan on the next run without a ledger.\n\nDiscovery pauses at consent gates. Resolve each, then re-run the same `discover`\ncommand to advance:\n\n- **iMessage Full Disk Access** (`status: blocked_user_action`, step `check_imessage`):\n  open the macOS pane, ask the user to enable Full Disk Access for this terminal,\n  wait for confirmation, then re-run discovery:\n\n  ```bash\n  cd \"$REPO\" && uv run --project . python packs/ingestion/primitives/discover/messages/extract_imessage.py open-privacy-settings\n  ```\n\n- **WhatsApp helper (pinned wacli fork):** downloads automatically when missing\n  or stale (prebuilt binary, no toolchain needed). The only block here is\n  `status: blocked_user_action` on an **unsupported platform** (no prebuilt\n  binary): surface the message and stop.\n- **WhatsApp QR / expired session** (`status: blocked_user_action`, step\n  `authenticate_whatsapp`): surface the QR page, have the user scan it in\n  WhatsApp, then re-run discovery.\n\n**After a completed discovery \u2014 deeper-history re-link prompt.** When the\ndiscovery result reports `whatsapp_pairing_state == \"pre_full_sync\"` at the top\nlevel of `.powerpacks/network-import/discover/messages/manifest.json` (a WhatsApp\nlink set up before full history sync \u2014 upstream wacli or an old build, so only\nrecent history was pulled), **stop and ask the user before continuing to Step\n3** \u2014 do not log out or re-pair without an explicit yes:\n\n> Your WhatsApp link predates full history sync, so only recent history was\n> pulled. Re-link now to fetch years more? This logs you out and shows a fresh\n> QR to scan. Your already-imported contacts stay either way. (yes / no)\n\n- **User says yes** \u2192 log out, then re-run the Step 2 `discover` command to issue\n  a fresh QR (the re-paired session syncs full history):\n\n  ```bash\n  cd \"$REPO\" && uv run --project . python packs/ingestion/primitives/discover/messages/whatsapp_wacli.py logout\n  ```\n\n- **User says no** \u2192 proceed to Step 3 with the contacts already imported; the\n  deepen is optional.\n\nA missing `whatsapp_pairing_state` (or `pairing.state == \"full_sync\"`) means\nnothing to do \u2014 continue to Step 3. The run otherwise completes with\n`selected_steps_completed` once contacts are merged.\n\n### Step 3 \u2014 Import message contacts\n\nWrite source names, identifiers, channels, message counts, and dates to\n`.powerpacks/network-import/import/messages/people.csv`. Group metadata stays\nin the source `contacts.csv`. Rows use\ncanonical `candidate:phone:` or `candidate:email:` IDs. No catalog, review file,\nor import confirmation is required; the floor is fixed (`util.contact_floor_reason`).\n\n```bash\ncd \"$REPO\" && uv run --project . python packs/ingestion/primitives/imports/messages/importer.py run\n```\n\nReport the manifest's `stats.people` and `stats.candidates`; both count the\nsource candidates. Deep Context combines source files before processing them.\n\n### Step 4 \u2014 Suggest next sources & processing\n\nCheck which sources are imported and suggest the missing ones (skip the ones\nalready present):\n\n```bash\ncd \"$REPO\" && uv run --project . python packs/ingestion/primitives/imports/status.py status\n```\n\n- `gmail.import.imported: false` \u2192 suggest **`$import-gmail`** (email contacts\n  sharpen matching and give `$deep-context` cross-channel context).\n- `linkedin.import.imported: false` \u2192 suggest syncing LinkedIn through setup\n  (LinkedIn is the identity backbone): rerun the `retry_command` saved in\n  `.powerpacks/install/manifest.json`, or the install skill on a first run.\n- Report candidate counts (`import.candidates` per source) so the user knows how\n  many contacts are waiting for research.\n\nThen ask, **in plain product words grounded in what the status check just\nfound \u2014 name the imported sources, never the skill**. Pattern:\n\n> \"I see Gmail and LinkedIn are imported alongside iMessage/WhatsApp \u2014 do you\n> want to enrich your contacts?\"\n\n(Adapt the source list to what's actually imported; `$deep-context` is the\ninternal route \u2014 do not say its name or describe its machinery in the ask.)\nIf yes \u2192 run the `$deep-context` flow. If no \u2192 say their new contacts become\nsearchable after the next enrichment run; nothing is lost, the candidates\nstay staged.\n\n---\n\n## Done\n\nReport channels linked, contacts discovered/imported, and whether the user chose\nto process now. Imports stay staged until Deep Context combines and processes\nthe sources. Rerunning this skill repeats the checklist using the existing stores.\n", "mcp_count": 0, "mcp_refs": [], "name": "import-messages", "pack": "ingestion", "path": "packs/ingestion/skills/import-messages/SKILL.md", "primitive_count": 3, "primitive_refs": ["discover", "imports", "install"]}, {"description": "Import or smoke-test Twitter/X network artifacts through the RapidAPI + MOE + LinkedIn resolution pipeline. Use for $import-twitter.", "display_name": "powerset:import-twitter", "heading": "import-twitter", "markdown": "---\nname: import-twitter\ndescription: Import or smoke-test Twitter/X network artifacts through the RapidAPI + MOE + LinkedIn resolution pipeline. Use for $import-twitter.\n---\n\n# import-twitter\n\nUse this skill for `$import-twitter` or Twitter/X network import testing.\n\nThis is an alias/wrapper around `discover/twitter/network_import.py`. It is\nmanifest-only: one idempotent `run` per handle writes the fixed dir\n`.powerpacks/network-import/discover/twitter/<handle>/` (overwritten in place)\nplus a single `manifest.json`. The RapidAPI-backed crawl and the OpenAI/RapidAPI\nresolution steps are spend-bearing and run only with `--approve-spend`.\n\n## 10-row sanity command\n\nWithout `--approve-spend`, `run` stops at the first spend step and emits a\n`needs_approval` manifest naming the step + estimated calls:\n\n```bash\nuv run --project . python packs/ingestion/primitives/discover/twitter/network_import.py run \\\n  --handle example_operator \\\n  --max-pages 1 \\\n  --limit 10 \\\n  --min-score 0\n```\n\nApprove the spend by re-running the same command with `--approve-spend`; it\nadvances the whole pipeline in one pass and never re-spends steps whose output\nis already on disk:\n\n```bash\nuv run --project . python packs/ingestion/primitives/discover/twitter/network_import.py run \\\n  --handle example_operator \\\n  --max-pages 1 \\\n  --limit 10 \\\n  --min-score 0 \\\n  --approve-spend \\\n  --linkedin-workers 10 \\\n  --aggregator-workers 10\n```\n\nInspect progress any time from the manifest (no spend):\n\n```bash\nuv run --project . python packs/ingestion/primitives/discover/twitter/network_import.py status --handle example_operator\n```\n\n## Notes\n\n- Requires a RapidAPI Twitter key subscribed to `twitter241` (`RAPIDAPI_TWITTER_KEY` or legacy `RAPIDAPI_KEY`).\n- MOE uses OpenAI and is spend-gated behind `--approve-spend`; do not run deep research for this smoke.\n- LinkedIn validation uses the Powerset gateway (`POWERSET_API_KEY`) and is spend-gated behind `--approve-spend`.\n- Resume is by artifact: a rerun skips steps whose fixed output CSV is already present, so it never re-crawls or re-spends. Delete the handle dir to force a clean re-run.\n- Final output should include `people.csv`; summarize as `x/10 linkedins` plus counts, not raw rows.\n\nAfter Twitter finishes, rebuild the merged network and local index with the\nindexing fan-in:\n`uv run --project . python packs/indexing/primitives/index_contacts_pipeline/index_contacts_pipeline.py run --operator-id <operator-id>`.\n", "mcp_count": 0, "mcp_refs": [], "name": "import-twitter", "pack": "ingestion", "path": "packs/ingestion/skills/import-twitter/SKILL.md", "primitive_count": 2, "primitive_refs": ["discover", "index_contacts_pipeline"]}, {"description": "Download EVERYTHING for a set of people across Gmail, iMessage, and WhatsApp and format it into a faithful, verbatim raw markdown archive \u2014 one file per email thread / DM / group, ## YYYY headings inside, append-only incremental sync. The inverse of $deep-context (which synthesizes facts and discards text). Use for $logbook, \"build a raw logbook\", \"archive all my messages with these people\", \"dump every email/text/whatsapp with X verbatim\", \"logbook from this CSV\".", "display_name": "powerset:logbook", "heading": "logbook", "markdown": "---\nname: logbook\ndescription: Download EVERYTHING for a set of people across Gmail, iMessage, and WhatsApp and format it into a faithful, verbatim raw markdown archive \u2014 one file per email thread / DM / group, ## YYYY headings inside, append-only incremental sync. The inverse of $deep-context (which synthesizes facts and discards text). Use for $logbook, \"build a raw logbook\", \"archive all my messages with these people\", \"dump every email/text/whatsapp with X verbatim\", \"logbook from this CSV\".\n---\n\n<!--\nCreated: 2026-06-25\nChangelog:\n- 2026-10-12: People's logbook action is a book icon beside the drawer's Close; the Has\n  logbook filter is gone (the reader lists every saved logbook).\n- 2026-09-30: People page reads saved logbooks in-app (Logbook reader, Has logbook\n  filter); the ZIP download is gone.\n- 2026-09-30: WhatsApp reads include `@lid` chats and groups where the person is a\n  silent participant; export stages each entry so a failed read keeps the old\n  archive; unreadable chat.db reports `unreadable`; memory and sync-order notes\n  corrected.\n- 2026-09-30: People page \"Build logbook\" (selected people, in-process, no CSV);\n  export keeps other entries and moves rebuilt files to `<slug>.bkup-<utc>/`;\n  missing/unreadable channels are reported and left untouched.\n- 2026-06-25: Initial skill. Raw verbatim archive (no LLM, no network, no spend) from a\n  people CSV. Streaming readers (uncapped, group-aware) reuse deep_context.context_sources for the\n  msgvault connection, attributedBody decoding, and immutable chat.db open. One entry per\n  person OR group (slug = person/group name); one file per email thread / DM / group;\n  ## YYYY headings inside; stable ids (gmail thread id + message id + historyId, wacli\n  chat_jid + msg_id + rowid, chat.db chat guid + ROWID) in frontmatter + manifest. export =\n  full rebuild; sync = append-only incremental keyed on a monotonic per-channel watermark.\n-->\n\n# logbook\n\nUse this for `$logbook`, \"build a raw logbook\", \"archive everything I've said\nwith these people\", or \"dump every email/text/WhatsApp with <person> verbatim\".\n\nIt builds a **faithful, verbatim raw archive** of your conversations with a list\nof people: every Gmail thread, every iMessage/WhatsApp DM, and group chats \u2014\nformatted into readable markdown. **No LLM, no network, no spend** \u2014 every read is\na local SQLite query, so it's fast and free. This is the *inverse* of\n`$deep-context`: that skill synthesizes facts and throws the text away; this one\nkeeps the text.\n\n## Defaults \u2014 this is NOT `$deep-context`. Do not borrow its defaults.\n\n`$logbook` has its OWN behavior. Even though it shares low-level readers with\n`$deep-context`, **none of deep-context's caps or opt-ins apply here**:\n\n- **NO message cap.** Download EVERYTHING. deep-context caps pooled messages at\n  1600 per person \u2014 `$logbook` does not. Never apply a 1600 (or any) message cap.\n- **Groups are ON by default** (DMs *and* every group a person is in, both chat\n  channels). deep-context makes group bodies opt-in; `$logbook` includes them by\n  default. Use `--no-groups` only if the user explicitly asks to exclude groups.\n- **Deepen ALWAYS** (step 3 below) \u2014 it is not optional and you do not ask to skip.\n- **There is no `--force` flag.** If the user says \"force\"/\"refresh\", they mean\n  rebuild from scratch: that's just `export`. It rebuilds only the CSV's entries,\n  moves their prior files to `<slug>.bkup-<utc>/`, and keeps every other entry.\n  Do not invent flags.\n- **When a request is genuinely ambiguous, ASK** \u2014 do not silently pick a\n  conservative default. \"Everything\" means everything; if you're unsure of scope,\n  ask the user rather than quietly narrowing it.\n\nOutput lives under `.powerpacks/logbook/` (gitignored):\n\n```\n.powerpacks/logbook/\n  <slug>/                      slug = person name OR group name\n    gmail/<year>-<subject>-<hash>.md   one file per email thread\n    imessage/dm.md\n    whatsapp/dm.md\n  <group-slug>/whatsapp/group.md       groups are their own top-level entry\n  index.md                     catalog (entries, files, message counts, channels)\n  manifest.json                counts + per-container stable-id watermarks (sync state)\n```\n\nEach file has YAML frontmatter (`entry, channel, kind, container_id, title,\ncreated_at`), then `## YYYY` sections of `**<date> \u00b7 <sender>:** <verbatim body>`.\n\n## Privacy\n\nThis skill reads AND persists **verbatim message bodies**, including **group\nchats** \u2014 a deliberate, second scoped exception to the metadata-only privacy\ncontract (`$deep-context` is the first, but it's DM-only and synthesized). Bodies\nare written to `.powerpacks/logbook/` which is **gitignored**; nothing is sent\nanywhere. **Groups are included by default** (this is \"everything\"); pass\n`--no-groups` to limit to DMs/threads. Surface this once so the user knows\nverbatim group bodies are being archived.\n\n## Run it in YOUR terminal (Full Disk Access)\n\niMessage reads need `chat.db`, which requires **Full Disk Access**. The Claude\nCode Bash tool runs under a helper that does NOT inherit your terminal's FDA, so\niMessage reads can come back empty there. For the iMessage channel, run\n`bin/logbook ...` directly in a terminal that has Full Disk Access (e.g. Ghostty).\nGmail (msgvault) and WhatsApp (wacli) read fine from anywhere.\n\n## Flow\n\n1. **Ask for the CSV.** \"Point me to your CSV of people to build a logbook for.\"\n   Accepted shapes (auto-detected):\n   - founder CSV: `Founder, Cell, Emails, WhatsApp Groups` (Cell = comma-separated\n     phones; Emails = `;`-separated; the group cell names one group to archive).\n   - the merged `people.csv` (canonical network-import schema).\n\n2. **Check reachability** (read-only, free) \u2014 confirms we can actually reach these\n   people per channel and how deep each store goes:\n   ```bash\n   bin/logbook check --csv \"<path>\"\n   ```\n   Report per-channel `status` + earliest/latest dates. If iMessage is\n   `unreadable`, the usual cause is missing Full Disk Access (grant it or run in\n   their terminal); a corrupt chat.db reads the same way.\n\n3. **Deepen the local stores \u2014 ALWAYS. Not optional, do not ask, do not offer to\n   skip.** \"Everything\" means deepest-available, so deepen is part of every run. It\n   is FREE (no per-message cost). Just run it:\n   ```bash\n   bin/logbook deepen --csv \"<path>\" --run --rounds 3\n   ```\n   `deepen` is **scoped to the CSV people's chats** (their DMs + groups, by jid) \u2014 it\n   does NOT backfill the user's entire WhatsApp. Do NOT print an estimate as a gate\n   and do NOT ask \"skip deepen?\" \u2014 just deepen, then export. (WhatsApp may connect to\n   the user's phone; mention that in passing, but still run it.) Per-channel depth:\n   - **iMessage** \u2014 `chat.db` is already complete locally (beginning-of-time); deepen is a no-op.\n   - **Gmail (msgvault)** \u2014 backfills the whole mailbox (`gmail.py discover --fresh`, OAuth, free).\n   - **WhatsApp (wacli)** \u2014 shallow by default; deepen runs scoped\n     `wacli history backfill --chat <jid> --requests <rounds>` (on-demand sync\n     from the primary phone). Depth is bounded by what the phone still holds, so\n     full WhatsApp history is not guaranteed.\n\n4. **Export** (full build \u2014 all channels + all groups by default):\n   ```bash\n   bin/logbook export --csv \"<path>\"                     # everything (all channels + groups)\n   bin/logbook export --csv \"<path>\" --channels gmail    # one channel\n   bin/logbook export --csv \"<path>\" --no-groups         # DMs/threads only\n   bin/logbook export --csv \"<path>\" --slug <one-slug>   # just one person/group\n   ```\n   Then point the user at `.powerpacks/logbook/index.md`.\n\n5. **Sync** later (incremental, **append-only** \u2014 never overwrites). Reads the\n   per-channel watermark from `manifest.json`, pulls only messages the stores got\n   since, and appends them to the existing files. The watermark is store insertion\n   order, so history deepened after the last sync is appended at the end, out of\n   date order \u2014 run `export` after a deepen to get date order back:\n   ```bash\n   bin/logbook sync --csv \"<path>\"\n   ```\n   Re-running with nothing new is a no-op.\n\n## From the People page\n\nOpen the People page \u2192 select people and press **Build logbook** on the selection bar, or open\none person and press the book icon beside Close.\nIt runs the same export for exactly those people (every candidate's email and phone\nunder each parent; no Worth or share filter), over every date the local stores\nhold, groups included. It reads only what is already synced \u2014 no deepen, no\nnetwork \u2014 and says which channel was missing or unreadable. When it finishes the\npage opens the Logbook reader on what it built; **Back to People** (or browser\nBack) returns to the same list. Saved logbooks stay readable after a restart: the reader\nlists them all, and a person's book icon (or **View logbook** on a selection) opens theirs.\nNothing is uploaded with Share.\n\n## Notes\n\n- **Memory:** one output file open at a time. Gmail streams one message at a time;\n  iMessage and WhatsApp load one conversation (a person's DMs or one group) at a\n  time, so memory follows the largest single conversation.\n- **Stable ids for dedupe/sync** live in each file's frontmatter (`container_id`)\n  and the manifest watermark map: Gmail thread id + message id (+ `sources.sync_cursor`\n  historyId), wacli `chat_jid` + `msg_id` + `rowid`, chat.db `chat.guid` + `ROWID`.\n  Sync filters on those increasing ids. A failed append can leave unrecorded lines;\n  run `export` to rebuild after a failure. IDs follow insertion, not message date.\n- **Raw fidelity:** bodies are kept verbatim (quoted reply chains, signatures,\n  `[cid:...]` image refs and all) \u2014 this is a raw archive, not a summary.\n- Group entries are keyed by group name (their own top-level slug), so a shared\n  group is written once, not duplicated under every member.\n", "mcp_count": 0, "mcp_refs": [], "name": "logbook", "pack": "ingestion", "path": "packs/ingestion/skills/logbook/SKILL.md", "primitive_count": 1, "primitive_refs": ["logbook"]}, {"description": "Set up msgvault for local Gmail archive access, including install/status, browser-assisted Google OAuth Desktop app creation, client_secret config, and account auth. Use for `$msgvault`, `msgvault setup`, `msgvault status`, `msgvault add-account`, or `powerset create oauth app` when the target is Gmail/msgvault OAuth.", "display_name": "powerset:msgvault", "heading": "msgvault", "markdown": "---\nname: msgvault\ndescription: Set up msgvault for local Gmail archive access, including install/status, browser-assisted Google OAuth Desktop app creation, client_secret config, and account auth. Use for `$msgvault`, `msgvault setup`, `msgvault status`, `msgvault add-account`, or `powerset create oauth app` when the target is Gmail/msgvault OAuth.\n---\n\n# msgvault\n\nUse this skill when the user wants local Gmail archive setup through msgvault or\nasks to create a
