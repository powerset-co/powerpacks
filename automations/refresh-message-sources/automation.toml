version = 1
id = "refresh-message-sources"
kind = "cron"
name = "Refresh message sources"
prompt = """
${prompt}

Finish with a heartbeat block the Codex App reads to decide whether to notify:
- every source refreshed or not connected: archive this thread with
  codex_app__set_thread_archived (archived: true), then end with
  <heartbeat><decision>DONT_NOTIFY</decision></heartbeat>
- otherwise: leave the thread open and end with
  <heartbeat><decision>NOTIFY</decision><message>the one-line problem</message></heartbeat>
"""
status = "ACTIVE"
rrule = "RRULE:FREQ=DAILY;BYHOUR=6;BYMINUTE=0"
model = "gpt-6-sol"
reasoning_effort = "low"
execution_environment = "local"
cwds = ["${workspace}"]
