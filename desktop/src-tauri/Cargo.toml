[package]
name = "powerpacks-desktop"
version = "0.1.0"
description = "Powerpacks desktop app"
edition = "2021"
publish = false

[lib]
name = "powerpacks_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = ["unstable"] }
tauri-plugin-opener = "2.7.0"
tauri-plugin-single-instance = "2.5.2"
tauri-plugin-dialog = "2.8.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "signal", "macros"] }
dirs = "6"
url = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
