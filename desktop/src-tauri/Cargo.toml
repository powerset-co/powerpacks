[package]
name = "powerpacks-desktop"
version = "3.43.1"
description = "Powerpacks desktop app"
edition = "2021"
publish = false

[lib]
name = "powerpacks_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = ["unstable", "macos-private-api"] }
tauri-plugin-opener = "2.7.0"
tauri-plugin-single-instance = "2.5.2"
tauri-plugin-dialog = "2.8.1"
# macOS uses tar archives; the optional Windows ZIP dependency is entirely yanked.
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "signal", "macros"] }
dirs = "6"
url = "2"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.25"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSDragging", "NSDraggingItem", "NSDraggingSession", "NSEvent", "NSGraphicsContext", "NSImage", "NSPasteboard", "NSResponder", "NSView", "NSWindow", "NSWorkspace", "NSRunningApplication", "NSScreen", "libc"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSObject", "NSString", "NSURL", "NSGeometry"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
